<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://learningmate-lab.github.io/track.js" data-site="react-exam-lab" defer></script>
<title>React 중간고사 연습실 · 러닝메이트</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>/* React 중간고사 연습실 — 러닝메이트(연암공과대학교) 브랜드 색 */
:root {
  color-scheme: light;
  --bg: #f6f8f8; --card: #ffffff; --fg: #171a1c; --mut: #56595c; --line: #d9ddde; --input: #c9ced0;
  --pri: #286b82; --pri-h: #20576b; --pri-soft: #e7f3f7;
  --red: #d81247; --red-soft: #fce7ec; --blue: #559cb5; --gray: #6d6e71;
  --ok: #236c50; --ok-soft: #e4f2ea; --warn: #8a4d08; --warn-soft: #fff0dc;
  --code: #1e1e1e;
  /* 영역 색: 학교 심벌의 청록 · 하늘 · 회색 · 빨강 */
  --a1: #286b82; --a2: #559cb5; --a3: #6d6e71; --a4: #d81247;
  --ui: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: Consolas, "D2Coding", "Courier New", monospace;
  /* 예전 변수 이름(스크립트 안 인라인 스타일)과 맞춤 */
  --c-mut: var(--mut);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
button { font-family: inherit; }
.page { position: fixed; inset: 0; overflow: auto; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--ui); -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; line-height: 1.3; text-decoration: none; }
.btn:hover { border-color: var(--pri); color: var(--pri); }
.btn:focus-visible, .acard:focus-visible, .brand:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: var(--pri-h); border-color: var(--pri-h); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }
.btn.lg { padding: 13px 22px; font-size: 15.5px; border-radius: 12px; }
.btn.sm { padding: 6px 12px; font-size: 13.5px; border-radius: 8px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--mut); font-weight: 600; }
.btn.quiet:hover { color: var(--red); border-color: transparent; }
.btn .cnt { min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* ---------- 상단 막대 ---------- */
.topbar { position: sticky; top: 0; z-index: 5; background: #fffffff2; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.tb-in { max-width: 1120px; margin: 0 auto; height: 58px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px 4px 0; cursor: pointer; color: var(--fg); font-size: 15px; min-width: 0; border-radius: 8px; }
.brand img { width: 30px; height: 29px; flex: none; }
.brand b { font-weight: 800; letter-spacing: -.2px; color: var(--pri); white-space: nowrap; }
.brand .sep { color: var(--input); }
.brand .tb-t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-r { display: flex; align-items: center; gap: 8px; flex: none; }
.tm { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px; color: var(--pri); background: var(--pri-soft); padding: 5px 12px; border-radius: 8px; white-space: nowrap; }
.tm.low { color: #fff; background: var(--red); }

/* ---------- 홈 ---------- */
.home { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 240px; align-items: center; gap: 24px; background: linear-gradient(135deg, #ffffff 0%, var(--pri-soft) 100%); border: 1px solid var(--line); border-radius: 20px; padding: 32px 36px; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -60px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: #ffd23f33; }
.hero > * { position: relative; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--red); letter-spacing: .4px; }
.hero h1 { margin: 0; font-size: 32px; line-height: 1.3; letter-spacing: -.6px; text-wrap: balance; }
.lead { margin: 12px 0 0; color: var(--mut); max-width: 58ch; }
.lead b { color: var(--fg); }
.dday { margin-top: 18px; display: inline-flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 18px 10px 12px; max-width: 100%; }
.dday > b { font-size: 26px; font-weight: 800; color: #fff; background: var(--red); border-radius: 10px; padding: 2px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dday > span { display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }
.dd-date { font-weight: 700; font-size: 14px; }
.dd-small { color: var(--mut); font-size: 13px; }
.hero-cta { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.mascot { width: 230px; height: auto; justify-self: center; filter: drop-shadow(0 10px 18px #286b8222); }

.home section { margin-top: 30px; }
.home h2 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
.comp { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; }
.wbar { display: flex; gap: 3px; height: 14px; margin-top: 14px; }
.wbar i { display: block; border-radius: 4px; }
.wbar .a1 { background: var(--a1); } .wbar .a2 { background: var(--a2); } .wbar .a3 { background: var(--a3); } .wbar .a4 { background: var(--a4); }
.wlab { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 14px; color: var(--mut); }
.wlab span { flex: none !important; white-space: nowrap; }
.wlab b { color: var(--fg); }
.wlab span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; background: var(--a1); }
.wlab span:nth-child(2)::before { background: var(--a2); } .wlab span:nth-child(3)::before { background: var(--a3); } .wlab span:nth-child(4)::before { background: var(--a4); }
.comp .note { margin: 12px 0 0; font-size: 13px; color: var(--mut); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h .sum { color: var(--mut); font-size: 13.5px; }
.sec-h .sum b { color: var(--fg); font-variant-numeric: tabular-nums; }
.areas { margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.acard { --ac: var(--a1); text-align: left; display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--ac); border-radius: 14px; padding: 16px 16px 14px; cursor: pointer; color: var(--fg); font: inherit; transition: transform .12s, box-shadow .12s; }
.acard:hover { transform: translateY(-2px); box-shadow: 0 10px 22px #171a1c14; }
.acard.a2 { --ac: var(--a2); } .acard.a3 { --ac: var(--a3); } .acard.a4 { --ac: var(--a4); }
.a-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.a-top b { font-size: 18px; white-space: nowrap; }
.a-w { font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.a-d { color: var(--mut); font-size: 13.5px; line-height: 1.55; min-height: 42px; }
.a-cnt { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
.a-cnt b { color: var(--fg); font-variant-numeric: tabular-nums; }
.prog { position: relative; height: 6px; border-radius: 3px; background: #eceeef; overflow: hidden; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.prog .dn { background: #c9ced0; }
.prog .ok { background: var(--ac); }
.a-go { font-weight: 800; font-size: 13.5px; color: var(--ac); }
.tools { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools .quiet { margin-left: auto; }
.foot-note { margin-top: 28px; color: var(--mut); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .acard { transition: none; } .acard:hover { transform: none; } }

/* ---------- 문제 화면 ---------- */
.cbt { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.cbt .topbar { position: static; }
.cbt .tb-in { max-width: none; }
.cbt-body { display: grid; grid-template-columns: minmax(0, 1fr) 270px; min-height: 0; }
.qwrap { overflow: auto; padding: 26px 32px 80px; }
.qcard { max-width: 860px; margin: 0 auto; }
.qhead { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 13px; margin-bottom: 10px; flex-wrap: wrap; }
.qn { font-weight: 800; color: var(--fg); font-size: 18px; margin-right: 2px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #eceeef; color: #3c4043; }
.tag.k { background: var(--pri-soft); color: var(--pri); }
.qtext { font-size: 17px; font-weight: 700; line-height: 1.65; margin: 0 0 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; font-size: 15px; line-height: 1.55; color: var(--fg); overflow-wrap: anywhere; }
.opt:hover { border-color: var(--blue); }
.opt .mk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--input); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--mut); }
.opts.multi .opt .mk { border-radius: 6px; }
.opt.on { border-color: var(--pri); background: var(--pri-soft); }
.opt.on .mk { background: var(--pri); border-color: var(--pri); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mk { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .mk { background: var(--red); border-color: var(--red); color: #fff; }
.opt code, .qtext code, .exp code, .ri code { font-family: var(--mono); font-size: .92em; background: #eceeef; padding: 0 4px; border-radius: 4px; }

/* 코드 (어두운 편집기 색 그대로) */
.code { background: var(--code); color: #d4d4d4; border-radius: 12px; padding: 12px 0; font: 14px/1.6 var(--mono); overflow: auto; margin: 0 0 16px; max-width: 100%; }
.code .cl { display: grid; grid-template-columns: 44px minmax(0, 1fr); padding-right: 16px; white-space: pre; }
.code .cl .n { color: #6e7681; text-align: right; padding-right: 14px; user-select: none; }
.code.pick .cl { cursor: pointer; }
.code.pick .cl:hover { background: #ffffff14; }
.code .cl.on { background: #559cb566; }
.code .cl.right { background: #236c5099; }
.code .cl.wrong { background: #d8124766; }
.code input.blank { font: inherit; width: 14ch; background: #2a2f3a; color: #fff; border: 1px solid #5a6478; border-radius: 4px; padding: 0 6px; outline: none; }
.code input.blank:focus { border-color: #8fd0ea; }
.code input.blank.right { border-color: #3fb27f; background: #236c5099; }
.code input.blank.wrong { border-color: #ff6b8e; background: #d8124766; }
.hl-k { color: #569cd6; } .hl-c { color: #c586c0; } .hl-s { color: #ce9178; } .hl-n { color: #b5cea8; } .hl-cm { color: #6a9955; } .hl-f { color: #dcdcaa; } .hl-t { color: #4ec9b0; } .hl-a { color: #9cdcfe; } .hl-tag { color: #569cd6; } .hl-p { color: #808080; }

.qact { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
.exp { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); line-height: 1.7; overflow-wrap: anywhere; }
.exp.ok { border-color: #9cc9b4; background: var(--ok-soft); }
.exp.no { border-color: #f0a3b8; background: var(--red-soft); }
.exp b.r { color: var(--ok); } .exp b.w { color: var(--red); }
.exp .fix { margin-top: 8px; font-family: var(--mono); font-size: 13.5px; background: var(--code); color: #d4d4d4; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }

/* 서술형 · 코드 작성 */
textarea.essay { display: block; width: 100%; min-height: 190px; resize: vertical; font: 15.5px/1.75 var(--ui); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--fg); outline: none; }
textarea.essay:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
textarea.essay.mono { font: 14px/1.6 var(--mono); background: var(--code); color: #d4d4d4; border-color: #333; min-height: 260px; tab-size: 2; white-space: pre; }
textarea.essay.mono:focus { border-color: var(--blue); box-shadow: none; }
textarea.essay[readonly] { opacity: .85; }
.ecount { text-align: right; font-size: 12.5px; color: var(--mut); margin-top: 4px; font-variant-numeric: tabular-nums; }
.essay-res .eh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.essay-res .esc { font-weight: 800; font-size: 18px; color: var(--pri); font-variant-numeric: tabular-nums; }
.essay-res .ans-t { margin: 0 0 4px; }
.essay-res .code { margin: 4px 0; }
.rub { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.rub .rh { font-size: 13px; color: var(--mut); }
.rub .ri { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-size: 14.5px; }
.rub .ri input { width: 18px; height: 18px; accent-color: var(--ok); margin: 0; }
.rub .ri.on { border-color: #9cc9b4; background: var(--ok-soft); }
.rub .ri b { font-variant-numeric: tabular-nums; color: var(--mut); white-space: nowrap; }
.rub .ri.on b { color: var(--ok); }
.ex2 { margin-top: 10px; font-size: 14px; color: var(--mut); }

/* 오른쪽 패널 */
.side { border-left: 1px solid var(--line); background: var(--card); overflow: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.side h4 { margin: 0; font-size: 13px; color: var(--mut); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grid button { height: 34px; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--mut); font-variant-numeric: tabular-nums; }
.grid button.ans { background: var(--pri-soft); color: var(--pri); border-color: #b9dbe6; }
.grid button.cur { border-color: var(--pri); color: var(--pri); box-shadow: 0 0 0 2px var(--pri-soft); }
.grid button.ok { background: var(--ok-soft); border-color: #9cc9b4; color: var(--ok); }
.grid button.no { background: var(--red-soft); border-color: #f0a3b8; color: var(--red); }
.side .flt { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.side select { color: var(--fg); font: inherit; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.side .stat { font-size: 13.5px; color: var(--mut); }
.side .stat b { color: var(--fg); }

/* ---------- 채점 · 결과 ---------- */
.report { max-width: 880px; margin: 0 auto; padding: 30px 20px 80px; }
.report h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.4px; }
.rep-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: linear-gradient(135deg, #fff 0%, var(--pri-soft) 100%); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
.rep-sub { margin: 0; color: var(--mut); }
.big { font-size: 56px; font-weight: 800; letter-spacing: -1px; color: var(--pri); line-height: 1.2; margin-top: 8px; font-variant-numeric: tabular-nums; }
.big span { font-size: 22px; color: var(--mut); font-weight: 700; }
.rep-msg { margin: 4px 0 0; font-weight: 700; }
.rep-mascot { width: 130px; height: auto; flex: none; }
.rows { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.rrow b { font-variant-numeric: tabular-nums; }
.rrow .bar { grid-column: 1 / 3; height: 8px; border-radius: 4px; background: #eceeef; overflow: hidden; }
.rrow .bar i { display: block; height: 100%; background: var(--pri); }
.rows .rrow:nth-child(2) .bar i { background: var(--a2); }
.rows .rrow:nth-child(3) .bar i { background: var(--a3); }
.rows .rrow:nth-child(4) .bar i { background: var(--a4); }
.sg .sg-lead { color: var(--mut); margin: 0 0 6px; }
.sg-item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 16px; }
.sg-item h4 { margin: 4px 0 6px; font-size: 13.5px; color: var(--mut); }
.sg-item .qtext { font-size: 16px; margin-bottom: 10px; }
pre.mine { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14.5px/1.65 var(--ui); margin: 0; }
pre.mine.mono { font-family: var(--mono); font-size: 13.5px; }
.mine-none { margin: 0; color: var(--red); font-size: 14px; }

/* ---------- 대화상자 ---------- */
.dlg-back { position: fixed; inset: 0; z-index: 100; background: #171a1c66; display: grid; place-items: center; padding: 16px; }
.dlg { width: 440px; max-width: 100%; background: #fff; color: var(--fg); border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 20px 50px #0004; font: 15px/1.6 var(--ui); border-top: 4px solid var(--pri); }
.dlg-t { font-weight: 800; font-size: 17px; }
.dlg-m { margin-top: 8px; color: var(--mut); font-size: 14.5px; }
.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.dlg-btn { border: 1px solid var(--line); background: #fff; color: var(--fg); border-radius: 10px; padding: 9px 18px; font-weight: 700; cursor: pointer; font-size: 14px; }
.dlg-btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.dlg-btn:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }

/* ---------- 좁은 화면 ---------- */
@media (max-width: 980px) {
  .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .cbt { height: auto; min-height: 100%; }
  .cbt-body { grid-template-columns: 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .qwrap { padding: 18px 16px 30px; overflow: visible; }
}
@media (max-width: 720px) {
  .tb-in { padding: 0 16px; height: 54px; }
  .brand .sep, .brand b { display: none; }
  .home { padding: 16px 16px 40px; }
  .hero { grid-template-columns: 1fr; padding: 22px 18px; gap: 4px; }
  .hero h1 { font-size: 24px; }
  .mascot { position: absolute; right: 6px; top: 8px; width: 78px; }
  .hero .eyebrow, .hero h1 { padding-right: 76px; }
  .dday { gap: 10px; padding: 8px 12px 8px 8px; }
  .dday > b { font-size: 21px; padding: 2px 10px; }
  .hero-cta .btn { flex: 1 1 auto; }
  .comp { padding: 16px; }
  .wlab { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 13px; }
  .areas { grid-template-columns: 1fr; }
  .a-d { min-height: 0; }
  .tools .quiet { margin-left: 0; }
  .report { padding: 18px 16px 60px; }
  .rep-hero { padding: 18px; }
  .rep-mascot { width: 84px; }
  .big { font-size: 44px; }
  .sg-item { padding: 14px; }
}
</style>
</head>
<body>
