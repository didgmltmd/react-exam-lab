iv className=\"value\">{balance.toLocaleString()}원<\/div>\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default ExpenseSummary;\n"}, "tests": [{"name": "지출 추가 버튼을 누르면 목록에 지출 항목이 추가되고 입력창이 비워진다", "points": 25, "body": "const num = (s) => Number(String(s).replace(/[^0-9.-]/g, ''));\nconst items = () => t.$$('.ExpenseItem');\nconst find = (d) => items().find((el) => t.text(el.querySelector('.description_col')) === d);\nconst sum = (cls) => num(t.text('.ExpenseSummary .' + cls + ' .value'));\nconst add = async (type, d, a) => {\n  await t.type('.ExpenseEditor .desc_input', d);\n  await t.type('.ExpenseEditor .amount_input', String(a));\n  await t.wait(30);\n  await t.click(type === 'income' ? '.ExpenseEditor .income_btn' : '.ExpenseEditor .expense_btn');\n  await t.wait(30);\n};\nawait add('expense', '점심', 8000);\nt.expect(items().length === 1, '지출을 추가하면 목록에 항목이 1개 보여야 해요 (현재: ' + items().length + '개)');\nconst it = find('점심');\nt.expect(!!it, '추가한 내용 \"점심\"이 목록에 보여야 해요');\nt.expect(t.text(it.querySelector('.type_col')) === '지출', '구분이 \"지출\"로 표시되어야 해요');\nt.expect(Math.abs(num(t.text(it.querySelector('.amount_col')))) === 8000, '금액 8,000이 표시되어야 해요 (현재: ' + t.text(it.querySelector('.amount_col')) + ')');\nt.expect(t.$('.ExpenseEditor .desc_input').value === '' && t.$('.ExpenseEditor .amount_input').value === '', '추가한 뒤 내용/금액 입력창이 모두 비워져야 해요');"}, {"name": "수입 추가 버튼을 누르면 '수입' 항목으로 추가된다", "points": 15, "body": "const num = (s) => Number(String(s).replace(/[^0-9.-]/g, ''));\nconst items = () => t.$$('.ExpenseItem');\nconst find = (d) => items().find((el) => t.text(el.querySelector('.description_col')) === d);\nconst sum = (cls) => num(t.text('.ExpenseSummary .' + cls + ' .value'));\nconst add = async (type, d, a) => {\n  await t.type('.ExpenseEditor .desc_input', d);\n  await t.type('.ExpenseEditor .amount_input', String(a));\n  await t.wait(30);\n  await t.click(type === 'income' ? '.ExpenseEditor .income_btn' : '.ExpenseEditor .expense_btn');\n  await t.wait(30);\n};\nawait add('income', '용돈', 50000);\nconst it = find('용돈');\nt.expect(!!it, '추가한 내용 \"용돈\"이 목록에 보여야 해요');\nt.expect(t.text(it.querySelector('.type_col')) === '수입', '구분이 \"수입\"으로 표시되어야 해요 (현재: ' + t.text(it.querySelector('.type_col')) + ')');\nt.expect(Math.abs(num(t.text(it.querySelector('.amount_col')))) === 50000, '금액 50,000이 표시되어야 해요');"}, {"name": "총 수입, 총 지출, 잔액이 내역에 맞게 계산된다", "points": 30, "body": "const num = (s) => Number(String(s).replace(/[^0-9.-]/g, ''));\nconst items = () => t.$$('.ExpenseItem');\nconst find = (d) => items().find((el) => t.text(el.querySelector('.description_col')) === d);\nconst sum = (cls) => num(t.text('.ExpenseSummary .' + cls + ' .value'));\nconst add = async (type, d, a) => {\n  await t.type('.ExpenseEditor .desc_input', d);\n  await t.type('.ExpenseEditor .amount_input', String(a));\n  await t.wait(30);\n  await t.click(type === 'income' ? '.ExpenseEditor .income_btn' : '.ExpenseEditor .expense_btn');\n  await t.wait(30);\n};\nawait add('income', '월급', 50000);\nawait add('expense', '교통비', 12000);\nawait add('expense', '커피', 3000);\nt.expect(items().length === 3, '내역 3개가 추가되어야 해요 (현재: ' + items().length + '개)');\nt.expect(sum('income') === 50000, '총 수입은 50,000원이어야 해요 (현재: ' + t.text('.ExpenseSummary .income .value') + ')');\nt.expect(Math.abs(sum('expense')) === 15000, '총 지출은 15,000원이어야 해요 (현재: ' + t.text('.ExpenseSummary .expense .value') + ')');\nt.expect(sum('balance') === 35000, '잔액은 35,000원이어야 해요 (현재: ' + t.text('.ExpenseSummary .balance .value') + ')');"}, {"name": "삭제 버튼을 누르면 항목이 삭제되고 요약도 갱신된다", "points": 20, "body": "const num = (s) => Number(String(s).replace(/[^0-9.-]/g, ''));\nconst items = () => t.$$('.ExpenseItem');\nconst find = (d) => items().find((el) => t.text(el.querySelector('.description_col')) === d);\nconst sum = (cls) => num(t.text('.ExpenseSummary .' + cls + ' .value'));\nconst add = async (type, d, a) => {\n  await t.type('.ExpenseEditor .desc_input', d);\n  await t.type('.ExpenseEditor .amount_input', String(a));\n  await t.wait(30);\n  await t.click(type === 'income' ? '.ExpenseEditor .income_btn' : '.ExpenseEditor .expense_btn');\n  await t.wait(30);\n};\nawait add('income', '용돈', 10000);\nawait add('expense', '간식', 4000);\nt.expect(items().length === 2, '내역 2개가 추가되어야 해요');\nt.expect(sum('balance') === 6000, '삭제 전 잔액은 6,000원이어야 해요 (현재: ' + t.text('.ExpenseSummary .balance .value') + ')');\nt.expect(!!find('간식'), '\"간식\" 항목을 찾을 수 없어요');\nawait t.click(find('간식').querySelector('.btn_col button'));\nawait t.wait(30);\nt.expect(!find('간식') && items().length === 1, '\"간식\" 항목이 목록에서 사라져야 해요');\nt.expect(!!find('용돈'), '\"용돈\" 항목은 남아 있어야 해요');\nt.expect(sum('expense') === 0 && sum('balance') === 10000, '삭제 후 총 지출은 0원, 잔액은 10,000원이 되어야 해요');"}, {"name": "내용이나 금액이 비어 있으면 추가되지 않는다", "points": 10, "body": "const num = (s) => Number(String(s).replace(/[^0-9.-]/g, ''));\nconst items = () => t.$$('.ExpenseItem');\nconst find = (d) => items().find((el) => t.text(el.querySelector('.description_col')) === d);\nconst sum = (cls) => num(t.text('.ExpenseSummary .' + cls + ' .value'));\nconst add = async (type, d, a) => {\n  await t.type('.ExpenseEditor .desc_input', d);\n  await t.type('.ExpenseEditor .amount_input', String(a));\n  await t.wait(30);\n  await t.click(type === 'income' ? '.ExpenseEditor .income_btn' : '.ExpenseEditor .expense_btn');\n  await t.wait(30);\n};\nawait add('expense', '책', 15000);\nt.expect(items().length === 1, '먼저 정상 입력 \"책\"을 추가하면 1개가 되어야 해요 (현재: ' + items().length + '개)');\nawait t.type('.ExpenseEditor .desc_input', '');\nawait t.type('.ExpenseEditor .amount_input', '1000');\nawait t.wait(30);\nawait t.click('.ExpenseEditor .expense_btn');\nawait t.wait(30);\nt.expect(items().length === 1, '내용이 비어 있으면 추가되면 안 돼요');\nawait t.type('.ExpenseEditor .desc_input', '영화');\nawait t.type('.ExpenseEditor .amount_input', '');\nawait t.wait(30);\nawait t.click('.ExpenseEditor .income_btn');\nawait t.wait(30);\nt.expect(items().length === 1, '금액이 비어 있으면 추가되면 안 돼요');"}]}, {"id": "p5", "title": "칸반 보드", "level": "보통", "desc": "## 미니 칸반 보드 완성하기\n\n카드를 추가하고 `Todo → In Progress → Done` 컬럼 사이로 옮기는 칸반 보드입니다.\n화면(UI)과 CSS는 모두 주어져 있습니다. 아래 요구사항을 만족하도록 코드를 완성하시오. (CSS는 채점하지 않습니다.)\n\n### 화면 구성\n- **CardEditor** : 새 카드 제목 입력창 + `추가` 버튼 (새 카드는 항상 Todo 컬럼에 추가)\n- **KanbanColumn** × 3 : 컬럼 제목, 카드 개수 뱃지(`.count`), 카드 목록(`.cards`)\n- **KanbanCard** : 카드 제목(`.title`), `←`(`.left`) / `→`(`.right`) 이동 버튼\n\n### 요구사항\n1. **App**에 카드 목록 State `cards`(초기값 `[]`)를 만든다. 카드 하나는 `{ id, title, status }` 형태이다.\n   - `status`는 `\"todo\"`, `\"progress\"`, `\"done\"` 중 하나, `id`는 `useRef`로 0부터 1씩 증가\n2. **CardEditor**에 제목을 입력하고 `추가`를 누르면 Todo 컬럼에 카드가 추가되고 입력창이 비워진다. (빈 제목은 추가하지 않음)\n3. 각 **KanbanColumn**에는 해당 `status`의 카드만 전달(`filter`)하고, `map`으로 **KanbanCard**를 렌더링한다.\n4. 각 컬럼의 `.count`에는 그 컬럼의 카드 개수를 표시한다.\n5. `→` 버튼을 누르면 카드가 오른쪽 컬럼으로, `←` 버튼을 누르면 왼쪽 컬럼으로 이동한다.\n6. **Todo** 컬럼의 카드에는 `←` 버튼이, **Done** 컬럼의 카드에는 `→` 버튼이 **보이지 않는다**. (조건부 렌더링)\n\n> 카드 State는 App 한 곳에서 관리하고, 카드를 옮기는 함수 `onMove(id, direction)`를 props로 내려 주세요.\n\n### 수정할 파일\n- `src/App.jsx`, `src/components/CardEditor.jsx`, `src/components/KanbanColumn.jsx`, `src/components/KanbanCard.jsx`", "files": {"src/main.jsx": "import { createRoot } from \"react-dom/client\";\nimport \"./index.css\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"root\")).render(<App />);\n", "src/App.jsx": "import { useState, useRef } from \"react\";\nimport \"./App.css\";\nimport CardEditor from \"./components/CardEditor\";\nimport KanbanColumn from \"./components/KanbanColumn\";\n\n// 컬럼 순서 (왼쪽 → 오른쪽). 수정하지 마세요.\nconst STATUSES = [\"todo\", \"progress\", \"done\"];\n\nfunction App() {\n  // TODO 1: 카드 목록 State(cards)를 만들고 초기값을 빈 배열로 설정하세요.\n  //   카드 하나의 모양: { id, title, status }   (status는 \"todo\" | \"progress\" | \"done\")\n\n  // TODO 2: 새 카드의 id로 사용할 Ref 객체(idRef)를 초기값 0으로 만드세요.\n\n  // TODO 3: onCreate(title) - status가 \"todo\"인 새 카드를 cards에 추가하세요.\n\n  // TODO 4: onMove(targetId, direction) - id가 targetId인 카드의 status를 바꾸세요.\n  //   direction이 1이면 오른쪽 컬럼으로, -1이면 왼쪽 컬럼으로 이동합니다.\n  //   힌트: STATUSES.indexOf(card.status) + direction\n\n  return (\n    <div className=\"App\">\n      <div className=\"header\">\n        <h2>미니 칸반 보드<\/h2>\n      <\/div>\n      {/* TODO 5: CardEditor에 onCreate를 전달하세요. */}\n      <CardEditor />\n      <div className=\"kanban-columns\">\n        {/* TODO 6: 각 컬럼에 해당 status의 카드들만(filter) cards로, 그리고 onMove를 전달하세요. */}\n        <KanbanColumn title=\"Todo\" />\n        <KanbanColumn title=\"In Progress\" />\n        <KanbanColumn title=\"Done\" />\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default App;\n", "src/App.css": "/* 앱 레이아웃 (채점하지 않음) */\n.App {\n  width: 100%;\n  padding: 24px;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n}\n\n.App .header h2 {\n  margin: 0;\n}\n\n/* 칸반 컬럼 그리드: 3열 동일 너비 */\n.kanban-columns {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n\n@media (max-width: 700px) {\n  .kanban-columns {\n    grid-template-columns: 1fr;\n  }\n}\n", "src/index.css": "/* 전역 스타일 (채점하지 않음) */\nbody {\n  margin: 0;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Malgun Gothic\",\n    \"Apple SD Gothic Neo\", sans-serif;\n  background-color: #f5f7fb;\n  color: #111827;\n}\n\n* {\n  box-sizing: border-box;\n}\n", "src/components/CardEditor.css": "/* 새 카드 추가 영역 */\n.CardEditor {\n  display: flex;\n  gap: 8px;\n  max-width: 500px;\n}\n\n.CardEditor input {\n  flex: 1;\n  padding: 10px 12px;\n  border: 1px solid #e5e7eb;\n  border-radius: 8px;\n  background: #fff;\n}\n\n.CardEditor button {\n  padding: 10px 16px;\n  border: none;\n  background: #4f46e5;\n  color: white;\n  border-radius: 8px;\n  cursor: pointer;\n}\n", "src/components/CardEditor.jsx": "import { useState } from \"react\";\nimport \"./CardEditor.css\";\n\n// props: onCreate(title)\nconst CardEditor = () => {\n  // TODO 7: 카드 제목을 저장할 State(title)를 만들고 input과 연결하세요.\n\n  // TODO 8: <추가> 버튼을 클릭하면\n  //   - title이 빈 문자열이면 아무것도 하지 않습니다.\n  //   - 아니면 onCreate(title)을 호출하고 입력창을 비웁니다.\n\n  return (\n    <div className=\"CardEditor\">\n      <input placeholder=\"새 카드 제목 (Todo에 추가됩니다)\" />\n      <button>추가<\/button>\n    <\/div>\n  );\n};\n\nexport default CardEditor;\n", "src/components/KanbanCard.css": "/* 칸반 카드 */\n.KanbanCard {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  background: #ffffff;\n  border: 1px solid #e5e7eb;\n  border-radius: 10px;\n  padding: 12px 14px;\n  box-shadow: 0 2px 8px rgba(17, 24, 39, 0.06);\n}\n\n.KanbanCard .title {\n  font-size: 14px;\n}\n\n.KanbanCard .controls {\n  display: flex;\n  gap: 6px;\n}\n\n.KanbanCard .controls .move {\n  width: 28px;\n  height: 28px;\n  border: 1px solid #e5e7eb;\n  border-radius: 6px;\n  background: #f9fafb;\n  cursor: pointer;\n}\n\n.KanbanCard .controls .move:hover {\n  background: #eef2ff;\n}\n", "src/components/KanbanCard.jsx": "import \"./KanbanCard.css\";\n\n// props: card({ id, title, status }), onMove(id, direction)\nconst KanbanCard = ({ card, onMove }) => {\n  return (\n    <div className=\"KanbanCard\">\n      <div className=\"title\">{card.title}<\/div>\n      <div className=\"controls\">\n        {/* TODO 11: ← 버튼은 Todo 컬럼(status가 \"todo\")의 카드에서는 보이지 않게 하세요. (조건부 렌더링)\n                     클릭하면 onMove(card.id, -1) 호출 */}\n        <button className=\"move left\">←<\/button>\n        {/* TODO 12: → 버튼은 Done 컬럼(status가 \"done\")의 카드에서는 보이지 않게 하세요. (조건부 렌더링)\n                     클릭하면 onMove(card.id, 1) 호출 */}\n        <button className=\"move right\">→<\/button>\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default KanbanCard;\n", "src/components/KanbanColumn.css": "/* 칸반 컬럼 */\n.KanbanColumn {\n  background: #ffffff;\n  border: 1px solid #e5e7eb;\n  border-radius: 10px;\n  padding: 14px;\n  min-height: 260px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.KanbanColumn .column-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.KanbanColumn .column-header h3 {\n  margin: 0;\n}\n\n/* 카드 개수 뱃지 */\n.KanbanColumn .column-header .count {\n  border: 1px solid #e5e7eb;\n  border-radius: 999px;\n  padding: 2px 8px;\n  font-size: 12px;\n  color: #6b7280;\n}\n\n.KanbanColumn .cards {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n", "src/components/KanbanColumn.jsx": "import KanbanCard from \"./KanbanCard\";\nimport \"./KanbanColumn.css\";\n\n// props: title(컬럼 이름), cards(이 컬럼에 속한 카드 배열), onMove\nconst KanbanColumn = ({ title }) => {\n  return (\n    <div className=\"KanbanColumn\">\n      <div className=\"column-header\">\n        <h3>{title}<\/h3>\n        {/* TODO 9: 0 대신 이 컬럼의 카드 개수를 표시하세요. */}\n        <div className=\"count\">0<\/div>\n      <\/div>\n      <div className=\"cards\">\n        {/* TODO 10: cards를 map으로 순회하며 KanbanCard를 렌더링하세요. (key 필수, card와 onMove 전달) */}\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default KanbanColumn;\n"}, "solution": {"src/App.jsx": "import { useState, useRef } from \"react\";\nimport \"./App.css\";\nimport CardEditor from \"./components/CardEditor\";\nimport KanbanColumn from \"./components/KanbanColumn\";\n\n// 컬럼 순서 (왼쪽 → 오른쪽). 수정하지 마세요.\nconst STATUSES = [\"todo\", \"progress\", \"done\"];\n\nfunction App() {\n  const [cards, setCards] = useState([]);\n  const idRef = useRef(0);\n\n  const onCreate = (title) => {\n    const newCard = { id: idRef.current, title, status: \"todo\" };\n    setCards([...cards, newCard]);\n    idRef.current += 1;\n  };\n\n  const onMove = (targetId, direction) => {\n    setCards(\n      cards.map((card) => {\n        if (card.id !== targetId) return card;\n        const nextIndex = STATUSES.indexOf(card.status) + direction;\n        if (nextIndex < 0 || nextIndex >= STATUSES.length) return card;\n        return { ...card, status: STATUSES[nextIndex] };\n      })\n    );\n  };\n\n  return (\n    <div className=\"App\">\n      <div className=\"header\">\n        <h2>미니 칸반 보드<\/h2>\n      <\/div>\n      <CardEditor onCreate={onCreate} />\n      <div className=\"kanban-columns\">\n        <KanbanColumn\n          title=\"Todo\"\n          cards={cards.filter((card) => card.status === \"todo\")}\n          onMove={onMove}\n        />\n        <KanbanColumn\n          title=\"In Progress\"\n          cards={cards.filter((card) => card.status === \"progress\")}\n          onMove={onMove}\n        />\n        <KanbanColumn\n          title=\"Done\"\n          cards={cards.filter((card) => card.status === \"done\")}\n          onMove={onMove}\n        />\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default App;\n", "src/components/CardEditor.jsx": "import { useState } from \"react\";\nimport \"./CardEditor.css\";\n\nconst CardEditor = ({ onCreate }) => {\n  const [title, setTitle] = useState(\"\");\n\n  const onChangeTitle = (e) => {\n    setTitle(e.target.value);\n  };\n\n  const onSubmit = () => {\n    if (title === \"\") {\n      return;\n    }\n    onCreate(title);\n    setTitle(\"\");\n  };\n\n  return (\n    <div className=\"CardEditor\">\n      <input\n        value={title}\n        onChange={onChangeTitle}\n        placeholder=\"새 카드 제목 (Todo에 추가됩니다)\"\n      />\n      <button onClick={onSubmit}>추가<\/button>\n    <\/div>\n  );\n};\n\nexport default CardEditor;\n", "src/components/KanbanCard.jsx": "import \"./KanbanCard.css\";\n\nconst KanbanCard = ({ card, onMove }) => {\n  return (\n    <div className=\"KanbanCard\">\n      <div className=\"title\">{card.title}<\/div>\n      <div className=\"controls\">\n        {card.status !== \"todo\" && (\n          <button className=\"move left\" onClick={() => onMove(card.id, -1)}>\n            ←\n          <\/button>\n        )}\n        {card.status !== \"done\" && (\n          <button className=\"move right\" onClick={() => onMove(card.id, 1)}>\n            →\n          <\/button>\n        )}\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default KanbanCard;\n", "src/components/KanbanColumn.jsx": "import KanbanCard from \"./KanbanCard\";\nimport \"./KanbanColumn.css\";\n\nconst KanbanColumn = ({ title, cards, onMove }) => {\n  return (\n    <div className=\"KanbanColumn\">\n      <div className=\"column-header\">\n        <h3>{title}<\/h3>\n        <div className=\"count\">{cards.length}<\/div>\n      <\/div>\n      <div className=\"cards\">\n        {cards.map((card) => (\n          <KanbanCard key={card.id} card={card} onMove={onMove} />\n        ))}\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default KanbanColumn;\n"}, "tests": [{"name": "카드를 추가하면 Todo 컬럼에 표시되고 입력창이 비워진다", "points": 20, "body": "const NAMES = ['Todo', 'In Progress', 'Done'];\nconst cols = () => t.$$('.KanbanColumn');\nconst titles = (i) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard .title')).map((e) => e.textContent.trim()) : []);\nconst card = (i, title) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard')).find((c) => t.text(c.querySelector('.title')) === title) : null);\nconst count = (i) => (cols()[i] ? t.text(cols()[i].querySelector('.count')) : '');\nconst where = (title) => NAMES.filter((n, i) => titles(i).includes(title)).join(', ') || '없음';\nconst add = async (s) => {\n  await t.type('.CardEditor input', s);\n  await t.wait(30);\n  await t.click('.CardEditor button');\n  await t.wait(30);\n};\nconst move = async (i, title, dir) => {\n  const c = card(i, title);\n  t.expect(!!c, NAMES[i] + ' 컬럼에서 \"' + title + '\" 카드를 찾을 수 없어요 (현재 위치: ' + where(title) + ')');\n  const b = c.querySelector(dir > 0 ? '.right' : '.left');\n  t.expect(!!b, NAMES[i] + ' 컬럼의 \"' + title + '\" 카드에 ' + (dir > 0 ? '→' : '←') + ' 버튼이 없어요');\n  await t.click(b);\n  await t.wait(30);\n};\nt.expect(cols().length === 3, '컬럼이 3개 있어야 해요');\nawait add('기획서 작성');\nt.expect(titles(0).includes('기획서 작성'), 'Todo 컬럼에 \"기획서 작성\" 카드가 보여야 해요 (현재 위치: ' + where('기획서 작성') + ')');\nt.expect(titles(1).length === 0 && titles(2).length === 0, '새 카드는 Todo 컬럼에만 추가되어야 해요');\nt.expect(t.$('.CardEditor input').value === '', '추가한 뒤 입력창이 비워져야 해요');\nawait t.click('.CardEditor button');\nawait t.wait(30);\nt.expect(titles(0).length === 1, '빈 제목으로 추가를 누르면 카드가 추가되면 안 돼요 (Todo 카드 수: ' + titles(0).length + ')');"}, {"name": "각 컬럼의 카드 개수가 표시된다", "points": 15, "body": "const NAMES = ['Todo', 'In Progress', 'Done'];\nconst cols = () => t.$$('.KanbanColumn');\nconst titles = (i) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard .title')).map((e) => e.textContent.trim()) : []);\nconst card = (i, title) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard')).find((c) => t.text(c.querySelector('.title')) === title) : null);\nconst count = (i) => (cols()[i] ? t.text(cols()[i].querySelector('.count')) : '');\nconst where = (title) => NAMES.filter((n, i) => titles(i).includes(title)).join(', ') || '없음';\nconst add = async (s) => {\n  await t.type('.CardEditor input', s);\n  await t.wait(30);\n  await t.click('.CardEditor button');\n  await t.wait(30);\n};\nconst move = async (i, title, dir) => {\n  const c = card(i, title);\n  t.expect(!!c, NAMES[i] + ' 컬럼에서 \"' + title + '\" 카드를 찾을 수 없어요 (현재 위치: ' + where(title) + ')');\n  const b = c.querySelector(dir > 0 ? '.right' : '.left');\n  t.expect(!!b, NAMES[i] + ' 컬럼의 \"' + title + '\" 카드에 ' + (dir > 0 ? '→' : '←') + ' 버튼이 없어요');\n  await t.click(b);\n  await t.wait(30);\n};\nawait add('A');\nawait add('B');\nawait add('C');\nt.expect(titles(0).length === 3, 'Todo 컬럼에 카드 3개가 보여야 해요 (현재: ' + titles(0).length + '개)');\nt.expect(count(0) === '3', 'Todo 컬럼의 개수 뱃지에 3이 표시되어야 해요 (현재: \"' + count(0) + '\")');\nt.expect(count(1) === '0' && count(2) === '0', 'In Progress, Done 컬럼의 개수는 0이어야 해요');"}, {"name": "→ 버튼을 누르면 카드가 오른쪽 컬럼으로 이동한다", "points": 25, "body": "const NAMES = ['Todo', 'In Progress', 'Done'];\nconst cols = () => t.$$('.KanbanColumn');\nconst titles = (i) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard .title')).map((e) => e.textContent.trim()) : []);\nconst card = (i, title) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard')).find((c) => t.text(c.querySelector('.title')) === title) : null);\nconst count = (i) => (cols()[i] ? t.text(cols()[i].querySelector('.count')) : '');\nconst where = (title) => NAMES.filter((n, i) => titles(i).includes(title)).join(', ') || '없음';\nconst add = async (s) => {\n  await t.type('.CardEditor input', s);\n  await t.wait(30);\n  await t.click('.CardEditor button');\n  await t.wait(30);\n};\nconst move = async (i, title, dir) => {\n  const c = card(i, title);\n  t.expect(!!c, NAMES[i] + ' 컬럼에서 \"' + title + '\" 카드를 찾을 수 없어요 (현재 위치: ' + where(title) + ')');\n  const b = c.querySelector(dir > 0 ? '.right' : '.left');\n  t.expect(!!b, NAMES[i] + ' 컬럼의 \"' + title + '\" 카드에 ' + (dir > 0 ? '→' : '←') + ' 버튼이 없어요');\n  await t.click(b);\n  await t.wait(30);\n};\nawait add('보고서');\nawait move(0, '보고서', 1);\nt.expect(titles(1).includes('보고서') && !titles(0).includes('보고서'), '→를 누르면 \"보고서\"가 Todo에서 In Progress로 이동해야 해요 (현재 위치: ' + where('보고서') + ')');\nawait move(1, '보고서', 1);\nt.expect(titles(2).includes('보고서') && !titles(1).includes('보고서'), '한 번 더 →를 누르면 Done으로 이동해야 해요 (현재 위치: ' + where('보고서') + ')');"}, {"name": "← 버튼을 누르면 카드가 왼쪽 컬럼으로 이동한다", "points": 20, "body": "const NAMES = ['Todo', 'In Progress', 'Done'];\nconst cols = () => t.$$('.KanbanColumn');\nconst titles = (i) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard .title')).map((e) => e.textContent.trim()) : []);\nconst card = (i, title) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard')).find((c) => t.text(c.querySelector('.title')) === title) : null);\nconst count = (i) => (cols()[i] ? t.text(cols()[i].querySelector('.count')) : '');\nconst where = (title) => NAMES.filter((n, i) => titles(i).includes(title)).join(', ') || '없음';\nconst add = async (s) => {\n  await t.type('.CardEditor input', s);\n  await t.wait(30);\n  await t.click('.CardEditor button');\n  await t.wait(30);\n};\nconst move = async (i, title, dir) => {\n  const c = card(i, title);\n  t.expect(!!c, NAMES[i] + ' 컬럼에서 \"' + title + '\" 카드를 찾을 수 없어요 (현재 위치: ' + where(title) + ')');\n  const b = c.querySelector(dir > 0 ? '.right' : '.left');\n  t.expect(!!b, NAMES[i] + ' 컬럼의 \"' + title + '\" 카드에 ' + (dir > 0 ? '→' : '←') + ' 버튼이 없어요');\n  await t.click(b);\n  await t.wait(30);\n};\nawait add('발표 준비');\nawait move(0, '발표 준비', 1);\nawait move(1, '발표 준비', 1);\nt.expect(titles(2).includes('발표 준비'), '→ 두 번으로 Done 컬럼까지 이동해야 해요 (현재 위치: ' + where('발표 준비') + ')');\nawait move(2, '발표 준비', -1);\nt.expect(titles(1).includes('발표 준비') && !titles(2).includes('발표 준비'), '←를 누르면 Done에서 In Progress로 이동해야 해요 (현재 위치: ' + where('발표 준비') + ')');\nawait move(1, '발표 준비', -1);\nt.expect(titles(0).includes('발표 준비'), '한 번 더 ←를 누르면 Todo로 이동해야 해요 (현재 위치: ' + where('발표 준비') + ')');"}, {"name": "Todo 카드에는 ← 버튼이, Done 카드에는 → 버튼이 없다", "points": 20, "body": "const NAMES = ['Todo', 'In Progress', 'Done'];\nconst cols = () => t.$$('.KanbanColumn');\nconst titles = (i) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard .title')).map((e) => e.textContent.trim()) : []);\nconst card = (i, title) => (cols()[i] ? Array.from(cols()[i].querySelectorAll('.KanbanCard')).find((c) => t.text(c.querySelector('.title')) === title) : null);\nconst count = (i) => (cols()[i] ? t.text(cols()[i].querySelector('.count')) : '');\nconst where = (title) => NAMES.filter((n, i) => titles(i).includes(title)).join(', ') || '없음';\nconst add = async (s) => {\n  await t.type('.CardEditor input', s);\n  await t.wait(30);\n  await t.click('.CardEditor button');\n  await t.wait(30);\n};\nconst move = async (i, title, dir) => {\n  const c = card(i, title);\n  t.expect(!!c, NAMES[i] + ' 컬럼에서 \"' + title + '\" 카드를 찾을 수 없어요 (현재 위치: ' + where(title) + ')');\n  const b = c.querySelector(dir > 0 ? '.right' : '.left');\n  t.expect(!!b, NAMES[i] + ' 컬럼의 \"' + title + '\" 카드에 ' + (dir > 0 ? '→' : '←') + ' 버튼이 없어요');\n  await t.click(b);\n  await t.wait(30);\n};\nawait add('테스트');\nlet c = card(0, '테스트');\nt.expect(!!c, 'Todo 컬럼에 \"테스트\" 카드가 보여야 해요');\nt.expect(!c.querySelector('.left'), 'Todo 컬럼 카드에는 ← 버튼이 없어야 해요');\nt.expect(!!c.querySelector('.right'), 'Todo 컬럼 카드에는 → 버튼이 있어야 해요');\nawait move(0, '테스트', 1);\nc = card(1, '테스트');\nt.expect(!!c && !!c.querySelector('.left') && !!c.querySelector('.right'), 'In Progress 컬럼 카드에는 ←, → 버튼이 모두 있어야 해요');\nawait move(1, '테스트', 1);\nc = card(2, '테스트');\nt.expect(!!c, 'Done 컬럼에 \"테스트\" 카드가 보여야 해요');\nt.expect(!c.querySelector('.right'), 'Done 컬럼 카드에는 → 버튼이 없어야 해요');\nt.expect(!!c.querySelector('.left'), 'Done 컬럼 카드에는 ← 버튼이 있어야 해요');"}]}, {"id": "p6", "title": "한 줄 메모장 (useRef · useEffect)", "level": "보통", "desc": "## 한 줄 메모장 완성하기\n\n짧은 메모를 등록하고 검색할 수 있는 앱입니다. **useRef**로 입력창을 직접 조작하고, **useEffect**로 마운트 시점을 제어해 봅니다.\n화면(UI)과 CSS는 모두 주어져 있습니다. 아래 요구사항을 만족하도록 코드를 완성하시오. (CSS는 채점하지 않습니다.)\n\n### 화면 구성\n- **MemoEditor** : 메모 입력창(`.memo_input`), `등록` 버튼, 글자 수 표시(`.char_count`)\n- **MemoList** : 검색창(`.searchbar`), 메모 목록(`<li className=\"MemoItem\">`)\n\n### 요구사항\n1. **App**에 메모 목록 State `memos`(초기값 `[]`)를 만든다. 메모 하나는 `{ id, content }` 형태이며, `id`는 `useRef`로 0부터 1씩 증가한다.\n2. 앱이 처음 화면에 나타나면(**마운트**) 메모 입력창에 **자동으로 포커스**된다. (`useRef` + `useEffect`)\n3. 입력하는 동안 `.char_count`에 현재 글자 수를 `글자수 / 30` 형식으로 표시한다. (예: `5 / 30`)\n4. `등록` 버튼을 눌렀을 때\n   - 내용이 **5글자 미만**이면 등록하지 않고 입력창에 **포커스**한다.\n   - **5글자 이상**이면 메모가 목록에 추가되고, 입력창이 비워진다.\n5. **MemoList**의 검색창에 검색어를 입력하면 내용에 검색어가 포함된 메모만 보인다. (빈 검색어 → 전체)\n\n### 수정할 파일\n- `src/App.jsx`, `src/components/MemoEditor.jsx`, `src/components/MemoList.jsx`", "files": {"src/main.jsx": "import { createRoot } from \"react-dom/client\";\nimport \"./index.css\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"root\")).render(<App />);\n", "src/App.jsx": "import { useState, useRef } from \"react\";\nimport \"./App.css\";\nimport MemoEditor from \"./components/MemoEditor\";\nimport MemoList from \"./components/MemoList\";\n\nfunction App() {\n  // TODO 1: 메모 목록 State(memos)를 만들고 초기값을 빈 배열로 설정하세요.\n  //   메모 하나의 모양: { id, content }\n\n  // TODO 2: 새 메모의 id로 사용할 Ref 객체(idRef)를 초기값 0으로 만드세요.\n\n  // TODO 3: onCreate(content) - 새 메모를 memos에 추가하고 idRef.current를 1 증가시키세요.\n\n  return (\n    <div className=\"App\">\n      <h2>한 줄 메모장 📝<\/h2>\n      {/* TODO 4: MemoEditor에 onCreate를, MemoList에 memos를 props로 전달하세요. */}\n      <MemoEditor />\n      <MemoList />\n    <\/div>\n  );\n}\n\nexport default App;\n", "src/App.css": "/* 페이지 레이아웃 (채점하지 않음) */\n.App {\n  max-width: 500px;\n  width: 100%;\n  margin: 0 auto;\n  padding: 20px;\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n.App > h2 {\n  margin: 0;\n  color: #1f93ff;\n}\n", "src/index.css": "/* 전역 스타일 (채점하지 않음) */\nbody {\n  margin: 0;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Malgun Gothic\",\n    \"Apple SD Gothic Neo\", sans-serif;\n  background-color: #f5f7fb;\n  color: #111827;\n}\n\n* {\n  box-sizing: border-box;\n}\n", "src/components/MemoEditor.css": ".MemoEditor {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.MemoEditor .editor_wrapper {\n  display: flex;\n  gap: 10px;\n}\n\n.MemoEditor input {\n  flex: 1;\n  padding: 14px;\n  border: 1px solid rgb(220, 220, 220);\n  border-radius: 5px;\n}\n\n.MemoEditor input:focus {\n  outline: none;\n  border: 1px solid #1f93ff;\n}\n\n.MemoEditor button {\n  width: 80px;\n  cursor: pointer;\n  border: none;\n  border-radius: 5px;\n  background-color: #1f93ff;\n  color: white;\n  font-weight: bold;\n}\n\n.MemoEditor .char_count {\n  text-align: right;\n  font-size: 13px;\n  color: gray;\n}\n", "src/components/MemoEditor.jsx": "import { useState, useRef, useEffect } from \"react\";\nimport \"./MemoEditor.css\";\n\nconst MAX_LENGTH = 30;\n\n// props: onCreate(content)\nconst MemoEditor = () => {\n  // TODO 5: 입력한 내용을 저장할 State(content)를 만들고 input과 연결하세요. (value + onChange)\n\n  // TODO 6: input 요소에 접근할 Ref 객체(inputRef)를 만들고 input의 ref 속성에 연결하세요.\n\n  // TODO 7: useEffect를 사용해 컴포넌트가 처음 마운트될 때 입력창에 포커스하세요.\n\n  // TODO 8: <등록> 버튼을 클릭하면\n  //   - content가 5글자 미만이면 등록하지 않고 입력창에 포커스합니다.\n  //   - 5글자 이상이면 onCreate(content)를 호출하고 입력창을 비웁니다.\n\n  return (\n    <div className=\"MemoEditor\">\n      <div className=\"editor_wrapper\">\n        <input\n          className=\"memo_input\"\n          maxLength={MAX_LENGTH}\n          placeholder=\"메모를 입력하세요 (5글자 이상)\"\n        />\n        <button>등록<\/button>\n      <\/div>\n      {/* TODO 9: 0 대신 현재 입력한 글자 수를 표시하세요. (예: 5 / 30) */}\n      <div className=\"char_count\">0 / {MAX_LENGTH}<\/div>\n    <\/div>\n  );\n};\n\nexport default MemoEditor;\n", "src/components/MemoList.css": ".MemoList .searchbar {\n  width: 100%;\n  border: none;\n  border-bottom: 1px solid rgb(220, 220, 220);\n  padding: 12px 0;\n  margin-bottom: 10px;\n}\n\n.MemoList .searchbar:focus {\n  outline: none;\n  border-bottom: 1px solid #1f93ff;\n}\n\n.MemoList .list_wrapper {\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.MemoList .MemoItem {\n  padding: 12px 14px;\n  background-color: white;\n  border: 1px solid rgb(240, 240, 240);\n  border-radius: 5px;\n}\n", "src/components/MemoList.jsx": "import { useState } from \"react\";\nimport \"./MemoList.css\";\n\n// props: memos(메모 배열)\nconst MemoList = () => {\n  // TODO 10: 검색어를 저장할 State(search)를 만들고 검색 입력창과 연결하세요.\n\n  // TODO 11: content에 search가 포함된 메모만 걸러 내세요. (search가 빈 문자열이면 전체)\n\n  return (\n    <div className=\"MemoList\">\n      <input className=\"searchbar\" placeholder=\"메모 검색\" />\n      <ul className=\"list_wrapper\">\n        {/* TODO 12: 걸러 낸 메모 배열을 map으로 순회하며 아래 형태로 렌더링하세요. (key 필수)\n            <li className=\"MemoItem\">메모 내용<\/li> */}\n      <\/ul>\n    <\/div>\n  );\n};\n\nexport default MemoList;\n"}, "solution": {"src/App.jsx": "import { useState, useRef } from \"react\";\nimport \"./App.css\";\nimport MemoEditor from \"./components/MemoEditor\";\nimport MemoList from \"./components/MemoList\";\n\nfunction App() {\n  const [memos, setMemos] = useState([]);\n  const idRef = useRef(0);\n\n  const onCreate = (content) => {\n    setMemos([{ id: idRef.current, content }, ...memos]);\n    idRef.current += 1;\n  };\n\n  return (\n    <div className=\"App\">\n      <h2>한 줄 메모장 📝<\/h2>\n      <MemoEditor onCreate={onCreate} />\n      <MemoList memos={memos} />\n    <\/div>\n  );\n}\n\nexport default App;\n", "src/components/MemoEditor.jsx": "import { useState, useRef, useEffect } from \"react\";\nimport \"./MemoEditor.css\";\n\nconst MAX_LENGTH = 30;\n\nconst MemoEditor = ({ onCreate }) => {\n  const [content, setContent] = useState(\"\");\n  const inputRef = useRef();\n\n  // 빈 의존성 배열 → 마운트될 때 한 번만 실행\n  useEffect(() => {\n    inputRef.current.focus();\n  }, []);\n\n  const onChangeContent = (e) => {\n    setContent(e.target.value);\n  };\n\n  const onSubmit = () => {\n    if (content.length < 5) {\n      inputRef.current.focus();\n      return;\n    }\n    onCreate(content);\n    setContent(\"\");\n  };\n\n  return (\n    <div className=\"MemoEditor\">\n      <div className=\"editor_wrapper\">\n        <input\n          ref={inputRef}\n          className=\"memo_input\"\n          value={content}\n          onChange={onChangeContent}\n          maxLength={MAX_LENGTH}\n          placeholder=\"메모를 입력하세요 (5글자 이상)\"\n        />\n        <button onClick={onSubmit}>등록<\/button>\n      <\/div>\n      <div className=\"char_count\">\n        {content.length} / {MAX_LENGTH}\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default MemoEditor;\n", "src/components/MemoList.jsx": "import { useState } from \"react\";\nimport \"./MemoList.css\";\n\nconst MemoList = ({ memos }) => {\n  const [search, setSearch] = useState(\"\");\n\n  const onChangeSearch = (e) => {\n    setSearch(e.target.value);\n  };\n\n  const filteredMemos =\n    search === \"\" ? memos : memos.filter((memo) => memo.content.includes(search));\n\n  return (\n    <div className=\"MemoList\">\n      <input\n        className=\"searchbar\"\n        value={search}\n        onChange={onChangeSearch}\n        placeholder=\"메모 검색\"\n      />\n      <ul className=\"list_wrapper\">\n        {filteredMemos.map((memo) => (\n          <li key={memo.id} className=\"MemoItem\">\n            {memo.content}\n          <\/li>\n        ))}\n      <\/ul>\n    <\/div>\n  );\n};\n\nexport default MemoList;\n"}, "tests": [{"name": "앱이 처음 나타나면 메모 입력창에 자동으로 포커스된다", "points": 15, "body": "const input = () => t.$('.MemoEditor .memo_input');\nconst focused = () => { const el = input(); return !!el && el.ownerDocument.activeElement === el; };\nconst items = () => t.$$('.MemoList .MemoItem');\nconst texts = () => items().map((el) => t.text(el)).join(', ');\nconst counter = () => t.text('.MemoEditor .char_count').replace(/\\s+/g, '');\nconst typeMemo = async (s) => { await t.type('.MemoEditor .memo_input', s); await t.wait(30); };\nconst submit = async () => { await t.click('.MemoEditor button'); await t.wait(30); };\nconst add = async (s) => { await typeMemo(s); await submit(); };\nawait t.wait(50);\nt.expect(!!input(), '메모 입력창(.memo_input)을 찾을 수 없어요');\nt.expect(focused(), '앱이 마운트되면 메모 입력창에 포커스가 있어야 해요 (useRef + useEffect)');"}, {"name": "입력한 글자 수가 '글자수 / 30' 형식으로 표시된다", "points": 20, "body": "const input = () => t.$('.MemoEditor .memo_input');\nconst focused = () => { const el = input(); return !!el && el.ownerDocument.activeElement === el; };\nconst items = () => t.$$('.MemoList .MemoItem');\nconst texts = () => items().map((el) => t.text(el)).join(', ');\nconst counter = () => t.text('.MemoEditor .char_count').replace(/\\s+/g, '');\nconst typeMemo = async (s) => { await t.type('.MemoEditor .memo_input', s); await t.wait(30); };\nconst submit = async () => { await t.click('.MemoEditor button'); await t.wait(30); };\nconst add = async (s) => { await typeMemo(s); await submit(); };\nawait typeMemo('안녕하세요');\nt.expect(counter() === '5/30', '\"안녕하세요\"를 입력하면 5 / 30이 표시되어야 해요 (현재: \"' + t.text('.MemoEditor .char_count') + '\")');\nawait typeMemo('React');\nt.expect(counter() === '5/30', '\"React\"를 입력하면 5 / 30이 표시되어야 해요');\nawait typeMemo('hi');\nt.expect(counter() === '2/30', '\"hi\"를 입력하면 2 / 30이 표시되어야 해요 (현재: \"' + t.text('.MemoEditor .char_count') + '\")');"}, {"name": "5글자 미만이면 등록되지 않고 입력창에 다시 포커스된다", "points": 20, "body": "const input = () => t.$('.MemoEditor .memo_input');\nconst focused = () => { const el = input(); return !!el && el.ownerDocument.activeElement === el; };\nconst items = () => t.$$('.MemoList .MemoItem');\nconst texts = () => items().map((el) => t.text(el)).join(', ');\nconst counter = () => t.text('.MemoEditor .char_count').replace(/\\s+/g, '');\nconst typeMemo = async (s) => { await t.type('.MemoEditor .memo_input', s); await t.wait(30); };\nconst submit = async () => { await t.click('.MemoEditor button'); await t.wait(30); };\nconst add = async (s) => { await typeMemo(s); await submit(); };\nawait typeMemo('메모');\ninput().blur();\nawait t.wait(30);\nt.expect(!focused(), '(테스트 준비) 입력창의 포커스를 해제하지 못했어요');\nawait submit();\nt.expect(items().length === 0, '5글자 미만인 메모는 등록되면 안 돼요 (현재 목록: ' + texts() + ')');\nt.expect(focused(), '5글자 미만일 때 등록 버튼을 누르면 입력창에 포커스되어야 해요');"}, {"name": "5글자 이상이면 목록에 추가되고 입력창이 비워진다", "points": 25, "body": "const input = () => t.$('.MemoEditor .memo_input');\nconst focused = () => { const el = input(); return !!el && el.ownerDocument.activeElement === el; };\nconst items = () => t.$$('.MemoList .MemoItem');\nconst texts = () => items().map((el) => t.text(el)).join(', ');\nconst counter = () => t.text('.MemoEditor .char_count').replace(/\\s+/g, '');\nconst typeMemo = async (s) => { await t.type('.MemoEditor .memo_input', s); await t.wait(30); };\nconst submit = async () => { await t.click('.MemoEditor button'); await t.wait(30); };\nconst add = async (s) => { await typeMemo(s); await submit(); };\nawait add('리액트 공부 중');\nt.expect(items().length === 1 && texts() === '리액트 공부 중', '\"리액트 공부 중\"이 목록에 추가되어야 해요 (현재 목록: ' + texts() + ')');\nt.expect(input().value === '', '등록한 뒤 입력창이 비워져야 해요');\nt.expect(counter() === '0/30', '입력창이 비워지면 글자 수도 0 / 30이 되어야 해요 (현재: \"' + t.text('.MemoEditor .char_count') + '\")');\nawait add('중간고사 대비');\nt.expect(items().length === 2, '두 번째 메모까지 2개가 보여야 해요 (현재 목록: ' + texts() + ')');"}, {"name": "검색어를 입력하면 해당 내용이 포함된 메모만 보인다", "points": 20, "body": "const input = () => t.$('.MemoEditor .memo_input');\nconst focused = () => { const el = input(); return !!el && el.ownerDocument.activeElement === el; };\nconst items = () => t.$$('.MemoList .MemoItem');\nconst texts = () => items().map((el) => t.text(el)).join(', ');\nconst counter = () => t.text('.MemoEditor .char_count').replace(/\\s+/g, '');\nconst typeMemo = async (s) => { await t.type('.MemoEditor .memo_input', s); await t.wait(30); };\nconst submit = async () => { await t.click('.MemoEditor button'); await t.wait(30); };\nconst add = async (s) => { await typeMemo(s); await submit(); };\nawait add('리액트 공부하기');\nawait add('자바스크립트 복습');\nawait add('리액트 시험 대비');\nt.expect(items().length === 3, '메모 3개가 등록되어야 해요 (현재 목록: ' + texts() + ')');\nawait t.type('.MemoList .searchbar', '리액트');\nawait t.wait(30);\nt.expect(items().length === 2 && items().every((el) => t.text(el).includes('리액트')), '\"리액트\"로 검색하면 2개만 보여야 해요 (현재 목록: ' + texts() + ')');\nawait t.type('.MemoList .searchbar', '복습');\nawait t.wait(30);\nt.expect(items().length === 1 && texts() === '자바스크립트 복습', '\"복습\"으로 검색하면 \"자바스크립트 복습\"만 보여야 해요 (현재 목록: ' + texts() + ')');\nawait t.type('.MemoList .searchbar', '');\nawait t.wait(30);\nt.expect(items().length === 3, '검색어를 지우면 다시 3개가 모두 보여야 해요');"}]}], "written": [{"id": "w001", "ch": "1장", "type": "single", "q": "다음 코드의 실행 결과로 옳은 것은? (줄바꿈은 공백으로 표시)", "code": "const repeat = (count, callback) => {\n  for (let idx = 1; idx <= count; idx++) {\n    callback(idx);\n  }\n};\n\nrepeat(3, (idx) => console.log(idx * 2));", "lang": "js", "options": ["1 2 3", "2 4 6", "6", "undefined", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "repeat에 두 번째 인수로 전달한 화살표 함수가 콜백 함수다. repeat 안의 반복문이 idx 1, 2, 3으로 콜백을 호출하므로 2, 4, 6이 출력된다. 리액트의 onClick={() => ...}, map((it) => ...)도 모두 이렇게 함수를 인수로 넘기는 콜백 패턴이다."}, {"id": "w002", "ch": "2장", "type": "single", "q": "List 컴포넌트에 빈 배열을 전달했을 때(<List items={[]} />) 화면에 표시되는 것은?", "code": "function List({ items }) {\n  return (\n    <div>\n      {items.length && <p>{items.length}개의 항목<\/p>}\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["아무것도 표시되지 않는다", "0", "false", "0개의 항목"], "answer": [1], "pick": 1, "explain": "&& 연산자는 왼쪽 값이 falsy이면 그 값을 그대로 반환한다(단락 평가). items.length가 0이므로 0이 반환되는데, 숫자 0은 JSX에서 화면에 출력된다. 아무것도 안 보이게 하려면 items.length > 0 && ... 처럼 불리언 조건을 써야 한다."}, {"id": "w003", "ch": "2장", "type": "single", "q": "다음 코드의 실행 결과로 옳은 것은?", "code": "const person = { name: \"이정환\", age: 27 };\nconst { name, age, hobby = \"독서\" } = person;\n\nconsole.log(name, age, hobby);", "lang": "js", "options": ["이정환 27 undefined", "이정환 27 독서", "undefined undefined 독서", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "객체 구조 분해 할당은 프로퍼티 이름이 같은 변수에 값을 담는다. person에 hobby가 없지만 기본값 '독서'를 지정했으므로 hobby는 '독서'가 된다. Props를 ({ name, favorList = [] })처럼 받는 것도 같은 문법이다."}, {"id": "w004", "ch": "2장", "type": "multi", "q": "다음 배열 메서드 중 원본 배열을 변경하지 않고 새 배열을 반환하는 것을 모두 고르시오. (State 배열을 업데이트할 때 주로 쓰인다)", "options": ["map", "filter", "push", "sort", "concat"], "answer": [0, 1, 4], "pick": 3, "explain": "map, filter, concat은 원본은 그대로 두고 새 배열을 만들어 반환한다. push는 원본 끝에 요소를 추가하고 새 길이를 반환하며, sort는 원본 배열 자체를 정렬한다. 리액트 State는 원본을 직접 바꾸면 안 되므로 새 배열을 만드는 메서드를 쓴다."}, {"id": "w005", "ch": "2장", "type": "multi", "q": "다음 중 falsy한 값을 모두 고르시오.", "options": ["0", "\"0\" (문자열 0)", "\"\" (빈 문자열)", "[] (빈 배열)", "null", "NaN"], "answer": [0, 2, 4, 5], "pick": 4, "explain": "falsy 값은 false, undefined, null, 0, -0, NaN, \"\"(빈 문자열), 0n 이다. 문자열 \"0\"은 비어 있지 않은 문자열이고, 빈 배열 []도 객체이므로 truthy이다. 할 일 앱의 if (!content)처럼 빈 입력을 막을 때 활용된다."}, {"id": "w006", "ch": "3장", "type": "single", "q": "package.json의 dependencies에 \"lodash\": \"^4.17.21\" 이라고 적혀 있다. 허용되는 버전 범위로 옳은 것은?", "options": ["정확히 4.17.21 버전만", "4.17.21 이상 4.18.0 미만", "4.17.21 이상 5.0.0 미만", "4.17.21 이하의 모든 버전", "항상 최신(latest) 버전"], "answer": [2], "pick": 1, "explain": "캐럿(^)은 메이저 버전(맨 앞 숫자)은 고정하고 마이너·패치 버전은 최신까지 허용한다는 뜻이다. 그래서 ^4.17.21은 4.17.21 이상 5.0.0 미만이다. 참고로 틸드(~4.17.21)는 4.17.21 이상 4.18.0 미만이다."}, {"id": "w007", "ch": "3장", "type": "single", "q": "circle.js가 다음과 같을 때, 다른 파일에서 불러오는 코드 중 오류가 발생하는 것은?", "code": "// circle.js\nexport const PI = 3.141592;\n\nexport default function getArea(radius) {\n  return PI * radius * radius;\n}", "lang": "js", "options": ["import getArea, { PI } from \"./circle.js\";", "import area from \"./circle.js\";", "import { PI } from \"./circle.js\";", "import * as circle from \"./circle.js\";", "import { area } from \"./circle.js\";"], "answer": [4], "pick": 1, "explain": "export default로 내보낸 기본값은 중괄호 없이 원하는 이름(area 등)으로 불러올 수 있다. 하지만 중괄호 { }로 불러오는 개별 내보내기는 내보낸 이름과 똑같아야 한다. circle.js에는 area라는 이름으로 내보낸 값이 없으므로 { area }는 오류가 난다."}, {"id": "w008", "ch": "3장", "type": "multi", "q": "Node.js 패키지 루트에서 npm i lodash 를 실행했을 때 일어나는 변화를 모두 고르시오.", "options": ["패키지 루트에 node_modules 폴더가 생성된다", "package.json에 dependencies 항목이 추가된다", "설치된 라이브러리의 정확한 버전을 기록하는 package-lock.json 파일이 생성된다", "src 폴더와 index.html이 자동으로 생성된다", "package.json의 \"type\"이 \"module\"로 자동 변경된다"], "answer": [0, 1, 2], "pick": 3, "explain": "라이브러리를 설치하면 실제 파일이 저장되는 node_modules, 버전 범위가 적힌 package.json의 dependencies, 정확한 버전이 적힌 package-lock.json 세 가지가 생긴다. \"type\": \"module\"은 ESM을 쓰려고 직접 추가하는 설정이다."}, {"id": "w009", "ch": "3장", "type": "blank", "q": "Node.js 패키지에서 ESM(import/export) 문법을 사용하고, npm start(run 생략) 명령으로 index.js를 실행하려고 한다. package.json의 빈칸을 채우시오.", "code": "{\n  \"name\": \"chapter3\",\n  \"version\": \"1.0.0\",\n  \"type\": \"___1___\",\n  \"scripts\": {\n    \"___2___\": \"node index.js\"\n  }\n}", "lang": "json", "blanks": [["module"], ["start"]], "explain": "Node.js는 기본적으로 CommonJS를 사용하므로 ESM을 쓰려면 \"type\": \"module\"을 추가해야 한다. scripts는 명령어 매크로이며, start 스크립트는 run을 생략해 npm start로도 실행할 수 있다."}, {"id": "w010", "ch": "4장", "type": "single", "q": "리액트(React)의 특징으로 옳지 않은 것은?", "options": ["페이지를 컴포넌트 단위로 나누어 개발하고, 레고 블록처럼 조립해 페이지를 구성한다", "공통으로 쓰는 UI를 컴포넌트로 만들어 두면, 컴포넌트만 수정해도 사용하는 모든 곳에 반영된다", "변경 사항을 버추얼 돔(Virtual DOM)에 먼저 반영한 뒤 실제 돔을 효율적으로 업데이트한다", "화면을 바꾸려면 개발자가 DOM API로 수정할 요소를 직접 찾아 하나하나 고쳐야 한다", "페이스북(Meta) 개발팀이 만들어 오픈소스로 공개한 UI 라이브러리이다"], "answer": [3], "pick": 1, "explain": "리액트는 '어떤 요소를 어떻게 고칠지' 개발자가 고민하지 않아도 되도록, State가 바뀌면 알아서 화면을 다시 그려 준다(쉽고 간단한 업데이트). DOM API로 요소를 직접 찾아 수정하는 것은 리액트 없이 순수 자바스크립트로 개발할 때의 방식이다."}, {"id": "w011", "ch": "4장", "type": "single", "q": "버추얼 돔(Virtual DOM)에 대한 설명으로 가장 옳은 것은?", "options": ["브라우저가 HTML을 해석해 직접 만드는 실제 DOM 트리를 말한다", "실제 DOM의 사본으로, 여러 변경 사항을 모았다가 실제 DOM에 한 번에 반영해 불필요한 렌더링을 줄인다", "버추얼 돔을 사용하면 브라우저의 레이아웃·페인팅 단계가 아예 생략된다", "State가 바뀔 때마다 실제 DOM을 즉시 여러 번 수정하기 위한 도구이다"], "answer": [1], "pick": 1, "explain": "버추얼 돔은 실제 돔의 '가상 사본'이다. 리액트는 변경 사항을 먼저 버추얼 돔에 반영해 모아 두었다가 실제 돔은 한 번에 업데이트한다. 그래서 비용이 큰 레이아웃·페인팅이 여러 번 반복되는 것을 줄여 준다(완전히 없애는 것은 아님)."}, {"id": "w012", "ch": "4장", "type": "single", "q": "Vite로 만든 리액트 프로젝트에서 개발 서버를 실행하는 명령어와 기본 접속 주소로 옳은 것은?", "options": ["npm start — http://localhost:3000", "npm run dev — http://localhost:5173", "npm run build — http://localhost:5173", "npm run dev — http://localhost:3000", "node main.jsx — http://localhost:8080"], "answer": [1], "pick": 1, "explain": "Vite 프로젝트는 package.json의 scripts에 \"dev\"가 있어 npm run dev로 실행하고, 기본 주소는 http://localhost:5173 이다. npm start와 3000번 포트는 CRA(Create React App)의 방식이고, npm run build는 배포용 빌드 명령이다."}, {"id": "w013", "ch": "4장", "type": "single", "q": "다음 main.jsx 코드에 대한 설명으로 옳은 것은?", "code": "import { createRoot } from \"react-dom/client\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"root\")).render(<App />);", "lang": "jsx", "options": ["index.html에 있는 id가 root인 요소를 리액트 앱의 루트로 만들고, 그 아래에 App 컴포넌트를 렌더링한다", "App 컴포넌트가 index.html 파일을 새로 생성한다", "root라는 이름의 컴포넌트를 App 컴포넌트 안에 렌더링한다", "render 메서드는 App 컴포넌트를 서버로 전송한다"], "answer": [0], "pick": 1, "explain": "createRoot는 인수로 받은 DOM 요소(index.html의 <div id=\"root\">)를 리액트 앱의 루트로 만든다. 이어서 render(<App />)가 그 루트 아래에 App 컴포넌트를 추가해 화면에 나타나게 한다."}, {"id": "w014", "ch": "4장", "type": "multi", "q": "Vite로 생성한 리액트 프로젝트에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["index.html이 프로젝트 루트 폴더에 있고 앱의 시작점(엔트리) 역할을 한다", "CRA의 src/index.js 역할을 src/main.jsx가 담당한다", "node_modules 없이 공유받은 프로젝트는 npm install(npm i)로 라이브러리를 다시 설치해야 한다", "기본 개발 서버 포트는 3000번이다", "npm run dev를 실행하면 bundle.js를 먼저 만들어 public 폴더에 저장한다"], "answer": [0, 1, 2], "pick": 3, "explain": "Vite는 루트의 index.html이 엔트리이며, 개발 중에는 번들 파일 없이 ESM 모듈을 직접 불러온다(번들링은 npm run build 때 수행). main.jsx가 CRA의 index.js를 대체하고, 기본 포트는 5173이다."}, {"id": "w015", "ch": "4장", "type": "blank", "q": "Vite 리액트 앱의 main.jsx이다. index.html의 <div id=\"root\"><\/div>를 루트로 하여 App 컴포넌트를 렌더링하도록 빈칸을 채우시오.", "code": "import { createRoot } from \"react-dom/client\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"___1___\")).___2___(<App />);", "lang": "jsx", "blanks": [["root"], ["render"]], "explain": "createRoot는 id가 root인 DOM 요소를 리액트 앱의 루트로 만들고, render 메서드는 인수로 받은 컴포넌트(App)를 그 루트 아래에 렌더링한다."}, {"id": "w016", "ch": "5장", "type": "single", "q": "다음 컴포넌트가 화면에 표시하는 내용으로 옳은 것은? (세 <p> 태그의 내용을 순서대로 / 로 구분)", "code": "function Body() {\n  const num = 10;\n  const isOk = true;\n  const str = \"리액트\";\n  return (\n    <div>\n      <p>{num + 5}<\/p>\n      <p>{isOk}<\/p>\n      <p>{str + num}<\/p>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["15 / true / 리액트10", "15 / (빈 칸) / 리액트10", "105 / true / 리액트10", "15 / (빈 칸) / 리액트 + 10", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "{num + 5}는 산술 표현식이라 15가 출력된다. 불리언 값(true/false)은 JSX에서 화면에 렌더링되지 않으므로 두 번째 <p>는 비어 있다. 문자열 + 숫자는 문자열 연결이 되어 '리액트10'이 된다."}, {"id": "w017", "ch": "5장", "type": "single", "q": "주석 위치에 다음 표현식을 넣었을 때 'Objects are not valid as a React child' 오류가 발생하는 것은?", "code": "function Body() {\n  const user = { name: \"이정환\", age: 27 };\n  const list = [1, 2, 3];\n  return (\n    <div>\n      {/* 여기에 표현식이 들어간다 */}\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["{user.name}", "{list}", "{null}", "{user}", "{String(true)}"], "answer": [3], "pick": 1, "explain": "JSX의 중괄호 안에 일반 객체를 넣으면 '객체는 리액트의 자식으로 유효하지 않다'는 오류가 난다. user.name처럼 프로퍼티로 접근해 원시값(문자열·숫자)으로 바꿔야 한다. 배열 [1, 2, 3]은 풀어서 123으로 출력되고, null은 무시된다."}, {"id": "w018", "ch": "5장", "type": "single", "q": "다음 코드의 화면 출력 결과로 옳은 것은?", "code": "function Body({ name, location, favorList = [] }) {\n  return (\n    <div>\n      {name}은 {location}에 살고 {favorList.length}개의 음식을 좋아합니다\n    <\/div>\n  );\n}\n\nfunction App() {\n  return <Body name=\"이정환\" location=\"부천시\" />;\n}", "lang": "jsx", "options": ["이정환은 부천시에 살고 0개의 음식을 좋아합니다", "이정환은 부천시에 살고 개의 음식을 좋아합니다", "이정환은 부천시에 살고 undefined개의 음식을 좋아합니다", "TypeError: Cannot read properties of undefined (reading 'length') 오류가 발생한다"], "answer": [0], "pick": 1, "explain": "App이 favorList를 전달하지 않았지만, Body에서 구조 분해 할당할 때 favorList = [] 로 기본값을 정해 두었다. 그래서 favorList는 빈 배열이 되고 length는 0이다. 기본값이 없었다면 undefined.length를 읽으려 해서 TypeError가 났을 것이다."}, {"id": "w019", "ch": "5장", "type": "single", "q": "Body 컴포넌트가 자신의 태그 사이에 배치된 ChildComp를 렌더링하려면 ? 자리에 props의 어떤 프로퍼티를 써야 하는가?", "code": "function ChildComp() {\n  return <div>child component<\/div>;\n}\n\nfunction Body(props) {\n  return <div>{props.?}<\/div>;\n}\n\nfunction App() {\n  return (\n    <Body>\n      <ChildComp />\n    <\/Body>\n  );\n}", "lang": "jsx", "options": ["child", "children", "ChildComp", "component", "elements"], "answer": [1], "pick": 1, "explain": "컴포넌트 태그 사이에 다른 컴포넌트나 요소를 배치하면 리액트가 자동으로 props의 children 프로퍼티에 담아 전달한다. 그래서 {props.children}(또는 구조 분해 할당한 {children})으로 렌더링한다."}, {"id": "w020", "ch": "5장", "type": "single", "q": "버튼을 클릭했을 때만 handleOnClick 함수가 실행되도록 올바르게 작성한 것은?", "options": ["<button onclick=\"handleOnClick()\">클릭<\/button>", "<button onClick={handleOnClick()}>클릭<\/button>", "<button onClick={handleOnClick}>클릭<\/button>", "<button onClick=\"handleOnClick\">클릭<\/button>"], "answer": [2], "pick": 1, "explain": "리액트에서는 이벤트 이름을 카멜 케이스(onClick)로 쓰고, 중괄호 안에 함수 자체(콜백)를 전달한다. handleOnClick()처럼 괄호를 붙이면 렌더링할 때 바로 호출되어 버리고, 문자열로 넣으면 동작하지 않는다."}, {"id": "w021", "ch": "5장", "type": "single", "q": "다음 컴포넌트에서 B 버튼을 클릭했을 때 콘솔에 출력되는 값은?", "code": "function Body() {\n  const handleOnClick = (e) => {\n    console.log(e.target.name);\n  };\n\n  return (\n    <div>\n      <button name=\"A버튼\" onClick={handleOnClick}>A<\/button>\n      <button name=\"B버튼\" onClick={handleOnClick}>B<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["A", "B", "A버튼", "B버튼", "undefined"], "answer": [3], "pick": 1, "explain": "이벤트 핸들러는 이벤트 객체 e를 매개변수로 받는다. e.target에는 이벤트가 발생한 요소(클릭한 B 버튼)가 저장되므로, e.target.name은 그 버튼의 name 속성값인 'B버튼'이다."}, {"id": "w022", "ch": "5장", "type": "single", "q": "다음 코드에 대한 설명으로 옳지 않은 것은?", "code": "const [light, setLight] = useState(\"off\");", "lang": "jsx", "options": ["useState는 2개의 요소를 담은 배열을 반환하며, 이를 배열 구조 분해 할당으로 받았다", "light는 현재 State 값을 저장하는 State 변수이다", "setLight는 State 값을 변경하는 set 함수이다", "\"off\"는 State의 초기값이다", "light = \"on\"; 처럼 State 변수에 직접 값을 대입해도 화면이 다시 렌더링된다"], "answer": [4], "pick": 1, "explain": "State 값은 반드시 set 함수(setLight)로 바꿔야 리액트가 변화를 알아채고 컴포넌트를 리렌더링한다. State 변수에 직접 대입하면 화면이 바뀌지 않으며, const로 선언했기 때문에 오히려 오류가 난다."}, {"id": "w023", "ch": "5장", "type": "single", "q": "StrictMode를 제거한 상태에서 페이지를 처음 열고 + 버튼을 정확히 3번 클릭했다. 콘솔에 Update!는 총 몇 번 출력되는가?", "code": "function Body() {\n  const [count, setCount] = useState(0);\n  console.log(\"Update!\");\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={() => setCount(count + 1)}>+<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["1번", "3번", "4번", "6번"], "answer": [2], "pick": 1, "explain": "처음 화면에 렌더링(마운트)될 때 컴포넌트 함수가 한 번 호출되어 1번 출력된다. 이후 버튼을 누를 때마다 State가 바뀌어 컴포넌트 함수가 다시 호출(리렌더링)되므로 3번이 더 출력되어 총 4번이다."}, {"id": "w024", "ch": "5장", "type": "single", "q": "count가 0일 때 onClick 함수를 한 번 실행했다. 리렌더링 후 화면에 표시되는 count 값은?", "code": "const [count, setCount] = useState(0);\n\nconst onClick = () => {\n  setCount(count + 1);\n  setCount(count + 1);\n  setCount(count + 1);\n};", "lang": "jsx", "options": ["0", "1", "3", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "State는 렌더링 시점의 '스냅샷'이다. onClick 안에서 count는 계속 0이므로 세 줄 모두 setCount(0 + 1)을 요청하는 것과 같아 결과는 1이다. 3을 만들고 싶다면 setCount((prev) => prev + 1)처럼 함수형 업데이트를 써야 한다."}, {"id": "w025", "ch": "5장", "type": "single", "q": "useRef에 대한 설명으로 옳지 않은 것은?", "options": ["useRef(초기값)은 current 프로퍼티를 가진 Ref 객체를 반환한다", "<input ref={inputRef} />처럼 연결하면 inputRef.current로 해당 DOM 요소에 접근할 수 있다", "ref.current 값을 바꾸면 State처럼 컴포넌트가 자동으로 리렌더링된다", "리렌더링되어도 값이 유지되므로, 할 일 앱의 idRef처럼 컴포넌트 안의 변수로도 활용할 수 있다"], "answer": [2], "pick": 1, "explain": "Ref 객체의 current 값은 바꿔도 리렌더링을 일으키지 않는다. 그래서 화면에 보여 줄 값은 State로, 화면과 상관없이 기억만 하면 되는 값(id 카운터, DOM 요소 참조 등)은 Ref로 관리한다."}, {"id": "w026", "ch": "5장", "type": "multi", "q": "JSX 문법에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["<input>, <br>처럼 닫는 태그가 없는 요소도 <input />, <br />처럼 반드시 닫아야 한다", "컴포넌트가 반환하는 JSX는 하나의 최상위 태그로 감싸야 하며, 빈 태그 <><\/>(Fragment)를 사용할 수 있다", "HTML의 class 속성 대신 className을 사용한다", "if문은 JSX의 중괄호 { } 안에 직접 작성할 수 있다", "{true}처럼 불리언 값을 넣으면 화면에 \"true\"가 출력된다"], "answer": [0, 1, 2], "pick": 3, "explain": "JSX는 닫힘 규칙, 최상위 태그 규칙을 지켜야 하고 class는 자바스크립트 예약어라 className을 쓴다. if문은 값이 아닌 '문(statement)'이라 중괄호 안에 쓸 수 없으므로 삼항 연산자나 && 를 사용한다. 불리언 값은 화면에 렌더링되지 않는다."}, {"id": "w027", "ch": "5장", "type": "multi", "q": "함수 컴포넌트가 리렌더링되는 경우를 모두 고르시오.", "options": ["자신이 가진 State 값이 set 함수로 변경되었을 때", "부모로부터 받은 Props 값이 변경되었을 때", "부모 컴포넌트가 리렌더링되었을 때", "useRef로 만든 ref.current 값을 변경했을 때", "컴포넌트 안에서 let으로 선언한 일반 변수 값을 바꿨을 때"], "answer": [0, 1, 2], "pick": 3, "explain": "컴포넌트는 State 변경, Props 변경, 부모 리렌더링 때 다시 렌더링된다(부모가 리렌더되면 Props가 안 바뀐 자식도 함께 리렌더된다). ref.current나 일반 변수를 바꾸는 것은 리액트가 감지하지 않아 리렌더링을 일으키지 않는다."}, {"id": "w028", "ch": "5장", "type": "review", "q": "버튼을 누르기도 전에 'Too many re-renders' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  const onIncrease = () => {\n    setCount(count + 1);\n  };\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={onIncrease()}>+<\/button>\n    <\/div>\n  );\n}\n\nexport default Counter;", "lang": "jsx", "answer": [13], "fix": "<button onClick={onIncrease}>+<\/button>", "explain": "onClick={onIncrease()}는 렌더링할 때 함수를 즉시 호출한다. 그 안에서 setCount가 실행되어 다시 렌더링되고, 또 호출되고… 무한 반복이 된다. 이벤트 핸들러에는 함수 자체(onIncrease)를 전달해야 한다."}, {"id": "w029", "ch": "5장", "type": "review", "q": "다음 컴포넌트는 JSX 규칙에 맞지 않아 콘솔에 경고가 발생한다. 잘못된 줄을 고르시오.", "code": "import \"./Body.css\";\n\nfunction Body() {\n  const number = 1;\n  return (\n    <div class=\"body\">\n      <h1>body<\/h1>\n      <h2>{number}<\/h2>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [6], "fix": "<div className=\"body\">", "explain": "class는 자바스크립트의 예약어(클래스 문법)이기 때문에 JSX에서는 CSS 클래스를 지정할 때 className을 사용한다. 비슷하게 label의 for도 htmlFor로 쓴다."}, {"id": "w030", "ch": "5장", "type": "review", "q": "Welcome 컴포넌트의 내용이 화면에 나오지 않고, 콘솔에 'If you meant to render a React component, start its name with an uppercase letter' 경고가 뜬다. 잘못된 줄을 고르시오.", "code": "function Welcome() {\n  return <h1>환영합니다!<\/h1>;\n}\n\nfunction App() {\n  return (\n    <div>\n      <welcome />\n      <p>본문 내용<\/p>\n    <\/div>\n  );\n}\n\nexport default App;", "lang": "jsx", "answer": [8], "fix": "<Welcome />", "explain": "리액트는 소문자로 시작하는 태그를 HTML 태그로, 대문자로 시작하는 태그를 컴포넌트로 인식한다. 그래서 컴포넌트 이름은 항상 대문자로 시작하고, 사용할 때도 <Welcome />처럼 대문자로 써야 한다."}, {"id": "w031", "ch": "5장", "type": "review", "q": "입력창에 아무리 타이핑해도 글자가 입력되지 않는다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n\n  const handleOnChange = (e) => {\n    setText(e.target.value);\n  };\n\n  return (\n    <div>\n      <input value={text} />\n      <div>{text}<\/div>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [12], "fix": "<input value={text} onChange={handleOnChange} />", "explain": "value를 State로 고정했는데 onChange 핸들러가 없으면, 입력할 때 State가 바뀌지 않아 input 값이 계속 빈 문자열로 유지된다. onChange={handleOnChange}를 연결해 입력값(e.target.value)을 State에 저장해야 한다."}, {"id": "w032", "ch": "5장", "type": "review", "q": "다섯 글자 미만으로 입력하고 버튼을 누르면 입력창에 포커스가 가야 하는데, 'focus is not a function' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  const textRef = useRef();\n\n  const handleOnClick = () => {\n    if (text.length < 5) {\n      textRef.focus();\n    } else {\n      alert(text);\n      setText(\"\");\n    }\n  };\n\n  return (\n    <div>\n      <input ref={textRef} value={text} onChange={(e) => setText(e.target.value)} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [9], "fix": "textRef.current.focus();", "explain": "useRef가 반환하는 Ref 객체는 실제 DOM 요소를 current 프로퍼티에 저장한다. 그래서 input 요소의 focus 메서드는 textRef.current.focus()로 호출해야 한다."}, {"id": "w033", "ch": "5장", "type": "review", "q": "이름을 입력한 뒤 성별을 선택하면 입력했던 이름이 사라진다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Body() {\n  const [state, setState] = useState({ name: \"\", gender: \"\", birth: \"\" });\n\n  const handleOnChange = (e) => {\n    setState({ [e.target.name]: e.target.value });\n  };\n\n  return (\n    <div>\n      <input name=\"name\" value={state.name} onChange={handleOnChange} />\n      <select name=\"gender\" value={state.gender} onChange={handleOnChange}>\n        <option value=\"\">선택<\/option>\n        <option value=\"남성\">남성<\/option>\n        <option value=\"여성\">여성<\/option>\n      <\/select>\n      <input name=\"birth\" type=\"date\" value={state.birth} onChange={handleOnChange} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": "setState({ ...state, [e.target.name]: e.target.value });", "explain": "set 함수에 전달한 객체가 State를 통째로 대체한다. 바뀐 프로퍼티 하나만 넣으면 나머지 프로퍼티가 사라진다. ...state로 기존 값을 펼쳐 복사한 뒤, 바뀐 값만 덮어써야 한다."}, {"id": "w034", "ch": "5장", "type": "review", "q": "숫자가 짝수인지 홀수인지 표시하려 했는데 문법 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "function Body() {\n  const num = 19;\n\n  return (\n    <div>\n      <h2>{num}은(는)<\/h2>\n      <h2>{if (num % 2 === 0) \"짝수\" else \"홀수\"}<\/h2>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [7], "fix": "<h2>{num % 2 === 0 ? \"짝수\" : \"홀수\"}<\/h2>", "explain": "JSX의 중괄호 안에는 값으로 평가되는 '표현식'만 쓸 수 있다. if문은 표현식이 아니라 문(statement)이므로 사용할 수 없다. 삼항 연산자를 쓰거나, return 전에 if문으로 처리해야 한다."}, {"id": "w035", "ch": "5장", "type": "review", "q": "App에서 Body 태그 사이에 ChildComp를 넣었는데 'Objects are not valid as a React child' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "function Body(children) {\n  return <div className=\"body\">{children}<\/div>;\n}\n\nfunction ChildComp() {\n  return <div>child component<\/div>;\n}\n\nfunction App() {\n  return (\n    <Body>\n      <ChildComp />\n    <\/Body>\n  );\n}", "lang": "jsx", "answer": [1], "fix": "function Body({ children }) {", "explain": "컴포넌트의 매개변수에는 Props '객체' 전체가 들어온다. Body(children)라고 쓰면 children이라는 이름의 변수에 props 객체가 담기고, 객체를 JSX에 렌더링하려다 오류가 난다. 구조 분해 할당 { children }으로 꺼내야 한다."}, {"id": "w036", "ch": "5장", "type": "blank", "q": "버튼을 클릭할 때마다 count가 1씩 증가하는 카운터를 완성하시오.", "code": "import { ___1___ } from \"react\";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={() => ___2___}>+1<\/button>\n    <\/div>\n  );\n}\n\nexport default Counter;", "lang": "jsx", "blanks": [["useState"], ["setCount(count + 1)", "setCount(count+1)", "setCount(1 + count)", "setCount(1+count)", "setCount((prev) => prev + 1)", "setCount(prev => prev + 1)", "setCount((prev)=>prev+1)", "setCount(prev=>prev+1)"]], "explain": "useState는 react 패키지에서 불러오는 훅이다. 값을 바꿀 때는 set 함수에 '새 값'을 전달한다. setCount(count + 1)처럼 현재 값에 1을 더한 값을 넘기면 State가 바뀌고 컴포넌트가 리렌더링된다."}, {"id": "w037", "ch": "5장", "type": "blank", "q": "Header 컴포넌트를 별도 파일로 분리했다. App.jsx에서 중괄호 없이 불러올 수 있도록 빈칸을 채우시오. (App.jsx는 src 폴더에, Header.jsx는 src/components 폴더에 있다)", "code": "// src/components/Header.jsx\nfunction Header() {\n  return (\n    <header>\n      <h1>header<\/h1>\n    <\/header>\n  );\n}\n\n___1___ Header;\n\n// src/App.jsx\nimport Header from \"___2___\";", "lang": "jsx", "blanks": [["export default"], ["./components/Header", "./components/Header.jsx"]], "explain": "모듈의 기본값으로 내보내려면 export default를 쓴다. 기본값으로 내보낸 것은 중괄호 없이 원하는 이름으로 불러올 수 있다. 경로의 '.'은 현재 파일(App.jsx)이 있는 폴더(src)를 뜻한다."}, {"id": "w038", "ch": "5장", "type": "blank", "q": "<작성 완료> 버튼을 누르면 입력값을 알림창에 띄우고, 입력창을 비운 뒤 다시 포커스하도록 빈칸을 채우시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  const textRef = ___1___;\n\n  const handleOnClick = () => {\n    alert(text);\n    setText(\"\");\n    textRef.___2___.focus();\n  };\n\n  return (\n    <div>\n      <input ___3___ value={text} onChange={(e) => setText(e.target.value)} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["useRef()", "useRef(null)"], ["current"], ["ref={textRef}"]], "explain": "useRef()로 Ref 객체를 만들고, input에 ref={textRef}로 연결하면 textRef.current에 해당 input DOM 요소가 저장된다. 그 요소의 focus() 메서드로 입력창에 포커스를 줄 수 있다."}, {"id": "w039", "ch": "5장", "type": "blank", "q": "App이 favorList를 전달하지 않아도 오류가 나지 않도록, favorList의 기본값을 빈 배열로 지정하시오.", "code": "function Body({ name, location, favorList ___1___ }) {\n  return (\n    <div>\n      {name}은 {location}에 거주합니다.\n      <br />\n      {favorList.length}개의 음식을 좋아합니다.\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "blanks": [["= []", "=[]"]], "explain": "구조 분해 할당에서 '변수 = 기본값' 형태로 기본값을 지정할 수 있다. 전달되지 않은 Props는 undefined인데, 기본값을 []로 주면 favorList.length가 0이 되어 오류를 막을 수 있다."}, {"id": "w040", "ch": "5장", "type": "blank", "q": "여러 입력 폼(name, gender, birth, bio)을 하나의 객체 State로 관리한다. 입력한 폼의 값만 바뀌고 나머지 값은 유지되도록 빈칸을 채우시오.", "code": "const [state, setState] = useState({\n  name: \"\",\n  gender: \"\",\n  birth: \"\",\n  bio: \"\",\n});\n\nconst handleOnChange = (e) => {\n  setState({\n    ___1___,\n    [e.target.___2___]: e.target.value,\n  });\n};\n\n// <input name=\"name\" value={state.name} onChange={handleOnChange} />", "lang": "jsx", "blanks": [["...state"], ["name"]], "explain": "...state로 기존 객체의 프로퍼티를 모두 복사한 뒤, 바뀐 프로퍼티만 덮어쓴다. [e.target.name]은 계산된 프로퍼티 이름으로, 이벤트가 발생한 폼의 name 속성값(name, gender 등)을 키로 사용한다."}, {"id": "w041", "ch": "6장", "type": "single", "q": "App에서 {count % 2 === 0 && <Even />} 으로 Even 컴포넌트를 조건부 렌더링한다. count가 2에서 3으로 바뀔 때 Even 컴포넌트가 겪는 라이프 사이클 단계는?", "options": ["마운트(Mount)", "업데이트(Update)", "언마운트(Unmount)", "아무 변화도 없다"], "answer": [2], "pick": 1, "explain": "count가 3이 되면 count % 2 === 0이 false가 되어 Even이 더 이상 렌더링되지 않는다. 이렇게 컴포넌트가 화면에서 사라지는 단계를 언마운트라고 하며, useEffect의 클린업 함수로 이 시점을 제어할 수 있다."}, {"id": "w042", "ch": "6장", "type": "single", "q": "페이지를 처음 열고 +10 버튼을 2번 클릭했을 때 콘솔 출력으로 옳은 것은? (StrictMode 제거 상태)", "code": "function App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    console.log(`count 업데이트: ${count}`);\n  }, [count]);\n\n  return (\n    <button onClick={() => setCount(count + 10)}>+10<\/button>\n  );\n}", "lang": "jsx", "options": ["count 업데이트: 10 → count 업데이트: 20", "count 업데이트: 0 → count 업데이트: 10 → count 업데이트: 20", "count 업데이트: 0", "count 업데이트: 0 → count 업데이트: 0 → count 업데이트: 0"], "answer": [1], "pick": 1, "explain": "useEffect는 마운트될 때 한 번 실행되고(이때 count는 0), 이후 의존성 배열의 count가 바뀔 때마다 다시 실행된다. 그래서 0, 10, 20이 차례로 출력된다."}, {"id": "w043", "ch": "6장", "type": "single", "q": "다음 코드를 넣은 뒤 버튼을 빠르게 여러 번 클릭해 리렌더링이 반복되면, '깜빡'이 1초보다 훨씬 빠르게 출력된다. 원인으로 옳은 것은?", "code": "useEffect(() => {\n  setInterval(() => {\n    console.log(\"깜빡\");\n  }, 1000);\n});", "lang": "jsx", "options": ["setInterval의 시간 단위가 밀리초가 아니라 초이기 때문이다", "의존성 배열이 없어 렌더링마다 새 인터벌이 생기는데, 이전 인터벌을 clearInterval로 정리하지 않았기 때문이다", "useEffect는 마운트 시점에 한 번만 실행되기 때문이다", "console.log가 비동기로 동작하기 때문이다"], "answer": [1], "pick": 1, "explain": "의존성 배열을 생략하면 렌더링할 때마다 콜백이 실행되어 setInterval이 계속 새로 만들어진다. 이전 인터벌을 지우지 않으니 인터벌이 여러 개 겹쳐 출력이 빨라진다. return () => clearInterval(id) 형태의 클린업 함수로 해결한다."}, {"id": "w044", "ch": "6장", "type": "multi", "q": "useEffect에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["useEffect(콜백)처럼 의존성 배열을 생략하면 마운트와 모든 리렌더링 때마다 콜백이 실행된다", "useEffect(콜백, [])처럼 빈 배열을 전달하면 마운트 시점에만 콜백이 실행된다", "콜백 함수가 반환하는 함수(클린업 함수)는 컴포넌트가 언마운트될 때에도 실행된다", "useEffect(콜백, [count])는 count가 바뀔 때만 실행되며, 마운트 시점에는 실행되지 않는다", "useEffect는 클래스 컴포넌트에서만 사용할 수 있다"], "answer": [0, 1, 2], "pick": 3, "explain": "의존성 배열이 있어도 마운트 시점에는 한 번 실행된다(그래서 'count 업데이트: 0'이 처음에 출력됨). 클린업 함수는 Effect가 다시 실행되기 전과 언마운트될 때 실행된다. useEffect 같은 훅은 함수 컴포넌트에서 사용한다."}, {"id": "w045", "ch": "6장", "type": "review", "q": "리렌더링할 때마다 이전 인터벌을 정리하려고 클린업을 작성했지만, '깜빡'이 한 번도 출력되지 않는다. 잘못된 줄을 고르시오.", "code": "import { useState, useEffect } from \"react\";\n\nfunction App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    const intervalID = setInterval(() => {\n      console.log(\"깜빡\");\n    }, 1000);\n    return clearInterval(intervalID);\n  });\n\n  return <button onClick={() => setCount(count + 1)}>{count}<\/button>;\n}", "lang": "jsx", "answer": [10], "fix": "return () => clearInterval(intervalID);", "explain": "클린업은 '함수'를 반환해야 한다. return clearInterval(intervalID)는 반환하는 순간 clearInterval을 바로 실행해서, 인터벌을 만들자마자 지워 버린다. return () => clearInterval(intervalID)처럼 함수로 감싸야 다음 Effect 실행 전이나 언마운트 때 실행된다."}, {"id": "w046", "ch": "6장", "type": "review", "q": "컴포넌트가 처음 마운트될 때 visit을 한 번만 1 증가시키려 했는데, 값이 끝없이 증가한다. 잘못된 줄을 고르시오.", "code": "import { useState, useEffect } from \"react\";\n\nfunction App() {\n  const [visit, setVisit] = useState(0);\n\n  useEffect(() => {\n    setVisit(visit + 1);\n  });\n\n  return <div>방문 횟수: {visit}<\/div>;\n}", "lang": "jsx", "answer": [8], "fix": "}, []);", "explain": "의존성 배열을 생략하면 렌더링할 때마다 콜백이 실행된다. 콜백 안에서 State를 바꾸니 리렌더링 → Effect 실행 → State 변경 → 리렌더링이 무한 반복된다. 마운트 때만 실행하려면 빈 배열 []을 두 번째 인수로 전달한다."}, {"id": "w047", "ch": "6장", "type": "blank", "q": "컴포넌트가 마운트될 때 한 번만 콘솔에 메시지를 출력하도록 빈칸을 채우시오.", "code": "import { useState, ___1___ } from \"react\";\n\nfunction App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    console.log(\"컴포넌트 마운트\");\n  }, ___2___);\n\n  return <button onClick={() => setCount(count + 1)}>{count}<\/button>;\n}", "lang": "jsx", "blanks": [["useEffect"], ["[]"]], "explain": "useEffect도 react에서 불러오는 훅이다. 의존성 배열로 빈 배열 []을 전달하면 검사할 값이 없으므로 마운트 시점에만 콜백이 실행된다."}, {"id": "w048", "ch": "6장", "type": "blank", "q": "렌더링될 때마다 이전 인터벌을 정리하도록 클린업 함수를 작성하시오.", "code": "useEffect(() => {\n  const intervalID = setInterval(() => {\n    console.log(\"깜빡\");\n  }, 1000);\n\n  return ___1___;\n});", "lang": "jsx", "blanks": [["() => clearInterval(intervalID)", "()=>clearInterval(intervalID)", "() =>clearInterval(intervalID)", "()=> clearInterval(intervalID)", "() => { clearInterval(intervalID); }", "() => {clearInterval(intervalID);}", "() => { clearInterval(intervalID) }", "() => {clearInterval(intervalID)}"]], "explain": "useEffect의 콜백이 반환하는 '함수'가 클린업 함수다. 다음 Effect가 실행되기 전과 언마운트될 때 호출되어 clearInterval로 이전 인터벌을 지운다. 함수로 감싸지 않으면 즉시 실행되어 버린다."}, {"id": "w049", "ch": "6장", "type": "blank", "q": "Even 컴포넌트는 count가 짝수일 때만 렌더링되며, 화면에서 사라질 때 콘솔에 메시지를 출력한다. 빈칸을 채우시오.", "code": "// Even.jsx\nimport { useEffect } from \"react\";\n\nfunction Even() {\n  useEffect(() => {\n    ___1___ () => {\n      console.log(\"Even 컴포넌트 언마운트\");\n    };\n  }, []);\n\n  return <div>현재 카운트는 짝수입니다<\/div>;\n}\n\n// App.jsx 의 return 문 일부\n{count % 2 === 0 ___2___ <Even />}", "lang": "jsx", "blanks": [["return"], ["&&"]], "explain": "빈 의존성 배열을 쓴 useEffect에서 클린업 함수를 return하면 언마운트될 때 실행된다. 조건부 렌더링에는 AND 단락 평가(&&)를 사용해, 앞의 조건이 참일 때만 <Even />이 렌더링되게 한다."}, {"id": "w050", "ch": "카운터앱", "type": "single", "q": "카운터 앱은 App 아래에 형제 관계인 Viewer(카운트 표시)와 Controller(증감 버튼)로 구성된다. count State를 만들어야 하는 컴포넌트와 그 이유로 옳은 것은?", "options": ["Viewer — count를 화면에 표시하는 컴포넌트이므로", "Controller — 버튼을 눌러 count를 바꾸는 컴포넌트이므로", "App — Props는 부모에서 자식으로만 전달되므로, 두 컴포넌트의 공통 부모가 State를 관리해야 둘 다 사용할 수 있기 때문", "main.jsx — 앱 전체에서 사용하는 값이므로"], "answer": [2], "pick": 1, "explain": "Viewer와 Controller는 부모-자식 관계가 아니라서 서로 Props를 주고받을 수 없다. 그래서 공통 부모인 App에 State를 두고 count는 Viewer에, 값을 바꾸는 함수는 Controller에 Props로 내려준다. 이를 'State 끌어올리기(State Lifting)'라고 한다."}, {"id": "w051", "ch": "카운터앱", "type": "single", "q": "리액트의 데이터 흐름에 대한 설명으로 옳은 것은?", "options": ["Props는 자식에서 부모 방향으로도 자유롭게 전달할 수 있다", "형제 컴포넌트끼리는 Props로 직접 값을 주고받을 수 있다", "데이터(State)는 Props를 통해 부모→자식으로 흐르고, State를 바꾸는 이벤트는 부모가 내려준 함수를 자식이 호출하는 방식으로 위로 전달된다", "자식 컴포넌트는 전달받은 Props 값을 직접 수정해 부모의 State를 바꿀 수 있다"], "answer": [2], "pick": 1, "explain": "리액트는 '단방향 데이터 흐름'을 따른다. 데이터는 항상 부모에서 자식으로 Props로 내려가고, 자식은 부모가 내려준 함수(예: onClickButton, onCreate)를 호출해서 State 변경을 요청한다."}, {"id": "w052", "ch": "카운터앱", "type": "review", "q": "카운터 앱에서 현재 카운트 숫자가 화면에 나타나지 않는다. Viewer 컴포넌트는 수정하지 않는다고 할 때, 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Viewer({ number }) {\n  return (\n    <div>\n      <div>현재 카운트 :<\/div>\n      <h1>{number}<\/h1>\n    <\/div>\n  );\n}\n\nfunction App() {\n  const [count, setCount] = useState(0);\n  return (\n    <div className=\"App\">\n      <h1>Simple Counter<\/h1>\n      <Viewer count={count} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [17], "fix": "<Viewer number={count} />", "explain": "Viewer는 Props에서 number라는 이름의 값을 꺼내 쓰는데, App은 count라는 이름으로 전달했다. 그래서 number는 undefined가 되어 아무것도 출력되지 않는다. 보내는 쪽과 받는 쪽의 Props 이름이 같아야 한다."}, {"id": "w053", "ch": "카운터앱", "type": "review", "q": "페이지를 열자마자 'Too many re-renders' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "function Controller({ onClickButton }) {\n  return (\n    <div>\n      <button onClick={() => onClickButton(-1)}>-1<\/button>\n      <button onClick={() => onClickButton(-10)}>-10<\/button>\n      <button onClick={onClickButton(10)}>+10<\/button>\n      <button onClick={() => onClickButton(1)}>+1<\/button>\n    <\/div>\n  );\n}\n\nexport default Controller;", "lang": "jsx", "answer": [6], "fix": "<button onClick={() => onClickButton(10)}>+10<\/button>", "explain": "인수를 넘겨야 하는 함수는 onClick={onClickButton(10)}처럼 쓰면 렌더링 중에 바로 호출된다. 부모의 State가 바뀌어 리렌더 → 또 호출 → 무한 반복이 된다. () => onClickButton(10)처럼 화살표 함수로 감싸 클릭할 때 호출되도록 해야 한다."}, {"id": "w054", "ch": "카운터앱", "type": "blank", "q": "App이 State를 관리하고, Controller의 버튼을 누르면 해당 값만큼 count가 바뀌도록 빈칸을 채우시오.", "code": "function App() {\n  const [count, setCount] = useState(0);\n\n  const onClickButton = (value) => {\n    setCount(___1___);\n  };\n\n  return (\n    <div className=\"App\">\n      <h1>Simple Counter<\/h1>\n      <section>\n        <Viewer count={count} />\n      <\/section>\n      <section>\n        <Controller ___2___={onClickButton} />\n      <\/section>\n    <\/div>\n  );\n}\n\nfunction Controller({ onClickButton }) {\n  return (\n    <div>\n      <button onClick={___3___}>+10<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["count + value", "count+value", "value + count", "value+count"], ["onClickButton"], ["() => onClickButton(10)", "()=>onClickButton(10)", "() =>onClickButton(10)", "()=> onClickButton(10)", "() => { onClickButton(10); }", "() => {onClickButton(10);}", "() => { onClickButton(10) }", "() => {onClickButton(10)}"]], "explain": "State와 이를 바꾸는 함수는 공통 부모인 App에 두고(State 끌어올리기), 함수는 Props로 Controller에 내려준다. Controller는 구조 분해로 onClickButton을 받으므로 Props 이름도 onClickButton이어야 한다. 인수가 필요한 함수는 화살표 함수로 감싸 클릭 시 호출되게 한다."}, {"id": "w055", "ch": "투두앱", "type": "single", "q": "리스트를 map으로 렌더링했더니 'Each child in a list should have a unique \"key\" prop.' 경고가 떴다. key에 대한 설명으로 옳은 것은?", "options": ["key는 화면에 출력할 텍스트를 지정하는 속성이다", "key는 리액트가 리스트의 각 항목을 구분해, 어떤 항목을 추가·수정·삭제할지 판단하는 데 쓰는 고유한 값이다", "key로 전달한 값은 자식 컴포넌트에서 props.key로 꺼내 쓸 수 있다", "모든 항목에 같은 key 값을 주어도 문제없다"], "answer": [1], "pick": 1, "explain": "key는 리스트의 각 컴포넌트를 구별하는 고유 식별자다. 할 일 앱에서는 각 아이템의 id를 key={it.id}로 준다. key는 리액트 내부용이라 자식 컴포넌트의 props로는 전달되지 않으며, 값이 중복되면 안 된다."}, {"id": "w056", "ch": "투두앱", "type": "single", "q": "할 일 앱에서 TodoList는 onUpdate 함수를 직접 쓰지 않지만, 자식인 TodoItem에 전달하기 위해 Props로 받아 다시 넘겨준다. 이런 현상을 무엇이라고 하는가?", "options": ["State Lifting", "Props Drilling", "Virtual DOM", "Cleanup", "Hoisting"], "answer": [1], "pick": 1, "explain": "Props는 바로 아래 자식에게만 전달할 수 있어서, 손자 컴포넌트까지 보내려면 중간 컴포넌트가 받아서 다시 넘겨야 한다. 땅을 파고 내려가는 것 같다고 해서 'Props Drilling'이라고 부른다."}, {"id": "w057", "ch": "투두앱", "type": "multi", "q": "할 일 앱(App 컴포넌트, State: todo 배열)에서 State를 올바르게 업데이트하는 코드를 모두 고르시오.", "options": ["setTodo([newItem, ...todo]);", "todo.push(newItem); setTodo(todo);", "setTodo(todo.filter((it) => it.id !== targetId));", "setTodo(todo.map((it) => it.id === targetId ? { ...it, isDone: !it.isDone } : it));", "todo[0].isDone = true; setTodo(todo);"], "answer": [0, 2, 3], "pick": 3, "explain": "State 배열은 원본을 직접 고치지 말고 새 배열을 만들어 set 함수에 넘겨야 한다. 스프레드·filter·map은 새 배열을 만든다. push나 직접 대입은 원본을 바꾼 뒤 같은 배열(같은 참조)을 넘기므로 리액트가 변경을 감지하지 못한다."}, {"id": "w058", "ch": "투두앱", "type": "review", "q": "할 일 목록은 잘 보이지만 콘솔에 'Each child in a list should have a unique \"key\" prop.' 경고가 뜬다. 잘못된 줄을 고르시오.", "code": "import TodoItem from \"./TodoItem\";\n\nfunction TodoList({ todo, onUpdate, onDelete }) {\n  return (\n    <div className=\"TodoList\">\n      <h4>Todo List<\/h4>\n      <div className=\"list_wrapper\">\n        {todo.map((it) => (\n          <TodoItem {...it} onUpdate={onUpdate} onDelete={onDelete} />\n        ))}\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default TodoList;", "lang": "jsx", "answer": [9], "fix": "<TodoItem key={it.id} {...it} onUpdate={onUpdate} onDelete={onDelete} />", "explain": "map으로 리스트를 렌더링할 때는 각 항목에 고유한 key를 주어야 한다. 리액트는 key로 어떤 항목이 추가·수정·삭제되었는지 구분한다. 할 일 아이템의 고유 식별자인 id를 key={it.id}로 전달한다."}, {"id": "w059", "ch": "투두앱", "type": "review", "q": "<삭제> 버튼을 누르면 해당 할 일만 지워져야 하는데, 오히려 그 할 일 하나만 남고 나머지가 모두 사라진다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction App() {\n  const [todo, setTodo] = useState(mockTodo);\n\n  const onDelete = (targetId) => {\n    setTodo(todo.filter((it) => it.id === targetId));\n  };\n\n  return (\n    <div className=\"App\">\n      <TodoList todo={todo} onDelete={onDelete} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": "setTodo(todo.filter((it) => it.id !== targetId));", "explain": "filter는 콜백이 true를 반환한 요소만 남긴다. id가 targetId와 '같은' 것만 남기면 삭제 대상만 남는다. 삭제하려면 id가 targetId와 '다른' 것만 남겨야 하므로 !== 를 써야 한다."}, {"id": "w060", "ch": "투두앱", "type": "review", "q": "새 할 일을 추가하면 'Assignment to constant variable' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction App() {\n  const idRef = useRef(3);\n  const [todo, setTodo] = useState(mockTodo);\n\n  const onCreate = (content) => {\n    const newItem = {\n      id: idRef.current,\n      content,\n      isDone: false,\n      createdDate: new Date().getTime(),\n    };\n    setTodo([newItem, ...todo]);\n    idRef += 1;\n  };", "lang": "jsx", "answer": [15], "fix": "idRef.current += 1;", "explain": "idRef는 const로 선언된 Ref 객체이므로 변수 자체에 다시 대입할 수 없다. 값은 Ref 객체의 current 프로퍼티에 들어 있으므로 idRef.current += 1로 증가시켜야 한다. Ref는 값을 바꿔도 리렌더링되지 않아 id 카운터로 쓰기 좋다."}, {"id": "w061", "ch": "투두앱", "type": "review", "q": "'React 공부하기'라는 할 일이 있을 때, 검색어 react로는 찾아지지만 React로 검색하면 결과가 나오지 않는다. 대소문자를 구별하지 않게 하려면 어느 줄을 고쳐야 하는가?", "code": "function TodoList({ todo }) {\n  const [search, setSearch] = useState(\"\");\n\n  const getSearchResult = () => {\n    return search === \"\"\n      ? todo\n      : todo.filter((it) => it.content.toLowerCase().includes(search));\n  };\n\n  return (\n    <div className=\"TodoList\">\n      <input value={search} onChange={(e) => setSearch(e.target.value)} />\n      {getSearchResult().map((it) => (\n        <TodoItem key={it.id} {...it} />\n      ))}\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": ": todo.filter((it) => it.content.toLowerCase().includes(search.toLowerCase()));", "explain": "할 일 내용은 toLowerCase()로 소문자로 바꿨지만 검색어는 그대로라서, 'React'로 검색하면 'react 공부하기'에 'React'가 포함되지 않는다. 비교하는 양쪽 모두 소문자로 바꿔야 대소문자를 구별하지 않는다."}, {"id": "w062", "ch": "투두앱", "type": "blank", "q": "할 일 배열을 TodoItem 컴포넌트 리스트로 렌더링한다. 경고가 나지 않도록 빈칸을 채우시오.", "code": "function TodoList({ todo, onUpdate, onDelete }) {\n  return (\n    <div className=\"list_wrapper\">\n      {todo.map((it) => (\n        <TodoItem\n          ___1___\n          {...it}\n          onUpdate={onUpdate}\n          onDelete={onDelete}\n        />\n      ))}\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["key={it.id}"]], "explain": "map으로 만든 리스트의 각 요소에는 고유한 key가 필요하다. 할 일 아이템마다 중복되지 않는 id가 있으므로 key={it.id}를 준다. {...it}은 아이템 객체의 프로퍼티(id, content, isDone, createdDate)를 각각 Props로 펼쳐 전달한다."}, {"id": "w063", "ch": "투두앱", "type": "blank", "q": "할 일 삭제(onDelete)와 완료 여부 토글(onUpdate) 함수를 완성하시오.", "code": "const onDelete = (targetId) => {\n  setTodo(todo.___1___((it) => it.id !== targetId));\n};\n\nconst onUpdate = (targetId) => {\n  setTodo(\n    todo.map((it) =>\n      it.id === targetId ? { ___2___, isDone: !it.isDone } : it\n    )\n  );\n};", "lang": "jsx", "blanks": [["filter"], ["...it"]], "explain": "filter는 조건을 만족하는 요소만 모아 새 배열을 만든다(삭제 대상만 제외). onUpdate는 map으로 새 배열을 만들면서, 대상 아이템만 ...it으로 복사한 뒤 isDone을 반대로 바꾼 새 객체로 교체한다."}, {"id": "w064", "ch": "투두앱", "type": "blank", "q": "검색어가 비어 있으면 전체 목록을, 아니면 검색어를 포함한 할 일만 대소문자 구별 없이 반환하도록 빈칸을 채우시오.", "code": "const getSearchResult = () => {\n  return search === \"\"\n    ? todo\n    : todo.filter((it) =>\n        it.content.toLowerCase().___1___(search.___2___())\n      );\n};", "lang": "jsx", "blanks": [["includes"], ["toLowerCase"]], "explain": "includes는 문자열에 특정 문자열이 포함되어 있는지 true/false로 알려 준다. 할 일 내용과 검색어를 모두 toLowerCase()로 소문자로 바꿔 비교하면 대소문자를 구별하지 않는 검색이 된다."}, {"id": "w065", "ch": "투두앱", "type": "blank", "q": "새 할 일을 목록 맨 앞에 추가하는 onCreate 함수를 완성하시오. (목 데이터 3개의 id는 0, 1, 2)", "code": "const idRef = useRef(3);\n\nconst onCreate = (content) => {\n  const newItem = {\n    id: idRef.___1___,\n    content,\n    isDone: false,\n    createdDate: new Date().getTime(),\n  };\n  setTodo([newItem, ___2___]);\n  idRef.current += 1;\n};", "lang": "jsx", "blanks": [["current"], ["...todo"]], "explain": "Ref 객체의 값은 current 프로퍼티에 있으므로 idRef.current로 새 id를 얻고, 추가 후 1 증가시켜 중복을 막는다. 새 배열은 [newItem, ...todo]처럼 새 아이템 뒤에 기존 배열을 스프레드로 펼쳐 만든다."}, {"id": "w066", "ch": "투두앱", "type": "blank", "q": "TodoEditor에서 빈 입력을 막고, 추가 후 입력창을 비우며, Enter 키로도 추가되도록 빈칸을 채우시오.", "code": "function TodoEditor({ onCreate }) {\n  const [content, setContent] = useState(\"\");\n  const inputRef = useRef();\n\n  const onSubmit = () => {\n    if (!content) {\n      inputRef.current.focus();\n      return;\n    }\n    ___1___(content);\n    setContent(___2___);\n  };\n\n  const onKeyDown = (e) => {\n    if (e.key === \"___3___\") {\n      onSubmit();\n    }\n  };\n\n  return (\n    <div>\n      <input ref={inputRef} value={content} onKeyDown={onKeyDown}\n        onChange={(e) => setContent(e.target.value)} />\n      <button onClick={onSubmit}>추가<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["onCreate"], ["\"\"", "''"], ["Enter"]], "explain": "자식(TodoEditor)은 부모(App)가 Props로 내려준 onCreate를 호출해 새 할 일을 전달한다. 추가 후 content를 빈 문자열로 바꾸면 입력창이 비워진다. 빈 문자열은 falsy라서 !content로 빈 입력을 막을 수 있고, Enter 키는 e.key === \"Enter\"로 확인한다."}]};</script>

(function () {
