<div id="cbt" class="page" hidden></div>
<script>window.RL = window.RL || {}; window.RL.DATA = {"written": [{"id": "w001", "ch": "1장", "type": "single", "q": "다음 코드의 실행 결과로 옳은 것은? (줄바꿈은 공백으로 표시)", "code": "const repeat = (count, callback) => {\n  for (let idx = 1; idx <= count; idx++) {\n    callback(idx);\n  }\n};\n\nrepeat(3, (idx) => console.log(idx * 2));", "lang": "js", "options": ["1 2 3", "2 4 6", "6", "undefined", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "repeat에 두 번째 인수로 전달한 화살표 함수가 콜백 함수다. repeat 안의 반복문이 idx 1, 2, 3으로 콜백을 호출하므로 2, 4, 6이 출력된다. 리액트의 onClick={() => ...}, map((it) => ...)도 모두 이렇게 함수를 인수로 넘기는 콜백 패턴이다."}, {"id": "w002", "ch": "2장", "type": "single", "q": "List 컴포넌트에 빈 배열을 전달했을 때(<List items={[]} />) 화면에 표시되는 것은?", "code": "function List({ items }) {\n  return (\n    <div>\n      {items.length && <p>{items.length}개의 항목<\/p>}\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["아무것도 표시되지 않는다", "0", "false", "0개의 항목"], "answer": [1], "pick": 1, "explain": "&& 연산자는 왼쪽 값이 falsy이면 그 값을 그대로 반환한다(단락 평가). items.length가 0이므로 0이 반환되는데, 숫자 0은 JSX에서 화면에 출력된다. 아무것도 안 보이게 하려면 items.length > 0 && ... 처럼 불리언 조건을 써야 한다."}, {"id": "w003", "ch": "2장", "type": "single", "q": "다음 코드의 실행 결과로 옳은 것은?", "code": "const person = { name: \"이정환\", age: 27 };\nconst { name, age, hobby = \"독서\" } = person;\n\nconsole.log(name, age, hobby);", "lang": "js", "options": ["이정환 27 undefined", "이정환 27 독서", "undefined undefined 독서", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "객체 구조 분해 할당은 프로퍼티 이름이 같은 변수에 값을 담는다. person에 hobby가 없지만 기본값 '독서'를 지정했으므로 hobby는 '독서'가 된다. Props를 ({ name, favorList = [] })처럼 받는 것도 같은 문법이다."}, {"id": "w004", "ch": "2장", "type": "multi", "q": "다음 배열 메서드 중 원본 배열을 변경하지 않고 새 배열을 반환하는 것을 모두 고르시오. (State 배열을 업데이트할 때 주로 쓰인다)", "options": ["map", "filter", "push", "sort", "concat"], "answer": [0, 1, 4], "pick": 3, "explain": "map, filter, concat은 원본은 그대로 두고 새 배열을 만들어 반환한다. push는 원본 끝에 요소를 추가하고 새 길이를 반환하며, sort는 원본 배열 자체를 정렬한다. 리액트 State는 원본을 직접 바꾸면 안 되므로 새 배열을 만드는 메서드를 쓴다."}, {"id": "w005", "ch": "2장", "type": "multi", "q": "다음 중 falsy한 값을 모두 고르시오.", "options": ["0", "\"0\" (문자열 0)", "\"\" (빈 문자열)", "[] (빈 배열)", "null", "NaN"], "answer": [0, 2, 4, 5], "pick": 4, "explain": "falsy 값은 false, undefined, null, 0, -0, NaN, \"\"(빈 문자열), 0n 이다. 문자열 \"0\"은 비어 있지 않은 문자열이고, 빈 배열 []도 객체이므로 truthy이다. 할 일 앱의 if (!content)처럼 빈 입력을 막을 때 활용된다."}, {"id": "w006", "ch": "3장", "type": "single", "q": "package.json의 dependencies에 \"lodash\": \"^4.17.21\" 이라고 적혀 있다. 허용되는 버전 범위로 옳은 것은?", "options": ["정확히 4.17.21 버전만", "4.17.21 이상 4.18.0 미만", "4.17.21 이상 5.0.0 미만", "4.17.21 이하의 모든 버전", "항상 최신(latest) 버전"], "answer": [2], "pick": 1, "explain": "캐럿(^)은 메이저 버전(맨 앞 숫자)은 고정하고 마이너·패치 버전은 최신까지 허용한다는 뜻이다. 그래서 ^4.17.21은 4.17.21 이상 5.0.0 미만이다. 참고로 틸드(~4.17.21)는 4.17.21 이상 4.18.0 미만이다."}, {"id": "w007", "ch": "3장", "type": "single", "q": "circle.js가 다음과 같을 때, 다른 파일에서 불러오는 코드 중 오류가 발생하는 것은?", "code": "// circle.js\nexport const PI = 3.141592;\n\nexport default function getArea(radius) {\n  return PI * radius * radius;\n}", "lang": "js", "options": ["import getArea, { PI } from \"./circle.js\";", "import area from \"./circle.js\";", "import { PI } from \"./circle.js\";", "import * as circle from \"./circle.js\";", "import { area } from \"./circle.js\";"], "answer": [4], "pick": 1, "explain": "export default로 내보낸 기본값은 중괄호 없이 원하는 이름(area 등)으로 불러올 수 있다. 하지만 중괄호 { }로 불러오는 개별 내보내기는 내보낸 이름과 똑같아야 한다. circle.js에는 area라는 이름으로 내보낸 값이 없으므로 { area }는 오류가 난다."}, {"id": "w008", "ch": "3장", "type": "multi", "q": "Node.js 패키지 루트에서 npm i lodash 를 실행했을 때 일어나는 변화를 모두 고르시오.", "options": ["패키지 루트에 node_modules 폴더가 생성된다", "package.json에 dependencies 항목이 추가된다", "설치된 라이브러리의 정확한 버전을 기록하는 package-lock.json 파일이 생성된다", "src 폴더와 index.html이 자동으로 생성된다", "package.json의 \"type\"이 \"module\"로 자동 변경된다"], "answer": [0, 1, 2], "pick": 3, "explain": "라이브러리를 설치하면 실제 파일이 저장되는 node_modules, 버전 범위가 적힌 package.json의 dependencies, 정확한 버전이 적힌 package-lock.json 세 가지가 생긴다. \"type\": \"module\"은 ESM을 쓰려고 직접 추가하는 설정이다."}, {"id": "w009", "ch": "3장", "type": "blank", "q": "Node.js 패키지에서 ESM(import/export) 문법을 사용하고, npm start(run 생략) 명령으로 index.js를 실행하려고 한다. package.json의 빈칸을 채우시오.", "code": "{\n  \"name\": \"chapter3\",\n  \"version\": \"1.0.0\",\n  \"type\": \"___1___\",\n  \"scripts\": {\n    \"___2___\": \"node index.js\"\n  }\n}", "lang": "json", "blanks": [["module"], ["start"]], "explain": "Node.js는 기본적으로 CommonJS를 사용하므로 ESM을 쓰려면 \"type\": \"module\"을 추가해야 한다. scripts는 명령어 매크로이며, start 스크립트는 run을 생략해 npm start로도 실행할 수 있다."}, {"id": "w010", "ch": "4장", "type": "single", "q": "리액트(React)의 특징으로 옳지 않은 것은?", "options": ["페이지를 컴포넌트 단위로 나누어 개발하고, 레고 블록처럼 조립해 페이지를 구성한다", "공통으로 쓰는 UI를 컴포넌트로 만들어 두면, 컴포넌트만 수정해도 사용하는 모든 곳에 반영된다", "변경 사항을 버추얼 돔(Virtual DOM)에 먼저 반영한 뒤 실제 돔을 효율적으로 업데이트한다", "화면을 바꾸려면 개발자가 DOM API로 수정할 요소를 직접 찾아 하나하나 고쳐야 한다", "페이스북(Meta) 개발팀이 만들어 오픈소스로 공개한 UI 라이브러리이다"], "answer": [3], "pick": 1, "explain": "리액트는 '어떤 요소를 어떻게 고칠지' 개발자가 고민하지 않아도 되도록, State가 바뀌면 알아서 화면을 다시 그려 준다(쉽고 간단한 업데이트). DOM API로 요소를 직접 찾아 수정하는 것은 리액트 없이 순수 자바스크립트로 개발할 때의 방식이다."}, {"id": "w011", "ch": "4장", "type": "single", "q": "버추얼 돔(Virtual DOM)에 대한 설명으로 가장 옳은 것은?", "options": ["브라우저가 HTML을 해석해 직접 만드는 실제 DOM 트리를 말한다", "실제 DOM의 사본으로, 여러 변경 사항을 모았다가 실제 DOM에 한 번에 반영해 불필요한 렌더링을 줄인다", "버추얼 돔을 사용하면 브라우저의 레이아웃·페인팅 단계가 아예 생략된다", "State가 바뀔 때마다 실제 DOM을 즉시 여러 번 수정하기 위한 도구이다"], "answer": [1], "pick": 1, "explain": "버추얼 돔은 실제 돔의 '가상 사본'이다. 리액트는 변경 사항을 먼저 버추얼 돔에 반영해 모아 두었다가 실제 돔은 한 번에 업데이트한다. 그래서 비용이 큰 레이아웃·페인팅이 여러 번 반복되는 것을 줄여 준다(완전히 없애는 것은 아님)."}, {"id": "w012", "ch": "4장", "type": "single", "q": "Vite로 만든 리액트 프로젝트에서 개발 서버를 실행하는 명령어와 기본 접속 주소로 옳은 것은?", "options": ["npm start — http://localhost:3000", "npm run dev — http://localhost:5173", "npm run build — http://localhost:5173", "npm run dev — http://localhost:3000", "node main.jsx — http://localhost:8080"], "answer": [1], "pick": 1, "explain": "Vite 프로젝트는 package.json의 scripts에 \"dev\"가 있어 npm run dev로 실행하고, 기본 주소는 http://localhost:5173 이다. npm start와 3000번 포트는 CRA(Create React App)의 방식이고, npm run build는 배포용 빌드 명령이다."}, {"id": "w013", "ch": "4장", "type": "single", "q": "다음 main.jsx 코드에 대한 설명으로 옳은 것은?", "code": "import { createRoot } from \"react-dom/client\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"root\")).render(<App />);", "lang": "jsx", "options": ["index.html에 있는 id가 root인 요소를 리액트 앱의 루트로 만들고, 그 아래에 App 컴포넌트를 렌더링한다", "App 컴포넌트가 index.html 파일을 새로 생성한다", "root라는 이름의 컴포넌트를 App 컴포넌트 안에 렌더링한다", "render 메서드는 App 컴포넌트를 서버로 전송한다"], "answer": [0], "pick": 1, "explain": "createRoot는 인수로 받은 DOM 요소(index.html의 <div id=\"root\">)를 리액트 앱의 루트로 만든다. 이어서 render(<App />)가 그 루트 아래에 App 컴포넌트를 추가해 화면에 나타나게 한다."}, {"id": "w014", "ch": "4장", "type": "multi", "q": "Vite로 생성한 리액트 프로젝트에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["index.html이 프로젝트 루트 폴더에 있고 앱의 시작점(엔트리) 역할을 한다", "CRA의 src/index.js 역할을 src/main.jsx가 담당한다", "node_modules 없이 공유받은 프로젝트는 npm install(npm i)로 라이브러리를 다시 설치해야 한다", "기본 개발 서버 포트는 3000번이다", "npm run dev를 실행하면 bundle.js를 먼저 만들어 public 폴더에 저장한다"], "answer": [0, 1, 2], "pick": 3, "explain": "Vite는 루트의 index.html이 엔트리이며, 개발 중에는 번들 파일 없이 ESM 모듈을 직접 불러온다(번들링은 npm run build 때 수행). main.jsx가 CRA의 index.js를 대체하고, 기본 포트는 5173이다."}, {"id": "w015", "ch": "4장", "type": "blank", "q": "Vite 리액트 앱의 main.jsx이다. index.html의 <div id=\"root\"><\/div>를 루트로 하여 App 컴포넌트를 렌더링하도록 빈칸을 채우시오.", "code": "import { createRoot } from \"react-dom/client\";\nimport App from \"./App.jsx\";\n\ncreateRoot(document.getElementById(\"___1___\")).___2___(<App />);", "lang": "jsx", "blanks": [["root"], ["render"]], "explain": "createRoot는 id가 root인 DOM 요소를 리액트 앱의 루트로 만들고, render 메서드는 인수로 받은 컴포넌트(App)를 그 루트 아래에 렌더링한다."}, {"id": "w016", "ch": "5장", "type": "single", "q": "다음 컴포넌트가 화면에 표시하는 내용으로 옳은 것은? (세 <p> 태그의 내용을 순서대로 / 로 구분)", "code": "function Body() {\n  const num = 10;\n  const isOk = true;\n  const str = \"리액트\";\n  return (\n    <div>\n      <p>{num + 5}<\/p>\n      <p>{isOk}<\/p>\n      <p>{str + num}<\/p>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["15 / true / 리액트10", "15 / (빈 칸) / 리액트10", "105 / true / 리액트10", "15 / (빈 칸) / 리액트 + 10", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "{num + 5}는 산술 표현식이라 15가 출력된다. 불리언 값(true/false)은 JSX에서 화면에 렌더링되지 않으므로 두 번째 <p>는 비어 있다. 문자열 + 숫자는 문자열 연결이 되어 '리액트10'이 된다."}, {"id": "w017", "ch": "5장", "type": "single", "q": "주석 위치에 다음 표현식을 넣었을 때 'Objects are not valid as a React child' 오류가 발생하는 것은?", "code": "function Body() {\n  const user = { name: \"이정환\", age: 27 };\n  const list = [1, 2, 3];\n  return (\n    <div>\n      {/* 여기에 표현식이 들어간다 */}\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["{user.name}", "{list}", "{null}", "{user}", "{String(true)}"], "answer": [3], "pick": 1, "explain": "JSX의 중괄호 안에 일반 객체를 넣으면 '객체는 리액트의 자식으로 유효하지 않다'는 오류가 난다. user.name처럼 프로퍼티로 접근해 원시값(문자열·숫자)으로 바꿔야 한다. 배열 [1, 2, 3]은 풀어서 123으로 출력되고, null은 무시된다."}, {"id": "w018", "ch": "5장", "type": "single", "q": "다음 코드의 화면 출력 결과로 옳은 것은?", "code": "function Body({ name, location, favorList = [] }) {\n  return (\n    <div>\n      {name}은 {location}에 살고 {favorList.length}개의 음식을 좋아합니다\n    <\/div>\n  );\n}\n\nfunction App() {\n  return <Body name=\"이정환\" location=\"부천시\" />;\n}", "lang": "jsx", "options": ["이정환은 부천시에 살고 0개의 음식을 좋아합니다", "이정환은 부천시에 살고 개의 음식을 좋아합니다", "이정환은 부천시에 살고 undefined개의 음식을 좋아합니다", "TypeError: Cannot read properties of undefined (reading 'length') 오류가 발생한다"], "answer": [0], "pick": 1, "explain": "App이 favorList를 전달하지 않았지만, Body에서 구조 분해 할당할 때 favorList = [] 로 기본값을 정해 두었다. 그래서 favorList는 빈 배열이 되고 length는 0이다. 기본값이 없었다면 undefined.length를 읽으려 해서 TypeError가 났을 것이다."}, {"id": "w019", "ch": "5장", "type": "single", "q": "Body 컴포넌트가 자신의 태그 사이에 배치된 ChildComp를 렌더링하려면 ? 자리에 props의 어떤 프로퍼티를 써야 하는가?", "code": "function ChildComp() {\n  return <div>child component<\/div>;\n}\n\nfunction Body(props) {\n  return <div>{props.?}<\/div>;\n}\n\nfunction App() {\n  return (\n    <Body>\n      <ChildComp />\n    <\/Body>\n  );\n}", "lang": "jsx", "options": ["child", "children", "ChildComp", "component", "elements"], "answer": [1], "pick": 1, "explain": "컴포넌트 태그 사이에 다른 컴포넌트나 요소를 배치하면 리액트가 자동으로 props의 children 프로퍼티에 담아 전달한다. 그래서 {props.children}(또는 구조 분해 할당한 {children})으로 렌더링한다."}, {"id": "w020", "ch": "5장", "type": "single", "q": "버튼을 클릭했을 때만 handleOnClick 함수가 실행되도록 올바르게 작성한 것은?", "options": ["<button onclick=\"handleOnClick()\">클릭<\/button>", "<button onClick={handleOnClick()}>클릭<\/button>", "<button onClick={handleOnClick}>클릭<\/button>", "<button onClick=\"handleOnClick\">클릭<\/button>"], "answer": [2], "pick": 1, "explain": "리액트에서는 이벤트 이름을 카멜 케이스(onClick)로 쓰고, 중괄호 안에 함수 자체(콜백)를 전달한다. handleOnClick()처럼 괄호를 붙이면 렌더링할 때 바로 호출되어 버리고, 문자열로 넣으면 동작하지 않는다."}, {"id": "w021", "ch": "5장", "type": "single", "q": "다음 컴포넌트에서 B 버튼을 클릭했을 때 콘솔에 출력되는 값은?", "code": "function Body() {\n  const handleOnClick = (e) => {\n    console.log(e.target.name);\n  };\n\n  return (\n    <div>\n      <button name=\"A버튼\" onClick={handleOnClick}>A<\/button>\n      <button name=\"B버튼\" onClick={handleOnClick}>B<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["A", "B", "A버튼", "B버튼", "undefined"], "answer": [3], "pick": 1, "explain": "이벤트 핸들러는 이벤트 객체 e를 매개변수로 받는다. e.target에는 이벤트가 발생한 요소(클릭한 B 버튼)가 저장되므로, e.target.name은 그 버튼의 name 속성값인 'B버튼'이다."}, {"id": "w022", "ch": "5장", "type": "single", "q": "다음 코드에 대한 설명으로 옳지 않은 것은?", "code": "const [light, setLight] = useState(\"off\");", "lang": "jsx", "options": ["useState는 2개의 요소를 담은 배열을 반환하며, 이를 배열 구조 분해 할당으로 받았다", "light는 현재 State 값을 저장하는 State 변수이다", "setLight는 State 값을 변경하는 set 함수이다", "\"off\"는 State의 초기값이다", "light = \"on\"; 처럼 State 변수에 직접 값을 대입해도 화면이 다시 렌더링된다"], "answer": [4], "pick": 1, "explain": "State 값은 반드시 set 함수(setLight)로 바꿔야 리액트가 변화를 알아채고 컴포넌트를 리렌더링한다. State 변수에 직접 대입하면 화면이 바뀌지 않으며, const로 선언했기 때문에 오히려 오류가 난다."}, {"id": "w023", "ch": "5장", "type": "single", "q": "StrictMode를 제거한 상태에서 페이지를 처음 열고 + 버튼을 정확히 3번 클릭했다. 콘솔에 Update!는 총 몇 번 출력되는가?", "code": "function Body() {\n  const [count, setCount] = useState(0);\n  console.log(\"Update!\");\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={() => setCount(count + 1)}>+<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "options": ["1번", "3번", "4번", "6번"], "answer": [2], "pick": 1, "explain": "처음 화면에 렌더링(마운트)될 때 컴포넌트 함수가 한 번 호출되어 1번 출력된다. 이후 버튼을 누를 때마다 State가 바뀌어 컴포넌트 함수가 다시 호출(리렌더링)되므로 3번이 더 출력되어 총 4번이다."}, {"id": "w024", "ch": "5장", "type": "single", "q": "count가 0일 때 onClick 함수를 한 번 실행했다. 리렌더링 후 화면에 표시되는 count 값은?", "code": "const [count, setCount] = useState(0);\n\nconst onClick = () => {\n  setCount(count + 1);\n  setCount(count + 1);\n  setCount(count + 1);\n};", "lang": "jsx", "options": ["0", "1", "3", "오류가 발생한다"], "answer": [1], "pick": 1, "explain": "State는 렌더링 시점의 '스냅샷'이다. onClick 안에서 count는 계속 0이므로 세 줄 모두 setCount(0 + 1)을 요청하는 것과 같아 결과는 1이다. 3을 만들고 싶다면 setCount((prev) => prev + 1)처럼 함수형 업데이트를 써야 한다."}, {"id": "w025", "ch": "5장", "type": "single", "q": "useRef에 대한 설명으로 옳지 않은 것은?", "options": ["useRef(초기값)은 current 프로퍼티를 가진 Ref 객체를 반환한다", "<input ref={inputRef} />처럼 연결하면 inputRef.current로 해당 DOM 요소에 접근할 수 있다", "ref.current 값을 바꾸면 State처럼 컴포넌트가 자동으로 리렌더링된다", "리렌더링되어도 값이 유지되므로, 할 일 앱의 idRef처럼 컴포넌트 안의 변수로도 활용할 수 있다"], "answer": [2], "pick": 1, "explain": "Ref 객체의 current 값은 바꿔도 리렌더링을 일으키지 않는다. 그래서 화면에 보여 줄 값은 State로, 화면과 상관없이 기억만 하면 되는 값(id 카운터, DOM 요소 참조 등)은 Ref로 관리한다."}, {"id": "w026", "ch": "5장", "type": "multi", "q": "JSX 문법에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["<input>, <br>처럼 닫는 태그가 없는 요소도 <input />, <br />처럼 반드시 닫아야 한다", "컴포넌트가 반환하는 JSX는 하나의 최상위 태그로 감싸야 하며, 빈 태그 <><\/>(Fragment)를 사용할 수 있다", "HTML의 class 속성 대신 className을 사용한다", "if문은 JSX의 중괄호 { } 안에 직접 작성할 수 있다", "{true}처럼 불리언 값을 넣으면 화면에 \"true\"가 출력된다"], "answer": [0, 1, 2], "pick": 3, "explain": "JSX는 닫힘 규칙, 최상위 태그 규칙을 지켜야 하고 class는 자바스크립트 예약어라 className을 쓴다. if문은 값이 아닌 '문(statement)'이라 중괄호 안에 쓸 수 없으므로 삼항 연산자나 && 를 사용한다. 불리언 값은 화면에 렌더링되지 않는다."}, {"id": "w027", "ch": "5장", "type": "multi", "q": "함수 컴포넌트가 리렌더링되는 경우를 모두 고르시오.", "options": ["자신이 가진 State 값이 set 함수로 변경되었을 때", "부모로부터 받은 Props 값이 변경되었을 때", "부모 컴포넌트가 리렌더링되었을 때", "useRef로 만든 ref.current 값을 변경했을 때", "컴포넌트 안에서 let으로 선언한 일반 변수 값을 바꿨을 때"], "answer": [0, 1, 2], "pick": 3, "explain": "컴포넌트는 State 변경, Props 변경, 부모 리렌더링 때 다시 렌더링된다(부모가 리렌더되면 Props가 안 바뀐 자식도 함께 리렌더된다). ref.current나 일반 변수를 바꾸는 것은 리액트가 감지하지 않아 리렌더링을 일으키지 않는다."}, {"id": "w028", "ch": "5장", "type": "review", "q": "버튼을 누르기도 전에 'Too many re-renders' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  const onIncrease = () => {\n    setCount(count + 1);\n  };\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={onIncrease()}>+<\/button>\n    <\/div>\n  );\n}\n\nexport default Counter;", "lang": "jsx", "answer": [13], "fix": "<button onClick={onIncrease}>+<\/button>", "explain": "onClick={onIncrease()}는 렌더링할 때 함수를 즉시 호출한다. 그 안에서 setCount가 실행되어 다시 렌더링되고, 또 호출되고… 무한 반복이 된다. 이벤트 핸들러에는 함수 자체(onIncrease)를 전달해야 한다."}, {"id": "w029", "ch": "5장", "type": "review", "q": "다음 컴포넌트는 JSX 규칙에 맞지 않아 콘솔에 경고가 발생한다. 잘못된 줄을 고르시오.", "code": "import \"./Body.css\";\n\nfunction Body() {\n  const number = 1;\n  return (\n    <div class=\"body\">\n      <h1>body<\/h1>\n      <h2>{number}<\/h2>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [6], "fix": "<div className=\"body\">", "explain": "class는 자바스크립트의 예약어(클래스 문법)이기 때문에 JSX에서는 CSS 클래스를 지정할 때 className을 사용한다. 비슷하게 label의 for도 htmlFor로 쓴다."}, {"id": "w030", "ch": "5장", "type": "review", "q": "Welcome 컴포넌트의 내용이 화면에 나오지 않고, 콘솔에 'If you meant to render a React component, start its name with an uppercase letter' 경고가 뜬다. 잘못된 줄을 고르시오.", "code": "function Welcome() {\n  return <h1>환영합니다!<\/h1>;\n}\n\nfunction App() {\n  return (\n    <div>\n      <welcome />\n      <p>본문 내용<\/p>\n    <\/div>\n  );\n}\n\nexport default App;", "lang": "jsx", "answer": [8], "fix": "<Welcome />", "explain": "리액트는 소문자로 시작하는 태그를 HTML 태그로, 대문자로 시작하는 태그를 컴포넌트로 인식한다. 그래서 컴포넌트 이름은 항상 대문자로 시작하고, 사용할 때도 <Welcome />처럼 대문자로 써야 한다."}, {"id": "w031", "ch": "5장", "type": "review", "q": "입력창에 아무리 타이핑해도 글자가 입력되지 않는다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n\n  const handleOnChange = (e) => {\n    setText(e.target.value);\n  };\n\n  return (\n    <div>\n      <input value={text} />\n      <div>{text}<\/div>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [12], "fix": "<input value={text} onChange={handleOnChange} />", "explain": "value를 State로 고정했는데 onChange 핸들러가 없으면, 입력할 때 State가 바뀌지 않아 input 값이 계속 빈 문자열로 유지된다. onChange={handleOnChange}를 연결해 입력값(e.target.value)을 State에 저장해야 한다."}, {"id": "w032", "ch": "5장", "type": "review", "q": "다섯 글자 미만으로 입력하고 버튼을 누르면 입력창에 포커스가 가야 하는데, 'focus is not a function' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  const textRef = useRef();\n\n  const handleOnClick = () => {\n    if (text.length < 5) {\n      textRef.focus();\n    } else {\n      alert(text);\n      setText(\"\");\n    }\n  };\n\n  return (\n    <div>\n      <input ref={textRef} value={text} onChange={(e) => setText(e.target.value)} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [9], "fix": "textRef.current.focus();", "explain": "useRef가 반환하는 Ref 객체는 실제 DOM 요소를 current 프로퍼티에 저장한다. 그래서 input 요소의 focus 메서드는 textRef.current.focus()로 호출해야 한다."}, {"id": "w033", "ch": "5장", "type": "review", "q": "이름을 입력한 뒤 성별을 선택하면 입력했던 이름이 사라진다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Body() {\n  const [state, setState] = useState({ name: \"\", gender: \"\", birth: \"\" });\n\n  const handleOnChange = (e) => {\n    setState({ [e.target.name]: e.target.value });\n  };\n\n  return (\n    <div>\n      <input name=\"name\" value={state.name} onChange={handleOnChange} />\n      <select name=\"gender\" value={state.gender} onChange={handleOnChange}>\n        <option value=\"\">선택<\/option>\n        <option value=\"남성\">남성<\/option>\n        <option value=\"여성\">여성<\/option>\n      <\/select>\n      <input name=\"birth\" type=\"date\" value={state.birth} onChange={handleOnChange} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": "setState({ ...state, [e.target.name]: e.target.value });", "explain": "set 함수에 전달한 객체가 State를 통째로 대체한다. 바뀐 프로퍼티 하나만 넣으면 나머지 프로퍼티가 사라진다. ...state로 기존 값을 펼쳐 복사한 뒤, 바뀐 값만 덮어써야 한다."}, {"id": "w034", "ch": "5장", "type": "review", "q": "숫자가 짝수인지 홀수인지 표시하려 했는데 문법 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "function Body() {\n  const num = 19;\n\n  return (\n    <div>\n      <h2>{num}은(는)<\/h2>\n      <h2>{if (num % 2 === 0) \"짝수\" else \"홀수\"}<\/h2>\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "answer": [7], "fix": "<h2>{num % 2 === 0 ? \"짝수\" : \"홀수\"}<\/h2>", "explain": "JSX의 중괄호 안에는 값으로 평가되는 '표현식'만 쓸 수 있다. if문은 표현식이 아니라 문(statement)이므로 사용할 수 없다. 삼항 연산자를 쓰거나, return 전에 if문으로 처리해야 한다."}, {"id": "w035", "ch": "5장", "type": "review", "q": "App에서 Body 태그 사이에 ChildComp를 넣었는데 'Objects are not valid as a React child' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "function Body(children) {\n  return <div className=\"body\">{children}<\/div>;\n}\n\nfunction ChildComp() {\n  return <div>child component<\/div>;\n}\n\nfunction App() {\n  return (\n    <Body>\n      <ChildComp />\n    <\/Body>\n  );\n}", "lang": "jsx", "answer": [1], "fix": "function Body({ children }) {", "explain": "컴포넌트의 매개변수에는 Props '객체' 전체가 들어온다. Body(children)라고 쓰면 children이라는 이름의 변수에 props 객체가 담기고, 객체를 JSX에 렌더링하려다 오류가 난다. 구조 분해 할당 { children }으로 꺼내야 한다."}, {"id": "w036", "ch": "5장", "type": "blank", "q": "버튼을 클릭할 때마다 count가 1씩 증가하는 카운터를 완성하시오.", "code": "import { ___1___ } from \"react\";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={() => ___2___}>+1<\/button>\n    <\/div>\n  );\n}\n\nexport default Counter;", "lang": "jsx", "blanks": [["useState"], ["setCount(count + 1)", "setCount(count+1)", "setCount(1 + count)", "setCount(1+count)", "setCount((prev) => prev + 1)", "setCount(prev => prev + 1)", "setCount((prev)=>prev+1)", "setCount(prev=>prev+1)"]], "explain": "useState는 react 패키지에서 불러오는 훅이다. 값을 바꿀 때는 set 함수에 '새 값'을 전달한다. setCount(count + 1)처럼 현재 값에 1을 더한 값을 넘기면 State가 바뀌고 컴포넌트가 리렌더링된다."}, {"id": "w037", "ch": "5장", "type": "blank", "q": "Header 컴포넌트를 별도 파일로 분리했다. App.jsx에서 중괄호 없이 불러올 수 있도록 빈칸을 채우시오. (App.jsx는 src 폴더에, Header.jsx는 src/components 폴더에 있다)", "code": "// src/components/Header.jsx\nfunction Header() {\n  return (\n    <header>\n      <h1>header<\/h1>\n    <\/header>\n  );\n}\n\n___1___ Header;\n\n// src/App.jsx\nimport Header from \"___2___\";", "lang": "jsx", "blanks": [["export default"], ["./components/Header", "./components/Header.jsx"]], "explain": "모듈의 기본값으로 내보내려면 export default를 쓴다. 기본값으로 내보낸 것은 중괄호 없이 원하는 이름으로 불러올 수 있다. 경로의 '.'은 현재 파일(App.jsx)이 있는 폴더(src)를 뜻한다."}, {"id": "w038", "ch": "5장", "type": "blank", "q": "<작성 완료> 버튼을 누르면 입력값을 알림창에 띄우고, 입력창을 비운 뒤 다시 포커스하도록 빈칸을 채우시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  const textRef = ___1___;\n\n  const handleOnClick = () => {\n    alert(text);\n    setText(\"\");\n    textRef.___2___.focus();\n  };\n\n  return (\n    <div>\n      <input ___3___ value={text} onChange={(e) => setText(e.target.value)} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["useRef()", "useRef(null)"], ["current"], ["ref={textRef}"]], "explain": "useRef()로 Ref 객체를 만들고, input에 ref={textRef}로 연결하면 textRef.current에 해당 input DOM 요소가 저장된다. 그 요소의 focus() 메서드로 입력창에 포커스를 줄 수 있다."}, {"id": "w039", "ch": "5장", "type": "blank", "q": "App이 favorList를 전달하지 않아도 오류가 나지 않도록, favorList의 기본값을 빈 배열로 지정하시오.", "code": "function Body({ name, location, favorList ___1___ }) {\n  return (\n    <div>\n      {name}은 {location}에 거주합니다.\n      <br />\n      {favorList.length}개의 음식을 좋아합니다.\n    <\/div>\n  );\n}\n\nexport default Body;", "lang": "jsx", "blanks": [["= []", "=[]"]], "explain": "구조 분해 할당에서 '변수 = 기본값' 형태로 기본값을 지정할 수 있다. 전달되지 않은 Props는 undefined인데, 기본값을 []로 주면 favorList.length가 0이 되어 오류를 막을 수 있다."}, {"id": "w040", "ch": "5장", "type": "blank", "q": "여러 입력 폼(name, gender, birth, bio)을 하나의 객체 State로 관리한다. 입력한 폼의 값만 바뀌고 나머지 값은 유지되도록 빈칸을 채우시오.", "code": "const [state, setState] = useState({\n  name: \"\",\n  gender: \"\",\n  birth: \"\",\n  bio: \"\",\n});\n\nconst handleOnChange = (e) => {\n  setState({\n    ___1___,\n    [e.target.___2___]: e.target.value,\n  });\n};\n\n// <input name=\"name\" value={state.name} onChange={handleOnChange} />", "lang": "jsx", "blanks": [["...state"], ["name"]], "explain": "...state로 기존 객체의 프로퍼티를 모두 복사한 뒤, 바뀐 프로퍼티만 덮어쓴다. [e.target.name]은 계산된 프로퍼티 이름으로, 이벤트가 발생한 폼의 name 속성값(name, gender 등)을 키로 사용한다."}, {"id": "w041", "ch": "6장", "type": "single", "q": "App에서 {count % 2 === 0 && <Even />} 으로 Even 컴포넌트를 조건부 렌더링한다. count가 2에서 3으로 바뀔 때 Even 컴포넌트가 겪는 라이프 사이클 단계는?", "options": ["마운트(Mount)", "업데이트(Update)", "언마운트(Unmount)", "아무 변화도 없다"], "answer": [2], "pick": 1, "explain": "count가 3이 되면 count % 2 === 0이 false가 되어 Even이 더 이상 렌더링되지 않는다. 이렇게 컴포넌트가 화면에서 사라지는 단계를 언마운트라고 하며, useEffect의 클린업 함수로 이 시점을 제어할 수 있다."}, {"id": "w042", "ch": "6장", "type": "single", "q": "페이지를 처음 열고 +10 버튼을 2번 클릭했을 때 콘솔 출력으로 옳은 것은? (StrictMode 제거 상태)", "code": "function App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    console.log(`count 업데이트: ${count}`);\n  }, [count]);\n\n  return (\n    <button onClick={() => setCount(count + 10)}>+10<\/button>\n  );\n}", "lang": "jsx", "options": ["count 업데이트: 10 → count 업데이트: 20", "count 업데이트: 0 → count 업데이트: 10 → count 업데이트: 20", "count 업데이트: 0", "count 업데이트: 0 → count 업데이트: 0 → count 업데이트: 0"], "answer": [1], "pick": 1, "explain": "useEffect는 마운트될 때 한 번 실행되고(이때 count는 0), 이후 의존성 배열의 count가 바뀔 때마다 다시 실행된다. 그래서 0, 10, 20이 차례로 출력된다."}, {"id": "w043", "ch": "6장", "type": "single", "q": "다음 코드를 넣은 뒤 버튼을 빠르게 여러 번 클릭해 리렌더링이 반복되면, '깜빡'이 1초보다 훨씬 빠르게 출력된다. 원인으로 옳은 것은?", "code": "useEffect(() => {\n  setInterval(() => {\n    console.log(\"깜빡\");\n  }, 1000);\n});", "lang": "jsx", "options": ["setInterval의 시간 단위가 밀리초가 아니라 초이기 때문이다", "의존성 배열이 없어 렌더링마다 새 인터벌이 생기는데, 이전 인터벌을 clearInterval로 정리하지 않았기 때문이다", "useEffect는 마운트 시점에 한 번만 실행되기 때문이다", "console.log가 비동기로 동작하기 때문이다"], "answer": [1], "pick": 1, "explain": "의존성 배열을 생략하면 렌더링할 때마다 콜백이 실행되어 setInterval이 계속 새로 만들어진다. 이전 인터벌을 지우지 않으니 인터벌이 여러 개 겹쳐 출력이 빨라진다. return () => clearInterval(id) 형태의 클린업 함수로 해결한다."}, {"id": "w044", "ch": "6장", "type": "multi", "q": "useEffect에 대한 설명으로 옳은 것을 모두 고르시오.", "options": ["useEffect(콜백)처럼 의존성 배열을 생략하면 마운트와 모든 리렌더링 때마다 콜백이 실행된다", "useEffect(콜백, [])처럼 빈 배열을 전달하면 마운트 시점에만 콜백이 실행된다", "콜백 함수가 반환하는 함수(클린업 함수)는 컴포넌트가 언마운트될 때에도 실행된다", "useEffect(콜백, [count])는 count가 바뀔 때만 실행되며, 마운트 시점에는 실행되지 않는다", "useEffect는 클래스 컴포넌트에서만 사용할 수 있다"], "answer": [0, 1, 2], "pick": 3, "explain": "의존성 배열이 있어도 마운트 시점에는 한 번 실행된다(그래서 'count 업데이트: 0'이 처음에 출력됨). 클린업 함수는 Effect가 다시 실행되기 전과 언마운트될 때 실행된다. useEffect 같은 훅은 함수 컴포넌트에서 사용한다."}, {"id": "w045", "ch": "6장", "type": "review", "q": "리렌더링할 때마다 이전 인터벌을 정리하려고 클린업을 작성했지만, '깜빡'이 한 번도 출력되지 않는다. 잘못된 줄을 고르시오.", "code": "import { useState, useEffect } from \"react\";\n\nfunction App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    const intervalID = setInterval(() => {\n      console.log(\"깜빡\");\n    }, 1000);\n    return clearInterval(intervalID);\n  });\n\n  return <button onClick={() => setCount(count + 1)}>{count}<\/button>;\n}", "lang": "jsx", "answer": [10], "fix": "return () => clearInterval(intervalID);", "explain": "클린업은 '함수'를 반환해야 한다. return clearInterval(intervalID)는 반환하는 순간 clearInterval을 바로 실행해서, 인터벌을 만들자마자 지워 버린다. return () => clearInterval(intervalID)처럼 함수로 감싸야 다음 Effect 실행 전이나 언마운트 때 실행된다."}, {"id": "w046", "ch": "6장", "type": "review", "q": "컴포넌트가 처음 마운트될 때 visit을 한 번만 1 증가시키려 했는데, 값이 끝없이 증가한다. 잘못된 줄을 고르시오.", "code": "import { useState, useEffect } from \"react\";\n\nfunction App() {\n  const [visit, setVisit] = useState(0);\n\n  useEffect(() => {\n    setVisit(visit + 1);\n  });\n\n  return <div>방문 횟수: {visit}<\/div>;\n}", "lang": "jsx", "answer": [8], "fix": "}, []);", "explain": "의존성 배열을 생략하면 렌더링할 때마다 콜백이 실행된다. 콜백 안에서 State를 바꾸니 리렌더링 → Effect 실행 → State 변경 → 리렌더링이 무한 반복된다. 마운트 때만 실행하려면 빈 배열 []을 두 번째 인수로 전달한다."}, {"id": "w047", "ch": "6장", "type": "blank", "q": "컴포넌트가 마운트될 때 한 번만 콘솔에 메시지를 출력하도록 빈칸을 채우시오.", "code": "import { useState, ___1___ } from \"react\";\n\nfunction App() {\n  const [count, setCount] = useState(0);\n\n  useEffect(() => {\n    console.log(\"컴포넌트 마운트\");\n  }, ___2___);\n\n  return <button onClick={() => setCount(count + 1)}>{count}<\/button>;\n}", "lang": "jsx", "blanks": [["useEffect"], ["[]"]], "explain": "useEffect도 react에서 불러오는 훅이다. 의존성 배열로 빈 배열 []을 전달하면 검사할 값이 없으므로 마운트 시점에만 콜백이 실행된다."}, {"id": "w048", "ch": "6장", "type": "blank", "q": "렌더링될 때마다 이전 인터벌을 정리하도록 클린업 함수를 작성하시오.", "code": "useEffect(() => {\n  const intervalID = setInterval(() => {\n    console.log(\"깜빡\");\n  }, 1000);\n\n  return ___1___;\n});", "lang": "jsx", "blanks": [["() => clearInterval(intervalID)", "()=>clearInterval(intervalID)", "() =>clearInterval(intervalID)", "()=> clearInterval(intervalID)", "() => { clearInterval(intervalID); }", "() => {clearInterval(intervalID);}", "() => { clearInterval(intervalID) }", "() => {clearInterval(intervalID)}"]], "explain": "useEffect의 콜백이 반환하는 '함수'가 클린업 함수다. 다음 Effect가 실행되기 전과 언마운트될 때 호출되어 clearInterval로 이전 인터벌을 지운다. 함수로 감싸지 않으면 즉시 실행되어 버린다."}, {"id": "w049", "ch": "6장", "type": "blank", "q": "Even 컴포넌트는 count가 짝수일 때만 렌더링되며, 화면에서 사라질 때 콘솔에 메시지를 출력한다. 빈칸을 채우시오.", "code": "// Even.jsx\nimport { useEffect } from \"react\";\n\nfunction Even() {\n  useEffect(() => {\n    ___1___ () => {\n      console.log(\"Even 컴포넌트 언마운트\");\n    };\n  }, []);\n\n  return <div>현재 카운트는 짝수입니다<\/div>;\n}\n\n// App.jsx 의 return 문 일부\n{count % 2 === 0 ___2___ <Even />}", "lang": "jsx", "blanks": [["return"], ["&&"]], "explain": "빈 의존성 배열을 쓴 useEffect에서 클린업 함수를 return하면 언마운트될 때 실행된다. 조건부 렌더링에는 AND 단락 평가(&&)를 사용해, 앞의 조건이 참일 때만 <Even />이 렌더링되게 한다."}, {"id": "w050", "ch": "카운터앱", "type": "single", "q": "카운터 앱은 App 아래에 형제 관계인 Viewer(카운트 표시)와 Controller(증감 버튼)로 구성된다. count State를 만들어야 하는 컴포넌트와 그 이유로 옳은 것은?", "options": ["Viewer — count를 화면에 표시하는 컴포넌트이므로", "Controller — 버튼을 눌러 count를 바꾸는 컴포넌트이므로", "App — Props는 부모에서 자식으로만 전달되므로, 두 컴포넌트의 공통 부모가 State를 관리해야 둘 다 사용할 수 있기 때문", "main.jsx — 앱 전체에서 사용하는 값이므로"], "answer": [2], "pick": 1, "explain": "Viewer와 Controller는 부모-자식 관계가 아니라서 서로 Props를 주고받을 수 없다. 그래서 공통 부모인 App에 State를 두고 count는 Viewer에, 값을 바꾸는 함수는 Controller에 Props로 내려준다. 이를 'State 끌어올리기(State Lifting)'라고 한다."}, {"id": "w051", "ch": "카운터앱", "type": "single", "q": "리액트의 데이터 흐름에 대한 설명으로 옳은 것은?", "options": ["Props는 자식에서 부모 방향으로도 자유롭게 전달할 수 있다", "형제 컴포넌트끼리는 Props로 직접 값을 주고받을 수 있다", "데이터(State)는 Props를 통해 부모→자식으로 흐르고, State를 바꾸는 이벤트는 부모가 내려준 함수를 자식이 호출하는 방식으로 위로 전달된다", "자식 컴포넌트는 전달받은 Props 값을 직접 수정해 부모의 State를 바꿀 수 있다"], "answer": [2], "pick": 1, "explain": "리액트는 '단방향 데이터 흐름'을 따른다. 데이터는 항상 부모에서 자식으로 Props로 내려가고, 자식은 부모가 내려준 함수(예: onClickButton, onCreate)를 호출해서 State 변경을 요청한다."}, {"id": "w052", "ch": "카운터앱", "type": "review", "q": "카운터 앱에서 현재 카운트 숫자가 화면에 나타나지 않는다. Viewer 컴포넌트는 수정하지 않는다고 할 때, 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction Viewer({ number }) {\n  return (\n    <div>\n      <div>현재 카운트 :<\/div>\n      <h1>{number}<\/h1>\n    <\/div>\n  );\n}\n\nfunction App() {\n  const [count, setCount] = useState(0);\n  return (\n    <div className=\"App\">\n      <h1>Simple Counter<\/h1>\n      <Viewer count={count} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [17], "fix": "<Viewer number={count} />", "explain": "Viewer는 Props에서 number라는 이름의 값을 꺼내 쓰는데, App은 count라는 이름으로 전달했다. 그래서 number는 undefined가 되어 아무것도 출력되지 않는다. 보내는 쪽과 받는 쪽의 Props 이름이 같아야 한다."}, {"id": "w053", "ch": "카운터앱", "type": "review", "q": "페이지를 열자마자 버튼을 누르지도 않았는데 리렌더링이 끝없이 반복되며 오류가 난다. 잘못된 줄을 고르시오.", "code": "function Controller({ onClickButton }) {\n  return (\n    <div>\n      <button onClick={() => onClickButton(-1)}>-1<\/button>\n      <button onClick={() => onClickButton(-10)}>-10<\/button>\n      <button onClick={onClickButton(10)}>+10<\/button>\n      <button onClick={() => onClickButton(1)}>+1<\/button>\n    <\/div>\n  );\n}\n\nexport default Controller;", "lang": "jsx", "answer": [6], "fix": "<button onClick={() => onClickButton(10)}>+10<\/button>", "explain": "인수를 넘겨야 하는 함수는 onClick={onClickButton(10)}처럼 쓰면 렌더링 중에 바로 호출된다. 부모의 State가 바뀌어 리렌더 → 또 호출 → 무한 반복이 된다. () => onClickButton(10)처럼 화살표 함수로 감싸 클릭할 때 호출되도록 해야 한다."}, {"id": "w054", "ch": "카운터앱", "type": "blank", "q": "App이 State를 관리하고, Controller의 버튼을 누르면 해당 값만큼 count가 바뀌도록 빈칸을 채우시오.", "code": "function App() {\n  const [count, setCount] = useState(0);\n\n  const onClickButton = (value) => {\n    setCount(___1___);\n  };\n\n  return (\n    <div className=\"App\">\n      <h1>Simple Counter<\/h1>\n      <section>\n        <Viewer count={count} />\n      <\/section>\n      <section>\n        <Controller ___2___={onClickButton} />\n      <\/section>\n    <\/div>\n  );\n}\n\nfunction Controller({ onClickButton }) {\n  return (\n    <div>\n      <button onClick={___3___}>+10<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["count + value", "count+value", "value + count", "value+count"], ["onClickButton"], ["() => onClickButton(10)", "()=>onClickButton(10)", "() =>onClickButton(10)", "()=> onClickButton(10)", "() => { onClickButton(10); }", "() => {onClickButton(10);}", "() => { onClickButton(10) }", "() => {onClickButton(10)}"]], "explain": "State와 이를 바꾸는 함수는 공통 부모인 App에 두고(State 끌어올리기), 함수는 Props로 Controller에 내려준다. Controller는 구조 분해로 onClickButton을 받으므로 Props 이름도 onClickButton이어야 한다. 인수가 필요한 함수는 화살표 함수로 감싸 클릭 시 호출되게 한다."}, {"id": "w055", "ch": "투두앱", "type": "single", "q": "리스트를 map으로 렌더링했더니 'Each child in a list should have a unique \"key\" prop.' 경고가 떴다. key에 대한 설명으로 옳은 것은?", "options": ["key는 화면에 출력할 텍스트를 지정하는 속성이다", "key는 리액트가 리스트의 각 항목을 구분해, 어떤 항목을 추가·수정·삭제할지 판단하는 데 쓰는 고유한 값이다", "key로 전달한 값은 자식 컴포넌트에서 props.key로 꺼내 쓸 수 있다", "모든 항목에 같은 key 값을 주어도 문제없다"], "answer": [1], "pick": 1, "explain": "key는 리스트의 각 컴포넌트를 구별하는 고유 식별자다. 할 일 앱에서는 각 아이템의 id를 key={it.id}로 준다. key는 리액트 내부용이라 자식 컴포넌트의 props로는 전달되지 않으며, 값이 중복되면 안 된다."}, {"id": "w056", "ch": "투두앱", "type": "single", "q": "할 일 앱에서 TodoList는 onUpdate 함수를 직접 쓰지 않지만, 자식인 TodoItem에 전달하기 위해 Props로 받아 다시 넘겨준다. 이런 현상을 무엇이라고 하는가?", "options": ["State Lifting", "Props Drilling", "Virtual DOM", "Cleanup", "Hoisting"], "answer": [1], "pick": 1, "explain": "Props는 바로 아래 자식에게만 전달할 수 있어서, 손자 컴포넌트까지 보내려면 중간 컴포넌트가 받아서 다시 넘겨야 한다. 땅을 파고 내려가는 것 같다고 해서 'Props Drilling'이라고 부른다."}, {"id": "w057", "ch": "투두앱", "type": "multi", "q": "할 일 앱(App 컴포넌트, State: todo 배열)에서 State를 올바르게 업데이트하는 코드를 모두 고르시오.", "options": ["setTodo([newItem, ...todo]);", "todo.push(newItem); setTodo(todo);", "setTodo(todo.filter((it) => it.id !== targetId));", "setTodo(todo.map((it) => it.id === targetId ? { ...it, isDone: !it.isDone } : it));", "todo[0].isDone = true; setTodo(todo);"], "answer": [0, 2, 3], "pick": 3, "explain": "State 배열은 원본을 직접 고치지 말고 새 배열을 만들어 set 함수에 넘겨야 한다. 스프레드·filter·map은 새 배열을 만든다. push나 직접 대입은 원본을 바꾼 뒤 같은 배열(같은 참조)을 넘기므로 리액트가 변경을 감지하지 못한다."}, {"id": "w058", "ch": "투두앱", "type": "review", "q": "할 일 목록은 잘 보이지만 콘솔에 'Each child in a list should have a unique \"key\" prop.' 경고가 뜬다. 잘못된 줄을 고르시오.", "code": "import TodoItem from \"./TodoItem\";\n\nfunction TodoList({ todo, onUpdate, onDelete }) {\n  return (\n    <div className=\"TodoList\">\n      <h4>Todo List<\/h4>\n      <div className=\"list_wrapper\">\n        {todo.map((it) => (\n          <TodoItem {...it} onUpdate={onUpdate} onDelete={onDelete} />\n        ))}\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default TodoList;", "lang": "jsx", "answer": [9], "fix": "<TodoItem key={it.id} {...it} onUpdate={onUpdate} onDelete={onDelete} />", "explain": "map으로 리스트를 렌더링할 때는 각 항목에 고유한 key를 주어야 한다. 리액트는 key로 어떤 항목이 추가·수정·삭제되었는지 구분한다. 할 일 아이템의 고유 식별자인 id를 key={it.id}로 전달한다."}, {"id": "w059", "ch": "투두앱", "type": "review", "q": "<삭제> 버튼을 누르면 해당 할 일만 지워져야 하는데, 오히려 그 할 일 하나만 남고 나머지가 모두 사라진다. 잘못된 줄을 고르시오.", "code": "import { useState } from \"react\";\n\nfunction App() {\n  const [todo, setTodo] = useState(mockTodo);\n\n  const onDelete = (targetId) => {\n    setTodo(todo.filter((it) => it.id === targetId));\n  };\n\n  return (\n    <div className=\"App\">\n      <TodoList todo={todo} onDelete={onDelete} />\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": "setTodo(todo.filter((it) => it.id !== targetId));", "explain": "filter는 콜백이 true를 반환한 요소만 남긴다. id가 targetId와 '같은' 것만 남기면 삭제 대상만 남는다. 삭제하려면 id가 targetId와 '다른' 것만 남겨야 하므로 !== 를 써야 한다."}, {"id": "w060", "ch": "투두앱", "type": "review", "q": "새 할 일을 추가하면 'Assignment to constant variable' 오류가 발생한다. 잘못된 줄을 고르시오.", "code": "import { useRef, useState } from \"react\";\n\nfunction App() {\n  const idRef = useRef(3);\n  const [todo, setTodo] = useState(mockTodo);\n\n  const onCreate = (content) => {\n    const newItem = {\n      id: idRef.current,\n      content,\n      isDone: false,\n      createdDate: new Date().getTime(),\n    };\n    setTodo([newItem, ...todo]);\n    idRef += 1;\n  };", "lang": "jsx", "answer": [15], "fix": "idRef.current += 1;", "explain": "idRef는 const로 선언된 Ref 객체이므로 변수 자체에 다시 대입할 수 없다. 값은 Ref 객체의 current 프로퍼티에 들어 있으므로 idRef.current += 1로 증가시켜야 한다. Ref는 값을 바꿔도 리렌더링되지 않아 id 카운터로 쓰기 좋다."}, {"id": "w061", "ch": "투두앱", "type": "review", "q": "'React 공부하기'라는 할 일이 있을 때, 검색어 react로는 찾아지지만 React로 검색하면 결과가 나오지 않는다. 대소문자를 구별하지 않게 하려면 어느 줄을 고쳐야 하는가?", "code": "function TodoList({ todo }) {\n  const [search, setSearch] = useState(\"\");\n\n  const getSearchResult = () => {\n    return search === \"\"\n      ? todo\n      : todo.filter((it) => it.content.toLowerCase().includes(search));\n  };\n\n  return (\n    <div className=\"TodoList\">\n      <input value={search} onChange={(e) => setSearch(e.target.value)} />\n      {getSearchResult().map((it) => (\n        <TodoItem key={it.id} {...it} />\n      ))}\n    <\/div>\n  );\n}", "lang": "jsx", "answer": [7], "fix": ": todo.filter((it) => it.content.toLowerCase().includes(search.toLowerCase()));", "explain": "할 일 내용은 toLowerCase()로 소문자로 바꿨지만 검색어는 그대로라서, 'React'로 검색하면 'react 공부하기'에 'React'가 포함되지 않는다. 비교하는 양쪽 모두 소문자로 바꿔야 대소문자를 구별하지 않는다."}, {"id": "w062", "ch": "투두앱", "type": "blank", "q": "할 일 배열을 TodoItem 컴포넌트 리스트로 렌더링한다. 경고가 나지 않도록 빈칸을 채우시오.", "code": "function TodoList({ todo, onUpdate, onDelete }) {\n  return (\n    <div className=\"list_wrapper\">\n      {todo.map((it) => (\n        <TodoItem\n          ___1___\n          {...it}\n          onUpdate={onUpdate}\n          onDelete={onDelete}\n        />\n      ))}\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["key={it.id}"]], "explain": "map으로 만든 리스트의 각 요소에는 고유한 key가 필요하다. 할 일 아이템마다 중복되지 않는 id가 있으므로 key={it.id}를 준다. {...it}은 아이템 객체의 프로퍼티(id, content, isDone, createdDate)를 각각 Props로 펼쳐 전달한다."}, {"id": "w063", "ch": "투두앱", "type": "blank", "q": "할 일 삭제(onDelete)와 완료 여부 토글(onUpdate) 함수를 완성하시오.", "code": "const onDelete = (targetId) => {\n  setTodo(todo.___1___((it) => it.id !== targetId));\n};\n\nconst onUpdate = (targetId) => {\n  setTodo(\n    todo.map((it) =>\n      it.id === targetId ? { ___2___, isDone: !it.isDone } : it\n    )\n  );\n};", "lang": "jsx", "blanks": [["filter"], ["...it"]], "explain": "filter는 조건을 만족하는 요소만 모아 새 배열을 만든다(삭제 대상만 제외). onUpdate는 map으로 새 배열을 만들면서, 대상 아이템만 ...it으로 복사한 뒤 isDone을 반대로 바꾼 새 객체로 교체한다."}, {"id": "w064", "ch": "투두앱", "type": "blank", "q": "검색어가 비어 있으면 전체 목록을, 아니면 검색어를 포함한 할 일만 대소문자 구별 없이 반환하도록 빈칸을 채우시오.", "code": "const getSearchResult = () => {\n  return search === \"\"\n    ? todo\n    : todo.filter((it) =>\n        it.content.toLowerCase().___1___(search.___2___())\n      );\n};", "lang": "jsx", "blanks": [["includes"], ["toLowerCase"]], "explain": "includes는 문자열에 특정 문자열이 포함되어 있는지 true/false로 알려 준다. 할 일 내용과 검색어를 모두 toLowerCase()로 소문자로 바꿔 비교하면 대소문자를 구별하지 않는 검색이 된다."}, {"id": "w065", "ch": "투두앱", "type": "blank", "q": "새 할 일을 목록 맨 앞에 추가하는 onCreate 함수를 완성하시오. (목 데이터 3개의 id는 0, 1, 2)", "code": "const idRef = useRef(3);\n\nconst onCreate = (content) => {\n  const newItem = {\n    id: idRef.___1___,\n    content,\n    isDone: false,\n    createdDate: new Date().getTime(),\n  };\n  setTodo([newItem, ___2___]);\n  idRef.current += 1;\n};", "lang": "jsx", "blanks": [["current"], ["...todo"]], "explain": "Ref 객체의 값은 current 프로퍼티에 있으므로 idRef.current로 새 id를 얻고, 추가 후 1 증가시켜 중복을 막는다. 새 배열은 [newItem, ...todo]처럼 새 아이템 뒤에 기존 배열을 스프레드로 펼쳐 만든다."}, {"id": "w066", "ch": "투두앱", "type": "blank", "q": "TodoEditor에서 빈 입력을 막고, 추가 후 입력창을 비우며, Enter 키로도 추가되도록 빈칸을 채우시오.", "code": "function TodoEditor({ onCreate }) {\n  const [content, setContent] = useState(\"\");\n  const inputRef = useRef();\n\n  const onSubmit = () => {\n    if (!content) {\n      inputRef.current.focus();\n      return;\n    }\n    ___1___(content);\n    setContent(___2___);\n  };\n\n  const onKeyDown = (e) => {\n    if (e.key === \"___3___\") {\n      onSubmit();\n    }\n  };\n\n  return (\n    <div>\n      <input ref={inputRef} value={content} onKeyDown={onKeyDown}\n        onChange={(e) => setContent(e.target.value)} />\n      <button onClick={onSubmit}>추가<\/button>\n    <\/div>\n  );\n}", "lang": "jsx", "blanks": [["onCreate"], ["\"\"", "''"], ["Enter"]], "explain": "자식(TodoEditor)은 부모(App)가 Props로 내려준 onCreate를 호출해 새 할 일을 전달한다. 추가 후 content를 빈 문자열로 바꾸면 입력창이 비워진다. 빈 문자열은 falsy라서 !content로 빈 입력을 막을 수 있고, Enter 키는 e.key === \"Enter\"로 확인한다."}], "essay": [{"id": "e001", "kind": "essay", "ch": "4장", "q": "리액트의 특징 세 가지를 쓰고, 각각을 설명하시오.", "points": 10, "answer": "첫째, 컴포넌트 기반의 유연성: 헤더처럼 여러 페이지에서 공통으로 쓰는 요소를 컴포넌트라는 모듈로 만들고 필요한 곳에서 불러와 쓰므로 중복 코드가 없고, 컴포넌트 하나만 수정하면 모든 페이지에 반영된다. 둘째, 쉽고 간단한 업데이트: 데이터가 바뀌었을 때 어떤 돔 요소를 어떻게 바꿀지 개발자가 직접 고민하지 않아도, 리액트가 수정 사항을 반영한 요소로 교체해 페이지를 업데이트한다. 셋째, 빠른 업데이트: 변경 사항을 버추얼 돔(Virtual DOM)에 먼저 반영해 모았다가 실제 돔에는 한 번에 업데이트하므로, 연산이 많은 레이아웃·페인팅 횟수가 줄어 빠르다.", "rubric": [{"text": "컴포넌트 기반의 유연성(중복 제거·재사용)", "pts": 4, "keys": ["컴포넌트기반", "컴포넌트단위", "컴포넌트로만", "레고", "재사용", "중복코드"]}, {"text": "쉽고 간단한 업데이트(돔 직접 조작 불필요)", "pts": 3, "keys": ["쉽고간단", "간단한업데이트", "쉬운업데이트", "직접조작", "직접고민", "어떻게바꿀지", "어떻게업데이트할지"]}, {"text": "빠른 업데이트(버추얼 돔)", "pts": 3, "keys": ["버추얼돔", "가상돔", "가상의돔", "virtualdom", "가상dom"]}], "explain": "교재가 꼽는 세 가지는 '컴포넌트 기반의 유연성 / 쉽고 간단한 업데이트 / 빠른 업데이트'다. 빠른 업데이트의 근거로 반드시 버추얼 돔을 언급할 것."}, {"id": "e002", "kind": "essay", "ch": "4장", "q": "버추얼 돔(Virtual DOM)이 무엇인지 설명하고, 버추얼 돔을 사용하면 왜 업데이트가 빨라지는지 브라우저의 렌더링 과정과 연관 지어 서술하시오.", "points": 10, "answer": "버추얼 돔은 실제 돔(DOM)의 사본인 가상의 돔이다. 브라우저는 돔이 바뀔 때마다 렌더 트리 생성, 레이아웃, 페인팅 과정을 다시 수행하는데, 레이아웃과 페인팅은 많은 연산이 필요해 돔 업데이트가 잦으면 성능이 떨어진다. 리액트는 변경 사항이 생기면 먼저 버추얼 돔을 업데이트하는 식으로 여러 번의 변경을 모았다가 실제 돔에는 한 번에 반영하므로, 레이아웃과 페인팅 횟수가 줄어 빠르게 업데이트할 수 있다.", "rubric": [{"text": "실제 돔의 사본(가상의 돔)", "pts": 3, "keys": ["사본", "복사본", "가상의돔", "가상돔", "가상의dom", "가상dom", "copy"]}, {"text": "돔 변경 시 레이아웃·페인팅 반복 → 연산 비용", "pts": 3, "keys": ["레이아웃", "페인팅", "layout", "paint", "리플로우", "리페인트", "렌더트리"]}, {"text": "변경을 모아 실제 돔에 한 번에 반영", "pts": 4, "keys": ["한번에", "모아", "모았다", "일괄", "batch"]}], "explain": "'버추얼 돔이 실제 돔보다 빠르다'가 아니라 '변경을 모아 실제 돔 업데이트(레이아웃·페인팅) 횟수를 줄인다'가 핵심이다."}, {"id": "e003", "kind": "essay", "ch": "4장", "q": "Vite로 만든 리액트 앱에서 `npm run dev`를 실행한 뒤 브라우저에 App 컴포넌트가 표시되기까지의 과정을 `index.html`, `main.jsx`를 포함하여 서술하시오.", "points": 10, "answer": "npm run dev를 실행하면 리액트 앱에 내장된 개발용 웹 서버가 실행되고, 브라우저로 http://localhost:5173 에 접속한다. 서버는 프로젝트 루트의 index.html을 보내는데, 여기에는 id가 root인 빈 <div>와 src/main.jsx를 불러오는 <script> 태그만 있다. main.jsx에서 createRoot(document.getElementById(\"root\"))로 이 div를 리액트 앱의 루트로 지정하고, render(<App />)로 App 컴포넌트를 루트 아래에 렌더링하여 화면에 표시된다. (Vite는 CRA처럼 bundle.js를 만들지 않고, 개발 중에는 index.html에서 ESM 모듈을 직접 불러온다.)", "rubric": [{"text": "내장 웹 서버 실행, localhost:5173 접속", "pts": 2, "keys": ["5173", "웹서버", "개발서버", "내장된"]}, {"text": "index.html의 id가 root인 div", "pts": 3, "keys": ["id가root", "id=\"root\"", "id='root'", "#root", "root인", "루트요소", "root요소", "rootdiv"]}, {"text": "main.jsx에서 createRoot로 루트 지정", "pts": 3, "keys": ["createroot"]}, {"text": "render로 App 컴포넌트 렌더링", "pts": 2, "keys": ["render(<app", ".render(", "render메서드", "render함수"]}], "explain": "CRA는 public/index.html + bundle.js(src/index.js 기반), Vite는 루트 index.html이 엔트리이고 main.jsx를 모듈로 직접 불러온다는 차이도 함께 알아 둘 것."}, {"id": "e004", "kind": "essay", "ch": "5장", "q": "JSX란 무엇인지 설명하고, JSX 문법에서 반드시 지켜야 할 규칙 두 가지를 서술하시오.", "points": 10, "answer": "JSX는 자바스크립트와 HTML 태그를 섞어 쓸 수 있는 자바스크립트의 확장 문법으로, 중괄호 {} 안에 자바스크립트 표현식을 넣어 값을 렌더링할 수 있다. 첫째, 닫힘 규칙: 모든 태그는 여는 태그가 있으면 반드시 닫아야 하므로, <img />, <input />, <br />처럼 HTML에서 닫는 태그가 없는 요소도 /로 닫아야 한다. 둘째, 최상위 태그 규칙: 컴포넌트가 반환하는 모든 태그는 반드시 하나의 최상위 태그로 감싸야 하며, 불필요한 HTML 태그를 쓰지 않으려면 <React.Fragment>나 빈 태그 <><\/>로 감싼다.", "rubric": [{"text": "JSX 정의(자바스크립트 확장 문법, HTML 혼용)", "pts": 3, "keys": ["확장문법", "확장", "섞어", "html태그", "javascriptxml", "jsxml"]}, {"text": "닫힘 규칙", "pts": 3, "keys": ["닫힘", "닫는태그", "닫아야", "/>"]}, {"text": "최상위 태그 규칙", "pts": 3, "keys": ["최상위", "하나의태그", "하나로감싸", "부모태그", "루트태그", "단일"]}, {"text": "Fragment(빈 태그)", "pts": 1, "keys": ["fragment", "<><\/>", "프래그먼트", "빈태그"]}], "explain": "조건문(if)은 표현식이 아니라서 JSX 중괄호 안에 쓸 수 없고 삼항 연산자나 &&를 쓴다는 점도 함께 기억할 것."}, {"id": "e005", "kind": "essay", "ch": "5장", "q": "Props가 무엇인지 설명하고, 부모 컴포넌트에서 자식 컴포넌트로 값을 전달하고 사용하는 방법과 `children` 프로퍼티에 대해 서술하시오.", "points": 10, "answer": "Props는 부모 컴포넌트가 자식 컴포넌트에 전달하는 값으로, 단일 객체 형태로 전달된다. 부모는 자식 컴포넌트 태그에 이름={값} 형식으로 작성해 전달하고, 자식은 함수의 매개변수(props)로 받아 props.name처럼 쓰거나 구조 분해 할당({ name })으로 꺼내 사용한다. Props는 부모만 자식에게 전달할 수 있다. 또한 자식 컴포넌트 태그 사이에 다른 요소나 컴포넌트를 배치하면 자동으로 Props의 children 프로퍼티에 저장되어 전달되며, 자식은 {children}처럼 표현식으로 렌더링할 수 있다.", "rubric": [{"text": "부모가 자식에게 전달하는 값(객체)", "pts": 3, "keys": ["부모가자식", "부모컴포넌트가자식", "부모에서자식", "부모→자식", "부모->자식", "부모만"]}, {"text": "이름={값} 형식으로 전달", "pts": 2, "keys": ["={", "이름=값", "속성"]}, {"text": "매개변수/구조 분해 할당으로 사용", "pts": 2, "keys": ["매개변수", "구조분해", "props.", "파라미터"]}, {"text": "children: 태그 사이의 자식 요소가 전달됨", "pts": 3, "keys": ["children"]}], "explain": "구조 분해 할당 시 기본값(favorList = [])을 지정하면 Props가 전달되지 않아도 오류를 막을 수 있다."}, {"id": "e006", "kind": "essay", "ch": "5장", "q": "State란 무엇인지 설명하고, `useState`의 사용법(인수와 반환값)과 State 값이 바뀌었을 때 일어나는 일을 서술하시오.", "points": 10, "answer": "State는 컴포넌트가 관리하는, 값이 변할 수 있는 상태(데이터)로, 컴포넌트는 State 값에 따라 다른 결과를 렌더링한다. useState를 호출할 때 전달한 인수가 State의 초기값이 되며, useState는 현재 상태 값을 저장한 State 변수와 그 값을 변경하는 set 함수 두 요소를 담은 배열을 반환한다(예: const [count, setCount] = useState(0);). set 함수로 State 값을 변경하면 컴포넌트 함수가 다시 호출되어 리렌더링되고, 변경된 값이 화면에 반영된다.", "rubric": [{"text": "State 정의(변할 수 있는 컴포넌트의 상태)", "pts": 2, "keys": ["상태", "변할수있는", "변하는값", "동적"]}, {"text": "인수는 초기값", "pts": 2, "keys": ["초기값", "초깃값", "기본값", "usestate(0)"]}, {"text": "[State 변수, set 함수] 배열 반환", "pts": 3, "keys": ["set함수", "setcount", "세터", "setter", "배열"]}, {"text": "set 함수로 변경 시 리렌더링", "pts": 3, "keys": ["리렌더", "재렌더", "다시렌더", "rerender", "re-render", "다시호출", "재호출"]}], "explain": "State 값이 바뀌면 그 컴포넌트가 리렌더되고, 부모가 리렌더되면 자식도 함께 리렌더된다."}, {"id": "e007", "kind": "essay", "ch": "5장", "q": "Props와 State의 차이점을 값을 누가 만들고 관리하는지, 컴포넌트가 직접 변경할 수 있는지를 중심으로 서술하시오.", "points": 10, "answer": "Props는 부모 컴포넌트가 자식 컴포넌트에 전달하는 값으로, 자식은 전달받은 Props를 읽어서 사용할 뿐 직접 변경할 수 없고, 값이 바뀌려면 부모가 새 값을 전달해야 한다. State는 컴포넌트 내부에서 useState로 직접 만들고 관리하는 값으로, set 함수를 통해 컴포넌트 스스로 변경할 수 있다. 둘 다 값이 바뀌면 컴포넌트가 리렌더링되며, 카운터 앱에서 App의 State count를 Viewer에 Props로 전달한 것처럼 State를 Props로 전달할 수도 있다.", "rubric": [{"text": "Props: 부모로부터 전달받는 값", "pts": 3, "keys": ["부모가", "부모로부터", "부모에게서", "부모컴포넌트가", "전달받"]}, {"text": "Props는 자식이 직접 변경 불가(읽기 전용)", "pts": 2, "keys": ["변경할수없", "수정할수없", "바꿀수없", "읽기전용", "readonly", "read-only", "변경불가"]}, {"text": "State: 컴포넌트 내부에서 만들고 관리", "pts": 3, "keys": ["내부", "스스로", "자신이", "자체적", "직접만들"]}, {"text": "State는 set 함수로 변경", "pts": 2, "keys": ["set함수", "setcount", "setstate", "세터", "setter"]}], "explain": "State도 값이므로 Props로 내려줄 수 있다. 자식이 부모의 State를 바꾸려면 부모가 set 함수를 호출하는 함수를 Props로 내려줘야 한다."}, {"id": "e008", "kind": "essay", "ch": "5장", "q": "`useRef`로 만든 Ref 객체와 `useState`로 만든 State의 차이를 서술하고, `useRef`의 대표적인 사용 예를 두 가지 쓰시오.", "points": 10, "answer": "State는 set 함수로 값을 변경하면 컴포넌트가 리렌더링되지만, Ref 객체는 current 프로퍼티의 값을 변경해도 리렌더링이 일어나지 않는다. 또한 Ref에 저장한 값은 컴포넌트가 리렌더링되어도 초기화되지 않고 유지된다. 사용 예 첫째, <input ref={inputRef} />처럼 돔 요소에 연결해 inputRef.current.focus()로 포커스를 주는 등 돔을 직접 조작한다. 둘째, 할 일 관리 앱의 idRef처럼 화면에 렌더링할 필요는 없지만 계속 유지해야 하는 값(새 아이템의 id)을 저장하는 컴포넌트 변수로 사용한다.", "rubric": [{"text": "Ref 값을 바꿔도 리렌더링되지 않음", "pts": 4, "keys": ["리렌더링되지않", "리렌더링하지않", "리렌더되지않", "리렌더하지않", "리렌더링이일어나지않", "리렌더가일어나지않", "렌더링되지않", "다시렌더링되지않", "다시렌더링하지않", "재렌더링되지않", "감지하지못", "리렌더링을일으키지않", "리렌더를일으키지않", "리렌더링을발생시키지않"]}, {"text": "값은 current 프로퍼티에 저장", "pts": 2, "keys": ["current"]}, {"text": "예①: 돔 요소 접근(포커스 등)", "pts": 2, "keys": ["돔", "dom", "focus", "포커스"]}, {"text": "예②: 렌더링과 무관한 값 저장(idRef 등)", "pts": 2, "keys": ["idref", "변수", "값을저장", "값을유지", "유지"]}], "explain": "State는 '화면에 보여야 하는 값', Ref는 '기억은 해야 하지만 바뀌어도 화면을 다시 그릴 필요 없는 값이나 돔 요소'에 쓴다."}, {"id": "e009", "kind": "essay", "ch": "5장", "q": "리액트 훅(React Hook)이란 무엇인지 설명하고, '훅'이라는 이름이 붙은 이유와 지금까지 배운 훅의 예를 쓰시오.", "points": 10, "answer": "리액트 훅은 함수로 만든 컴포넌트에서도 원래 클래스로 만든 컴포넌트에서만 쓸 수 있던 State, Ref 같은 기능을 사용할 수 있게 도와주는 함수들이다. 클래스 컴포넌트의 기능을 낚아채듯(Hook) 가져와 사용한다고 해서 훅이라는 이름이 붙었으며, 훅의 이름 앞에는 항상 use를 붙인다. 예로 State를 만드는 useState, 참조 객체(Ref)를 만드는 useRef, 라이프 사이클을 제어하는 useEffect가 있다.", "rubric": [{"text": "함수 컴포넌트에서 클래스 컴포넌트의 기능을 사용", "pts": 4, "keys": ["클래스", "class"]}, {"text": "이름 유래: 낚아채듯 가져옴", "pts": 2, "keys": ["낚아", "갈고리"]}, {"text": "이름 앞에 use를 붙임", "pts": 2, "keys": ["use를붙", "use가붙", "use로시작", "use접두", "앞에use", "use라는"]}, {"text": "예: useState, useRef, useEffect", "pts": 2, "keys": ["usestate", "useref", "useeffect"]}], "explain": "리액트 훅은 2018년에 발표되었고, 그 전에는 State·Ref를 쓰려면 클래스 컴포넌트를 만들어야 했다."}, {"id": "e010", "kind": "essay", "ch": "5장", "q": "다음 컴포넌트에서 <+> 버튼을 누르면 콘솔에는 1, 2, 3...이 찍히지만 화면의 숫자는 0에서 바뀌지 않는다. 그 이유를 쓰고, 해결 방법을 코드와 함께 서술하시오.", "code": "function Body() {\n  let count = 0;\n\n  const onIncrease = () => {\n    count = count + 1;\n    console.log(count);\n  };\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={onIncrease}>+<\/button>\n    <\/div>\n  );\n}", "points": 10, "answer": "count는 State가 아닌 일반 변수이므로 값이 바뀌어도 리액트는 변화를 감지하지 못해 컴포넌트를 리렌더링하지 않는다. 화면에 표시되는 값은 컴포넌트 함수의 반환값이므로, 함수가 다시 호출(리렌더)되지 않으면 처음 렌더링한 0이 그대로 남는다. 해결하려면 useState로 State를 만들고 set 함수로 값을 변경한다: const [count, setCount] = useState(0); const onIncrease = () => { setCount(count + 1); }; set 함수로 State가 바뀌면 컴포넌트가 리렌더링되어 화면에 새 값이 표시된다.", "rubric": [{"text": "일반 변수는 바뀌어도 리렌더링되지 않음", "pts": 4, "keys": ["리렌더링되지않", "리렌더링하지않", "리렌더되지않", "리렌더하지않", "리렌더링이일어나지않", "리렌더가일어나지않", "렌더링되지않", "다시렌더링되지않", "다시렌더링하지않", "재렌더링되지않", "감지하지못", "리렌더링을일으키지않", "리렌더를일으키지않", "리렌더링을발생시키지않"]}, {"text": "useState로 State 생성", "pts": 3, "keys": ["usestate"]}, {"text": "set 함수로 값 변경", "pts": 3, "keys": ["setcount(count+1)", "setcount(", "set함수"]}], "explain": "게다가 일반 변수는 리렌더될 때마다 let count = 0으로 다시 초기화된다. 값을 기억하면서 화면도 바꾸려면 State가 필요하다."}, {"id": "e011", "kind": "essay", "ch": "5장", "q": "다음 코드를 실행하면 'Cannot read properties of undefined (reading 'length')' 오류가 발생한다. 오류의 원인을 설명하고, Body 컴포넌트만 수정하여 해결하는 방법을 서술하시오.", "code": "// App.jsx\n<Body name={\"이정환\"} location={\"부천시\"} />\n\n// Body.jsx\nfunction Body({ name, location, favorList }) {\n  return (\n    <div>\n      {name}은 {location}에 거주합니다.\n      <br />\n      {favorList.length}개의 음식을 좋아합니다.\n    <\/div>\n  );\n}", "points": 10, "answer": "App이 Body에 favorList를 Props로 전달하지 않았기 때문에, Body에서 구조 분해 할당한 favorList의 값은 undefined이다. undefined의 length 프로퍼티를 읽으려고 하므로 오류가 발생한다. 구조 분해 할당할 때 기본값을 설정하면 해결된다: function Body({ name, location, favorList = [] }) { ... } 이렇게 하면 favorList가 전달되지 않아도 빈 배열이 사용되어 '0개의 음식을 좋아합니다'가 출력된다.", "rubric": [{"text": "favorList가 전달되지 않아 undefined", "pts": 4, "keys": ["undefined", "전달하지않", "전달되지않", "전달안"]}, {"text": "구조 분해 할당 시 기본값 설정", "pts": 3, "keys": ["기본값", "디폴트", "default", "초기값"]}, {"text": "favorList = [] 코드", "pts": 3, "keys": ["favorlist=[]"]}], "explain": "교재의 Body.defaultProps는 이제 클래스 컴포넌트 전용이므로, 함수 컴포넌트는 매개변수 구조 분해의 기본값을 쓴다."}, {"id": "e012", "kind": "essay", "ch": "5장", "q": "다음 코드에서 페이지를 처음 연 뒤 <+> 버튼을 정확히 5번 누르면 콘솔에 'viewer component update!'가 몇 번 출력되는지 쓰고, 그 이유를 서술하시오. (StrictMode는 제거된 상태)", "code": "function Viewer() {\n  console.log(\"viewer component update!\");\n  return <div>Viewer<\/div>;\n}\n\nfunction Body() {\n  const [number, setNumber] = useState(0);\n\n  return (\n    <div>\n      <h2>{number}<\/h2>\n      <Viewer />\n      <button onClick={() => setNumber(number + 1)}>+<\/button>\n    <\/div>\n  );\n}", "points": 10, "answer": "총 6번 출력된다. 첫 번째는 Viewer가 페이지에 처음 렌더링될 때 출력되고, 나머지 5번은 버튼을 누를 때마다 부모인 Body의 State(number)가 바뀌어 Body가 리렌더되면서 자식인 Viewer도 함께 리렌더되기 때문이다. 리액트에서는 Viewer처럼 Props를 받지 않아 내용이 바뀐 게 없더라도 부모 컴포넌트가 리렌더하면 자식도 함께 리렌더된다. 이런 의미 없는 리렌더가 자주 발생하면 성능이 떨어질 수 있다.", "rubric": [{"text": "총 6번", "pts": 3, "keys": ["6번", "6회", "여섯번", "총6"]}, {"text": "처음 렌더링(마운트) 때 1번", "pts": 2, "keys": ["처음", "최초", "마운트"]}, {"text": "부모가 리렌더되면 자식도 함께 리렌더", "pts": 5, "keys": ["함께리렌더", "같이리렌더", "자식도", "부모가리렌더", "부모컴포넌트가리렌더", "부모가다시렌더", "부모의state가"]}], "explain": "이런 불필요한 리렌더를 막는 최적화 기법은 8장(최적화)에서 다룬다고 예고만 되어 있다. 리액트 개발자 도구의 리렌더 하이라이트로 확인할 수 있다."}, {"id": "e013", "kind": "essay", "ch": "6장", "q": "리액트 컴포넌트의 라이프 사이클 3단계를 쓰고 각 단계가 언제 일어나는지 설명하시오. 또한 라이프 사이클을 제어할 때 사용하는 리액트 훅을 쓰시오.", "points": 10, "answer": "마운트(Mount)는 컴포넌트를 페이지에 처음 렌더링할 때이다. 업데이트(Update)는 State나 Props의 값이 바뀌거나, 부모 컴포넌트가 리렌더해 자신도 리렌더될 때이다. 언마운트(Unmount)는 더 이상 페이지에 컴포넌트를 렌더링하지 않아 컴포넌트가 사라질 때이다. 이러한 라이프 사이클은 리액트 훅인 useEffect로 제어할 수 있다.", "rubric": [{"text": "마운트: 처음 렌더링될 때", "pts": 3, "keys": ["처음렌더", "처음으로렌더", "최초렌더", "처음나타", "처음화면에", "처음페이지"]}, {"text": "업데이트: State/Props 변경, 부모 리렌더", "pts": 3, "keys": ["업데이트", "update"]}, {"text": "언마운트: 더 이상 렌더링하지 않을 때(제거)", "pts": 2, "keys": ["언마운트", "unmount"]}, {"text": "useEffect로 제어", "pts": 2, "keys": ["useeffect"]}], "explain": "업데이트가 일어나는 세 가지 경우(자신의 State 변경, Props 변경, 부모의 리렌더)까지 쓰면 완벽한 답안이다."}, {"id": "e014", "kind": "essay", "ch": "6장", "q": "`useEffect`의 두 번째 인수인 의존성 배열을 ① 생략한 경우, ② 빈 배열 `[]`을 전달한 경우, ③ `[count]`처럼 값을 넣은 경우에 콜백 함수가 각각 언제 실행되는지 설명하시오.", "points": 10, "answer": "① 의존성 배열을 생략하면 마운트될 때와 업데이트될 때 모두, 즉 컴포넌트가 렌더링될 때마다 콜백 함수가 실행된다. ② 빈 배열 []을 전달하면 컴포넌트가 처음 마운트될 때 한 번만 실행된다. ③ [count]처럼 값을 넣으면 마운트될 때 한 번 실행되고, 이후에는 배열에 넣은 값(count)이 변경될 때마다 실행된다. 배열에 값이 여러 개면 그중 하나라도 바뀌면 실행된다.", "rubric": [{"text": "① 생략: 렌더링될 때마다 실행", "pts": 3, "keys": ["렌더링될때마다", "렌더링할때마다", "렌더될때마다", "리렌더링될때마다", "리렌더될때마다", "매번", "매렌더"]}, {"text": "② []: 마운트 시 한 번만", "pts": 3, "keys": ["한번만", "처음한번", "1번만", "1회만", "최초1회", "마운트될때만", "마운트시에만", "마운트때만"]}, {"text": "③ [count]: 값이 바뀔 때마다", "pts": 4, "keys": ["변경될때마다", "바뀔때마다", "변할때마다", "달라질때마다", "변경되면", "바뀌면"]}], "explain": "③에서 State를 초기화할 때(마운트 시)도 콜백이 실행되므로 처음에 'count 업데이트: 0'이 한 번 출력된다."}, {"id": "e015", "kind": "essay", "ch": "6장", "q": "리액트 개발자 도구(React Developer Tools)의 [Components] 탭에서 사용할 수 있는 주요 기능 세 가지를 설명하시오.", "points": 10, "answer": "첫째, 컴포넌트 트리 기능으로 현재 렌더링된 앱의 컴포넌트 구조를 시각적으로 보여 준다(카운터 앱이라면 App 아래 Viewer, Even, Controller). 둘째, State·Props 모니터링 기능으로 컴포넌트를 클릭하면 그 컴포넌트의 State(hooks)와 전달받은 Props 값을 실시간으로 확인할 수 있어, console.log를 일일이 쓰지 않아도 된다. 셋째, 리렌더 하이라이트 기능(Highlight updates when components render)으로 리렌더가 발생한 컴포넌트를 색으로 강조해, 의미 없이 리렌더되는 컴포넌트를 찾아 최적화에 활용할 수 있다.", "rubric": [{"text": "컴포넌트 트리 확인", "pts": 3, "keys": ["트리", "tree", "계층구조"]}, {"text": "State/Props 실시간 모니터링", "pts": 4, "keys": ["모니터링", "state값", "props값", "실시간", "state와props"]}, {"text": "리렌더 하이라이트", "pts": 3, "keys": ["하이라이트", "highlight", "강조"]}], "explain": "[Profiler] 탭은 렌더링 성능 측정용이며 수업에서는 [Components] 탭만 다뤘다."}, {"id": "e016", "kind": "essay", "ch": "6장", "q": "App 컴포넌트에 다음 코드를 추가한 뒤 카운터 버튼을 빠르게 여러 번 클릭하면 '깜빡'이 1초보다 훨씬 빠르게 출력된다. 그 이유를 설명하고, 클린업 함수를 이용한 해결 코드와 클린업 함수가 실행되는 시점 두 가지를 서술하시오.", "code": "useEffect(() => {\n  setInterval(() => {\n    console.log(\"깜빡\");\n  }, 1000);\n});", "points": 10, "answer": "의존성 배열이 없으므로 App이 렌더링될 때마다 콜백 함수가 실행되어 새 인터벌이 생성되는데, clearInterval로 기존 인터벌을 종료하지 않아 여러 개의 인터벌이 중복으로 쌓이기 때문이다. 해결하려면 콜백 함수가 클린업 함수를 반환하게 한다: useEffect(() => { const intervalID = setInterval(() => { console.log(\"깜빡\"); }, 1000); return () => { clearInterval(intervalID); }; }); 클린업 함수는 ① Effect(콜백 함수)가 다시 실행되기 직전과 ② 컴포넌트가 언마운트(제거)될 때 실행된다.", "rubric": [{"text": "렌더링마다 인터벌이 생성되고 종료되지 않아 중복", "pts": 3, "keys": ["중복", "여러개", "쌓", "누적"]}, {"text": "return () => clearInterval(...) 클린업", "pts": 4, "keys": ["clearinterval"]}, {"text": "시점①: Effect가 다시 실행되기 전", "pts": 2, "keys": ["다시실행되기", "다시실행하기", "재실행", "다시호출되기", "다시호출하기", "실행되기전", "실행되기직전", "다음effect"]}, {"text": "시점②: 언마운트될 때", "pts": 1, "keys": ["언마운트", "unmount", "제거될"]}], "explain": "클린업은 '콜백 함수가 반환하는 함수'다. return clearInterval(intervalID)처럼 함수로 감싸지 않으면 바로 실행되어 인터벌이 곧장 지워진다."}, {"id": "e017", "kind": "essay", "ch": "6장", "q": "count의 초기값은 0이다. 페이지를 처음 열고 <+1> 버튼을 두 번 눌렀을 때 콘솔에 출력되는 내용을 순서대로 쓰고, 그 이유를 라이프 사이클과 연관 지어 서술하시오. (StrictMode는 제거된 상태)", "code": "// Even.jsx\nfunction Even() {\n  useEffect(() => {\n    console.log(\"Even 마운트\");\n    return () => {\n      console.log(\"Even 언마운트\");\n    };\n  }, []);\n\n  return <div>현재 카운트는 짝수입니다<\/div>;\n}\n\n// App.jsx의 return 문 일부\n{count % 2 === 0 && <Even />}", "points": 10, "answer": "출력 순서는 Even 마운트 → Even 언마운트 → Even 마운트이다. count가 0(짝수)이면 count % 2 === 0이 참이라 && 뒤의 <Even />이 렌더링되어 마운트되고, 빈 의존성 배열을 가진 useEffect의 콜백이 실행된다. count가 1(홀수)이 되면 조건이 거짓이라 Even이 더 이상 렌더링되지 않아 언마운트되고, 이때 useEffect가 반환한 클린업 함수가 실행된다. count가 2(짝수)가 되면 Even이 다시 마운트되어 'Even 마운트'가 한 번 더 출력된다.", "rubric": [{"text": "출력 순서: 마운트 → 언마운트 → 마운트", "pts": 4, "keys": ["마운트→even언마운트", "마운트->even언마운트", "마운트,even언마운트", "마운트'→'even언마운트", "마운트→언마운트→", "마운트->언마운트->", "마운트,언마운트,"]}, {"text": "짝수일 때 && 조건부 렌더링으로 마운트", "pts": 2, "keys": ["&&", "짝수", "조건부"]}, {"text": "언마운트 시 클린업 함수 실행", "pts": 4, "keys": ["클린업", "cleanup", "return한함수", "반환한함수"]}], "explain": "빈 배열 []의 useEffect는 마운트 때 콜백, 언마운트 때 클린업이 실행된다. 조건부 렌더링으로 사라졌다가 다시 나타나면 새로 마운트된 것이다."}, {"id": "e018", "kind": "essay", "ch": "6장", "q": "다음 코드가 라이프 사이클 중 어느 시점에만 콘솔에 출력하는지 쓰고, 그렇게 동작하는 원리를 설명하시오. 또한 didMountRef를 `useState`가 아닌 `useRef`로 만든 이유를 쓰시오.", "code": "const didMountRef = useRef(false);\n\nuseEffect(() => {\n  if (!didMountRef.current) {\n    didMountRef.current = true;\n    return;\n  } else {\n    console.log(\"컴포넌트 업데이트!\");\n  }\n});", "points": 10, "answer": "마운트 시점에는 출력하지 않고 업데이트 시점에만(리렌더될 때만) '컴포넌트 업데이트!'를 출력한다. 의존성 배열이 없으므로 콜백 함수는 마운트와 업데이트 때 모두 실행되는데, 처음 마운트될 때는 didMountRef.current가 false이므로 true로 바꾸고 return으로 출력 없이 함수를 종료한다. 이후 리렌더될 때는 current가 true이므로 else로 가서 콘솔에 출력한다. Ref는 리렌더링되어도 값이 유지되면서, 값을 바꿔도 리렌더링이 일어나지 않는다. State로 만들면 값을 true로 바꾸는 순간 리렌더가 발생해 마운트 직후 불필요한 업데이트가 한 번 더 일어난다.", "rubric": [{"text": "업데이트 시점에만 출력", "pts": 3, "keys": ["업데이트시점", "업데이트될때만", "업데이트때만", "업데이트시에만", "업데이트에만", "리렌더될때만", "리렌더링될때만"]}, {"text": "마운트 시 false → true로 바꾸고 종료, 이후엔 출력", "pts": 4, "keys": ["false", "true"]}, {"text": "Ref는 값이 유지되고 바꿔도 리렌더링 없음", "pts": 3, "keys": ["리렌더링되지않", "리렌더링하지않", "리렌더되지않", "리렌더하지않", "리렌더링이일어나지않", "리렌더가일어나지않", "렌더링되지않", "다시렌더링되지않", "다시렌더링하지않", "재렌더링되지않", "감지하지못", "리렌더링을일으키지않", "리렌더를일으키지않", "리렌더링을발생시키지않", "유지"]}], "explain": "의존성 배열을 생략하면 마운트와 업데이트 모두에서 실행되므로, 마운트를 걸러내려면 이처럼 Ref로 '마운트 여부'를 기억한다."}, {"id": "e019", "kind": "essay", "ch": "카운터앱", "q": "리액트의 '단방향 데이터 흐름'이 무엇인지 장점과 함께 설명하고, 카운터 앱에서 자식인 Controller의 버튼 클릭으로 부모인 App의 State를 변경하는 방법을 서술하시오.", "points": 10, "answer": "리액트에서 컴포넌트 간 데이터는 Props로 전달하며, 전달 방향은 항상 부모에서 자식으로만 흐른다. 이를 단방향 데이터 흐름이라 하며, 데이터의 흐름을 이해하기 쉽고 관리하기 좋다는 장점이 있다. 반면 State를 변경하는 이벤트는 자식에서 부모 방향으로 전달되어야 한다. 카운터 앱에서는 App이 State를 변경하는 함수 onClickButton을 Props로 Controller에 내려주고, Controller는 버튼을 클릭할 때 이 함수를 호출하여 App의 State(count)를 변경한다.", "rubric": [{"text": "Props는 부모 → 자식 한 방향으로만 전달", "pts": 4, "keys": ["부모에서자식", "부모→자식", "부모->자식", "부모가자식", "위에서아래", "한방향", "아래로"]}, {"text": "장점: 흐름을 이해·관리하기 쉬움", "pts": 2, "keys": ["이해하기쉽", "관리하기", "파악하기", "추적"]}, {"text": "부모가 함수를 Props로 내리고 자식이 호출", "pts": 4, "keys": ["호출", "함수를props", "함수를전달", "함수를내려"]}], "explain": "교재는 단방향 데이터 흐름을 '일방통행 차선'에 비유한다. 데이터는 아래로, 이벤트(State 변경 요청)는 위로 전달된다."}, {"id": "e020", "kind": "essay", "ch": "카운터앱", "q": "카운터 앱의 Controller 컴포넌트를 다음과 같이 작성했더니, 버튼을 누르지도 않았는데 페이지를 열자마자 렌더링이 끝없이 반복되며 콘솔에 경고와 오류가 쏟아진다. 원인을 설명하고 올바르게 고치는 방법을 서술하시오.", "code": "function Controller({ onClickButton }) {\n  return (\n    <div>\n      <button onClick={onClickButton(-1)}>-1<\/button>\n      <button onClick={onClickButton(1)}>+1<\/button>\n    <\/div>\n  );\n}", "points": 10, "answer": "onClick={onClickButton(-1)}은 함수를 전달하는 것이 아니라, 렌더링하는 도중에 onClickButton(-1)을 즉시 호출하고 그 반환값(undefined)을 onClick에 넣는다. 그래서 렌더링될 때마다 App의 setCount가 호출되어 State가 바뀌고, App이 리렌더링되면 자식인 Controller도 다시 렌더링되면서 또 호출되는 일이 무한히 반복된다. 이벤트 핸들러는 콜백 함수 형태로 전달해야 하므로 onClick={() => onClickButton(-1)}처럼 화살표 함수로 감싸 클릭했을 때만 호출되도록 고친다.", "rubric": [{"text": "렌더링 중에 함수가 즉시 호출됨", "pts": 4, "keys": ["즉시호출", "즉시실행", "바로호출", "바로실행", "렌더링하는도중", "렌더링중", "반환값"]}, {"text": "State 변경 → 리렌더 → 재호출 무한 반복", "pts": 3, "keys": ["무한", "반복", "계속"]}, {"text": "화살표 함수로 감싸서 전달", "pts": 3, "keys": ["()=>onclickbutton(", "()=>", "화살표함수"]}], "explain": "인수가 없는 핸들러는 onClick={handleOnClick}처럼 함수 이름만 넘기고, 인수가 필요하면 화살표 함수로 감싼다."}, {"id": "e021", "kind": "essay", "ch": "카운터앱", "q": "카운터 앱에서 count State를 다음처럼 Controller 컴포넌트에 만들었더니, Viewer 컴포넌트에 현재 카운트를 표시할 방법이 없었다. 그 이유를 설명하고, State를 어느 컴포넌트에 어떻게 만들어야 하는지 그 기법의 이름과 함께 서술하시오.", "code": "// Controller.jsx\nfunction Controller() {\n  const [count, setCount] = useState(0);\n  return (\n    <div>\n      <button onClick={() => setCount(count + 1)}>+1<\/button>\n    <\/div>\n  );\n}\n\n// Viewer.jsx\nfunction Viewer() {\n  return <div>현재 카운트 : ???<\/div>;\n}\n\n// App.jsx\nfunction App() {\n  return (\n    <div>\n      <Viewer />\n      <Controller />\n    <\/div>\n  );\n}", "points": 10, "answer": "Props는 부모만 자식에게 전달할 수 있는데, Viewer와 Controller는 부모-자식 관계가 아닌 형제 관계이므로 Controller의 State(count)를 Viewer에 전달할 수 없다. 따라서 State는 두 컴포넌트의 공통 부모인 App 컴포넌트에 만들어야 한다. App에서 const [count, setCount] = useState(0);으로 State를 만들고, count는 Viewer에 Props로 전달해 표시하고, count를 변경하는 함수는 Controller에 Props로 전달해 버튼 클릭 시 호출하게 한다. 이처럼 여러 컴포넌트가 함께 쓰는 State를 상위 컴포넌트로 올려서 관리하는 것을 State 끌어올리기(State Lifting)라고 한다.", "rubric": [{"text": "형제 관계라 Props로 전달 불가", "pts": 3, "keys": ["형제", "부모-자식관계가아", "부모자식관계가아", "전달할수없", "전달불가"]}, {"text": "공통 부모인 App에 State 생성", "pts": 3, "keys": ["app컴포넌트", "app에", "부모인app", "공통부모", "상위컴포넌트"]}, {"text": "count와 변경 함수를 Props로 내려줌", "pts": 2, "keys": ["props로전달", "props로내려", "props로넘"]}, {"text": "State 끌어올리기(State Lifting)", "pts": 2, "keys": ["끌어올리기", "끌어올", "lifting", "리프팅"]}], "explain": "Viewer에 State를 만들어도 같은 문제(setCount를 Controller에 줄 수 없음)가 생긴다. 정답은 항상 '공통 부모'다."}, {"id": "e022", "kind": "essay", "ch": "투두앱", "q": "배열을 `map`으로 리스트 렌더링할 때 각 요소에 `key`를 지정해야 하는 이유를 설명하고, 할 일 관리 앱에서는 무엇을 key로 사용했는지 쓰시오.", "points": 10, "answer": "key는 리스트에서 각각의 컴포넌트를 구분하기 위해 사용하는 고유한 값이다. 리액트는 리스트의 특정 항목을 추가, 수정, 삭제할 때 key로 어떤 컴포넌트를 업데이트할지 결정하므로, key가 없으면 'Each child in a list should have a unique key prop' 경고가 발생하고, 비효율적으로 탐색해 성능이 나빠지거나 의도치 않은 동작이 일어날 수 있다. 할 일 관리 앱에서는 각 할 일 아이템의 고유 식별자인 id를 key로 사용했다(<TodoItem key={it.id} ... />).", "rubric": [{"text": "각 항목을 구분하는 고유한 값", "pts": 3, "keys": ["구분", "식별", "고유"]}, {"text": "추가·수정·삭제 시 업데이트할 컴포넌트 결정(성능)", "pts": 4, "keys": ["어떤컴포넌트", "업데이트할지", "비효율", "성능", "의도치않"]}, {"text": "할 일의 id를 key로 사용", "pts": 3, "keys": ["key={it.id}", "id를key", "id를키", "it.id", "아이디"]}], "explain": "key는 TodoItem 내부에서 Props로 꺼내 쓸 수 없는 리액트 전용 값이며, 형제 사이에서만 고유하면 된다."}, {"id": "e023", "kind": "essay", "ch": "투두앱", "q": "할 일 관리 앱의 onCreate를 다음과 같이 작성했더니, <추가> 버튼을 눌러도 화면의 할 일 목록이 바뀌지 않는다. 그 이유를 설명하고 올바르게 수정한 코드를 쓰시오.", "code": "const onCreate = (content) => {\n  const newItem = {\n    id: idRef.current,\n    content,\n    isDone: false,\n    createdDate: new Date().getTime(),\n  };\n  todo.push(newItem);\n  setTodo(todo);\n  idRef.current += 1;\n};", "points": 10, "answer": "push는 기존 배열 todo 자체를 직접 수정(원본 변경)하므로, setTodo(todo)에 전달된 배열은 이전 State와 같은 배열(같은 참조)이다. 리액트는 set 함수에 전달된 값이 이전 State와 같으면 State가 바뀌지 않았다고 판단해 리렌더링하지 않으므로 화면이 바뀌지 않는다. State 배열은 직접 수정하지 말고 스프레드 연산자로 새 배열을 만들어 전달해야 한다: setTodo([newItem, ...todo]); (새 할 일을 맨 앞에 추가)", "rubric": [{"text": "push가 원본 배열을 수정 → 같은 배열(참조)", "pts": 4, "keys": ["같은배열", "같은참조", "동일한배열", "동일한참조", "참조가같", "원본", "직접수정"]}, {"text": "값이 같다고 판단해 리렌더링하지 않음", "pts": 2, "keys": ["리렌더링되지않", "리렌더링하지않", "리렌더되지않", "리렌더하지않", "리렌더링이일어나지않", "리렌더가일어나지않", "렌더링되지않", "다시렌더링되지않", "다시렌더링하지않", "재렌더링되지않", "감지하지못", "리렌더링을일으키지않", "리렌더를일으키지않", "리렌더링을발생시키지않", "바뀌지않았다고"]}, {"text": "스프레드로 새 배열 생성: [newItem, ...todo]", "pts": 4, "keys": ["...todo", "새배열", "새로운배열"]}], "explain": "같은 이유로 수정은 map + {...it, isDone: !it.isDone}, 삭제는 filter처럼 항상 새 배열·새 객체를 만드는 메서드를 쓴다."}, {"id": "e024", "kind": "essay", "ch": "투두앱", "q": "다음 코드에서 TodoList는 onUpdate, onDelete를 직접 사용하지 않는데도 Props로 받고 있다. 그 이유를 설명하고 이러한 현상을 무엇이라 하는지 쓰시오. 또한 `{...it}`의 역할을 서술하시오.", "code": "// App.jsx\n<TodoList todo={todo} onUpdate={onUpdate} onDelete={onDelete} />\n\n// TodoList.jsx\nfunction TodoList({ todo, onUpdate, onDelete }) {\n  return (\n    <div className=\"list_wrapper\">\n      {todo.map((it) => (\n        <TodoItem key={it.id} {...it} onUpdate={onUpdate} onDelete={onDelete} />\n      ))}\n    <\/div>\n  );\n}", "points": 10, "answer": "onUpdate와 onDelete는 App의 State(todo)를 변경하는 함수라서 App에 있지만, 실제로 호출하는 곳은 손자 컴포넌트인 TodoItem이다. 컴포넌트는 바로 한 단계 아래의 자식에게만 Props를 전달할 수 있으므로, 중간에 있는 TodoList가 Props로 받아 다시 TodoItem에 전달하는 매개 역할을 한다. 이렇게 Props가 땅을 파고 내려가듯 여러 단계를 거쳐 전달되는 현상을 Props Drilling이라고 한다. {...it}은 스프레드 연산자로, 할 일 객체 it의 프로퍼티(id, content, isDone, createdDate)를 각각 개별 Props로 펼쳐 TodoItem에 전달한다.", "rubric": [{"text": "한 단계 아래 자식에게만 전달 가능 → 중간에서 다시 전달", "pts": 3, "keys": ["한단계", "바로아래", "손자", "중간", "거쳐"]}, {"text": "Props Drilling", "pts": 4, "keys": ["drilling", "드릴링"]}, {"text": "{...it}: 객체 프로퍼티를 개별 Props로 펼쳐 전달", "pts": 3, "keys": ["펼쳐", "스프레드", "spread", "각각"]}], "explain": "Props Drilling의 해결책(Context 등)은 이후 수업에서 다룬다고 예고만 되어 있으므로, 이름과 원인을 정확히 쓰는 것이 중요하다."}, {"id": "c001", "kind": "code", "ch": "5장", "q": "`useState`를 이용해 <+> 버튼을 클릭할 때마다 화면의 숫자가 1씩 증가하는 Counter 컴포넌트를 완성하시오. (State 변수는 count, 초기값 0, 이벤트 핸들러 이름은 onIncrease)", "code": "import { useState } from \"react\";\n\nfunction Counter() {\n  // 여기에 작성\n}\n\nexport default Counter;", "points": 10, "answer": "import { useState } from \"react\";\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n\n  const onIncrease = () => {\n    setCount(count + 1);\n  };\n\n  return (\n    <div>\n      <h2>{count}<\/h2>\n      <button onClick={onIncrease}>+<\/button>\n    <\/div>\n  );\n}\n\nexport default Counter;", "rubric": [{"text": "useState(0)으로 State 생성", "pts": 3, "keys": ["usestate(0)"]}, {"text": "[count, setCount] 구조 분해", "pts": 2, "keys": ["[count,setcount]"]}, {"text": "setCount(count + 1)", "pts": 3, "keys": ["setcount(count+1)", "setcount(count=>count+1)", "setcount((count)=>count+1)", "setcount((prev)=>prev+1)", "setcount(prev=>prev+1)"]}, {"text": "onClick={onIncrease} 연결", "pts": 2, "keys": ["onclick={onincrease}"]}], "explain": "onClick={onIncrease()}처럼 괄호를 붙이면 렌더링 중에 바로 호출되어 무한 리렌더 오류가 난다."}, {"id": "c002", "kind": "code", "ch": "5장", "q": "입력 폼에 입력한 텍스트를 State `text`로 관리하여, 입력할 때마다 입력 폼 아래에 입력한 내용이 그대로 표시되는 Body 컴포넌트를 작성하시오. (이벤트 핸들러 이름은 handleOnChange)", "code": "import { useState } from \"react\";\n\nfunction Body() {\n  // 여기에 작성\n}\n\nexport default Body;", "points": 10, "answer": "import { useState } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n\n  const handleOnChange = (e) => {\n    setText(e.target.value);\n  };\n\n  return (\n    <div>\n      <input value={text} onChange={handleOnChange} />\n      <div>{text}<\/div>\n    <\/div>\n  );\n}\n\nexport default Body;", "rubric": [{"text": "빈 문자열로 State 생성", "pts": 2, "keys": ["usestate(\"\")", "usestate('')", "usestate(``)"]}, {"text": "e.target.value로 State 변경", "pts": 3, "keys": ["settext(e.target.value)", "e.target.value", "event.target.value"]}, {"text": "value={text}", "pts": 2, "keys": ["value={text}"]}, {"text": "onChange={handleOnChange}", "pts": 3, "keys": ["onchange={handleonchange}"]}], "explain": "value만 지정하고 onChange가 없으면 State가 바뀌지 않아 입력 폼에 글자가 입력되지 않는다."}, {"id": "c003", "kind": "code", "ch": "5장", "q": "App 컴포넌트에서 Body 컴포넌트에 name(\"이정환\")과 location(\"부천시\")을 Props로 전달하고, Body에서는 매개변수에서 구조 분해 할당으로 받아 '이정환은 부천시에 거주합니다'를 출력하도록 두 컴포넌트를 작성하시오. (두 컴포넌트는 같은 파일에 있다고 가정)", "points": 10, "answer": "function Body({ name, location }) {\n  return (\n    <div>\n      {name}은 {location}에 거주합니다\n    <\/div>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Body name={\"이정환\"} location={\"부천시\"} />\n    <\/div>\n  );\n}\n\nexport default App;", "rubric": [{"text": "매개변수에서 구조 분해: Body({ name, location })", "pts": 4, "keys": ["body({name,location})", "body({location,name})"]}, {"text": "<Body name=... location=... /> 로 전달", "pts": 3, "keys": ["<bodyname=", "<bodylocation="]}, {"text": "{name}, {location}을 렌더링", "pts": 3, "keys": ["{name}"]}], "explain": "Props는 하나의 객체로 전달되므로 function Body(props)로 받아 props.name처럼 써도 되지만, 문제에서 요구한 구조 분해 할당이 더 간결하다."}, {"id": "c004", "kind": "code", "ch": "5장", "q": "`useRef`를 이용해 <작성 완료> 버튼을 눌렀을 때 입력한 글자가 5글자 미만이면 입력 폼에 포커스를 주고, 5글자 이상이면 alert로 입력값을 띄운 뒤 입력 폼을 비우도록 ①~③을 채워 코드를 완성하시오.", "code": "import { useState, useRef } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  // ① Ref 객체 생성 (이름: textRef)\n\n  const handleOnChange = (e) => {\n    setText(e.target.value);\n  };\n\n  const handleOnClick = () => {\n    // ② 여기에 작성\n  };\n\n  return (\n    <div>\n      <input /* ③ */ value={text} onChange={handleOnChange} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}\n\nexport default Body;", "points": 10, "answer": "import { useState, useRef } from \"react\";\n\nfunction Body() {\n  const [text, setText] = useState(\"\");\n  const textRef = useRef();\n\n  const handleOnChange = (e) => {\n    setText(e.target.value);\n  };\n\n  const handleOnClick = () => {\n    if (text.length < 5) {\n      textRef.current.focus();\n    } else {\n      alert(text);\n      setText(\"\");\n    }\n  };\n\n  return (\n    <div>\n      <input ref={textRef} value={text} onChange={handleOnChange} />\n      <button onClick={handleOnClick}>작성 완료<\/button>\n    <\/div>\n  );\n}\n\nexport default Body;", "rubric": [{"text": "① useRef로 Ref 객체 생성", "pts": 2, "keys": ["useref()", "useref(null)", "useref("]}, {"text": "③ ref={textRef}로 input에 연결", "pts": 2, "keys": ["ref={textref}", "ref={"]}, {"text": "② 5글자 미만이면 current.focus()", "pts": 4, "keys": [".current.focus()"]}, {"text": "② 5글자 이상이면 alert 후 입력 폼 비우기", "pts": 2, "keys": ["settext(\"\")", "settext('')", ".value=\"\"", ".value=''"]}], "explain": "Ref 객체는 current 프로퍼티로 돔 요소에 접근한다(textRef.focus()가 아니라 textRef.current.focus()). value를 State로 관리하므로 입력 폼을 비울 때는 setText(\"\")가 안전하다."}, {"id": "c005", "kind": "code", "ch": "6장", "q": "컴포넌트가 마운트될 때 한 번만 콘솔에 '마운트'를 출력하는 App 컴포넌트를 `useEffect`로 작성하시오. (import 문 포함)", "points": 10, "answer": "import { useEffect } from \"react\";\n\nfunction App() {\n  useEffect(() => {\n    console.log(\"마운트\");\n  }, []);\n\n  return <div>App<\/div>;\n}\n\nexport default App;", "rubric": [{"text": "react에서 useEffect import", "pts": 2, "keys": ["import{useeffect}", "useeffect}from", ",useeffect"]}, {"text": "useEffect(() => { ... }) 콜백 작성", "pts": 3, "keys": ["useeffect(()=>"]}, {"text": "console.log(\"마운트\")", "pts": 2, "keys": ["console.log(\"마운트\")", "console.log('마운트')", "console.log(`마운트`)"]}, {"text": "빈 의존성 배열 []", "pts": 3, "keys": ["},[]);", "},[])"]}], "explain": "의존성 배열을 생략하면 렌더링될 때마다 실행되고, []을 주어야 마운트 시 한 번만 실행된다."}, {"id": "c006", "kind": "code", "ch": "6장", "q": "count가 짝수일 때만 렌더링되는 Even 컴포넌트를 작성하시오. Even은 '현재 카운트는 짝수입니다'를 출력하고, 화면에서 사라질(언마운트될) 때 콘솔에 'Even 컴포넌트 언마운트'를 출력해야 한다. App의 return 문에 Even을 조건부 렌더링하는 코드 한 줄도 함께 쓰시오.", "points": 10, "answer": "// Even.jsx\nimport { useEffect } from \"react\";\n\nfunction Even() {\n  useEffect(() => {\n    return () => {\n      console.log(\"Even 컴포넌트 언마운트\");\n    };\n  }, []);\n\n  return <div>현재 카운트는 짝수입니다<\/div>;\n}\n\nexport default Even;\n\n// App.jsx의 return 문 안\n{count % 2 === 0 && <Even />}", "rubric": [{"text": "클린업 함수 반환: return () => { ... }", "pts": 4, "keys": ["return()=>"]}, {"text": "빈 의존성 배열 []", "pts": 2, "keys": ["},[]);", "},[])"]}, {"text": "&&로 조건부 렌더링", "pts": 4, "keys": ["count%2===0&&<even/>", "count%2==0&&<even/>", "&&<even/>", "?<even/>:null"]}], "explain": "AND 단락 평가: 앞의 조건이 참이면 뒤의 <Even />이 값으로 반환되어 렌더링되고, 거짓이면 렌더링되지 않아 언마운트된다."}, {"id": "c007", "kind": "code", "ch": "카운터앱", "q": "카운터 앱의 App 컴포넌트를 완성하시오. App은 count State(초기값 0)를 가지며, Viewer에는 count를, Controller에는 count를 value만큼 바꾸는 함수 onClickButton을 Props로 전달한다. (Viewer와 Controller는 이미 완성되어 있고, 각각 `{ count }`, `{ onClickButton }`을 Props로 받는다.)", "code": "import { useState } from \"react\";\nimport Viewer from \"./components/Viewer\";\nimport Controller from \"./components/Controller\";\n\nfunction App() {\n  // 여기에 작성\n}\n\nexport default App;\n\n// 참고 - Controller 내부: <button onClick={() => onClickButton(-1)}>-1<\/button>", "points": 10, "answer": "import { useState } from \"react\";\nimport Viewer from \"./components/Viewer\";\nimport Controller from \"./components/Controller\";\n\nfunction App() {\n  const [count, setCount] = useState(0);\n\n  const onClickButton = (value) => {\n    setCount(count + value);\n  };\n\n  return (\n    <div className=\"App\">\n      <h1>Simple Counter<\/h1>\n      <section>\n        <Viewer count={count} />\n      <\/section>\n      <section>\n        <Controller onClickButton={onClickButton} />\n      <\/section>\n    <\/div>\n  );\n}\n\nexport default App;", "rubric": [{"text": "App에 useState(0)", "pts": 2, "keys": ["usestate(0)"]}, {"text": "setCount(count + value)", "pts": 3, "keys": ["setcount(count+value)", "setcount(value+count)"]}, {"text": "<Viewer count={count} />", "pts": 2, "keys": ["<viewercount={count}"]}, {"text": "<Controller onClickButton={onClickButton} />", "pts": 3, "keys": ["<controlleronclickbutton={onclickbutton}"]}], "explain": "형제인 Viewer와 Controller가 같은 State를 써야 하므로 공통 부모 App에 State를 둔다(State 끌어올리기)."}, {"id": "c008", "kind": "code", "ch": "투두앱", "q": "TodoList 컴포넌트가 Props로 받은 배열 todo를 `map`으로 TodoItem 컴포넌트 목록으로 렌더링하도록 작성하시오. 각 TodoItem에는 key를 지정하고, 할 일 객체의 모든 프로퍼티(id, content, isDone, createdDate)를 개별 Props로 전달하시오.", "code": "import TodoItem from \"./TodoItem\";\n\nfunction TodoList({ todo }) {\n  return (\n    <div className=\"TodoList\">\n      <h4>Todo List 🌱<\/h4>\n      <div className=\"list_wrapper\">\n        {/* 여기에 작성 */}\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default TodoList;", "points": 10, "answer": "import TodoItem from \"./TodoItem\";\n\nfunction TodoList({ todo }) {\n  return (\n    <div className=\"TodoList\">\n      <h4>Todo List 🌱<\/h4>\n      <div className=\"list_wrapper\">\n        {todo.map((it) => (\n          <TodoItem key={it.id} {...it} />\n        ))}\n      <\/div>\n    <\/div>\n  );\n}\n\nexport default TodoList;", "rubric": [{"text": "todo.map으로 반복", "pts": 4, "keys": ["todo.map("]}, {"text": "key={it.id} 지정", "pts": 3, "keys": ["key={"]}, {"text": "{...it}로 프로퍼티 전달", "pts": 3, "keys": ["{...", "content={"]}], "explain": "key가 없으면 'Each child in a list should have a unique key prop' 경고가 뜬다. 화살표 함수 본문을 { }로 감싸면 return을 꼭 써야 한다."}, {"id": "c009", "kind": "code", "ch": "투두앱", "q": "App 컴포넌트에서 id가 targetId인 할 일을 State 배열 todo에서 삭제하는 함수 onDelete를 작성하시오. (State: `const [todo, setTodo] = useState(mockTodo);` 원본 배열을 직접 수정하지 말 것)", "points": 10, "answer": "const onDelete = (targetId) => {\n  setTodo(todo.filter((it) => it.id !== targetId));\n};", "rubric": [{"text": "매개변수 targetId를 받는 화살표 함수", "pts": 2, "keys": ["(targetid)=>"]}, {"text": "setTodo로 State 변경", "pts": 2, "keys": ["settodo("]}, {"text": "filter로 새 배열 생성", "pts": 3, "keys": ["filter(", ".filter"]}, {"text": "id가 targetId가 아닌 것만 남김", "pts": 3, "keys": ["!==targetid", "!=targetid", "targetid!=="]}], "explain": "filter는 조건이 참인 요소만 모은 새 배열을 반환한다. === 로 쓰면 삭제할 항목만 남는 반대 결과가 된다."}, {"id": "c010", "kind": "code", "ch": "투두앱", "q": "체크박스를 클릭하면 id가 targetId인 할 일의 완료 여부(isDone)를 반대로 바꾸는 함수 onUpdate를 작성하시오. 나머지 할 일은 그대로 유지하고, 원본 배열과 객체를 직접 수정하지 말 것.", "points": 10, "answer": "const onUpdate = (targetId) => {\n  setTodo(\n    todo.map((it) =>\n      it.id === targetId ? { ...it, isDone: !it.isDone } : it\n    )\n  );\n};", "rubric": [{"text": "map으로 새 배열 생성", "pts": 3, "keys": ["todo.map(", ".map("]}, {"text": "id === targetId 비교", "pts": 2, "keys": ["===targetid", "targetid==="]}, {"text": "{ ...it, isDone: !it.isDone } 새 객체", "pts": 3, "keys": ["{...it,isdone:!it.isdone}", "isdone:!it.isdone", "isdone:!"]}, {"text": "나머지는 그대로(: it)", "pts": 2, "keys": [":it)", ":item)", ":it;", "returnit;"]}], "explain": "it.isDone = !it.isDone처럼 객체를 직접 바꾸면 원본 State를 수정하는 것이므로, 스프레드로 복사한 새 객체를 만든다. TodoItem에서는 체크박스 onChange에서 onUpdate(id)를 호출한다."}], "img": {"mascot": "data:image/webp;base64,UklGRvZHAABXRUJQVlA4WAoAAAAQAAAA2AAAKwEAQUxQSEwVAAAB/yckSPD/eGtEpO4TkNw2kiTJYQPT3ZP///AaNcs9ov8TQKdFf5WKofRgSVa12JPsJ6p2HtpV1U1VVYcVIEpyZhtKxVKRBJAvyYsoCUN7QBfjJMmR5wMtJAHxlQKWlLQoCwVavhdFdWxr/2/AA+/fYgNtAK9XV6bkmfRUTfb3I26x4cXo8aKWN7B6tYTl65UsfFR1YEmuI/sACaoO2C6W01joTJKGLi+uJ3jj/3911GrbPt/fP2MMg0MHt7YUl21Vut31cHd3d3d3P47K4UfPenseuz1gW42WulKo4iMw6DCWrP/vQTLJylqZlacRMQEUV4ss/MB7lnRdOrrnMSzSTvZ+z2/91Ld8LTD1f7/5jKltMNZ+3QZIInhg7Gf/ztoFoUVUYjADPAZ+ntAeSH3DYEwfxddhbUHgp2gw2vAqrA2Qel4OsT4Svwm1AcbVidGgx7HtWCoyFSmx3WIjxJ7vQA3JSACCx6IE/XhD4uPzEtUnq0SYP2vyNJgXpk4al6/fSX2WxO73fuTqJd3loUf/5ylUlMbSiOGd9VnFvvm7mbZ8069SlE9gDeFsot7S1MY/B4+qiiWe6S1KB6IaE8uJ0wW+7oeJBKOmVzp0QUUocuBtYgpzzVXL+L7dJB3UW+G5s4rFx230y3hDo <script>/* util.js — 공용 도구: 글자 이스케이프, 브라우저 저장, 페이지 안 대화상자 */
(function () {
  'use strict';
  const L = window.RL = window.RL || {};
  L.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  L.store = {
    get(k, d) { try { const v = localStorage.getItem('reactlab.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('reactlab.' + k, JSON.stringify(v)); } catch (e) { } },
    del(k) { try { localStorage.removeItem('reactlab.' + k); } catch (e) { } },
  };
  // confirm/prompt 대신 쓰는 대화상자. buttons: [{k, label, pri}] → Promise<{k}>
  L.dialog = function (o) {
    return new Promise(res => {
      const w = document.createElement('div'); w.className = 'dlg-back';
      const btns = o.buttons || [{ k: 'cancel', label: '취소' }, { k: 'ok', label: o.ok || '확인', pri: true }];
      w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dlg-t" id="dlg-t">${L.esc(o.title || '')}</div>${o.msg ? `<div class="dlg-m">${L.esc(o.msg).replace(/\n/g, '<br>')}</div>` : ''}<div class="dlg-b">${btns.map(b => `<button class="dlg-btn${b.pri ? ' pri' : ''}" data-k="${b.k}">${L.esc(b.label)}</button>`).join('')}</div></div>`;
      document.body.appendChild(w);
      const pri = w.querySelector('.dlg-btn.pri') || w.querySelector('.dlg-btn');
      setTimeout(() => pri.focus(), 0);
      const done = k => { w.remove(); res({ k }); };
      w.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) done(b.dataset.k); else if (e.target === w) done('cancel'); });
      w.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('cancel'); } }, true);
    });
  };
  L.ask = async (title, msg, ok) => (await L.dialog({ title, msg, ok })).k === 'ok';
})();

/* cbt.js — 홈 화면, 필기 연습, 실전 모의고사 (러닝메이트 React 중간고사) */
(function () {
  'use strict';
  const L = window.RL; const esc = L.esc;
  const D = L.DATA;
  // 서술형·코드 작성 문제(essay.json)는 kind 를 type 으로 써서 필기 문제와 한 목록으로 다룸

  const AREA = { single: '이해', multi: '이해', review: '코드리뷰', blank: '코드리뷰', code: '코드 작성', essay: '서술형' };
  const AREAS = ['이해', '코드리뷰', '코드 작성', '서술형'];

  const squash = s => String(s || '').replace(/\s+/g, '').toLowerCase();

  const KW = /^(const|let|var|function|new|typeof|class|extends|this|true|false|null|undefined|async|of|in)$/;
